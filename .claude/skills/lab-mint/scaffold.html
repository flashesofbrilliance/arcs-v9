<meta charset="utf-8">
<title>ARCS · {{SURFACE_NAME}}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
  :root{
    --bg:#020408;--surface:#0d1117;--border:#1e293b;--line:#1c2736;--hair:#141c28;--rule:#2a3647;
    --fg1:#e2e8f0;--ink-soft:#c8d2e0;--muted:#94a3b8;--faint:#707e92;
    --cyan:#00F0FF;--green:#00FF9D;--gold:#FFD700;--red:#FF4D6D;--violet:#A78BFA;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--sans:'Inter',system-ui,sans-serif;
    --glass:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.01) 38%,rgba(0,0,0,.18)),linear-gradient(165deg,#131b23,#0b1117);
    --well:linear-gradient(180deg,#090d12,#0c1219);
    --emboss:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -2px 6px rgba(0,0,0,.55),0 5px 14px rgba(0,0,0,.45);
    --deboss:inset 0 2px 5px rgba(0,0,0,.65),inset 0 -1px 0 rgba(255,255,255,.04);
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1100px 620px at 18% -8%,rgba(0,240,255,.05),transparent 60%),var(--bg);
    color:var(--fg1);font-family:var(--sans);line-height:1.55;font-size:15px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:920px;margin:clamp(14px,3vw,40px) auto;padding:0 clamp(14px,3vw,28px)}
  .head{border-bottom:1px solid var(--border);padding-bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .wordmark{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);font-weight:700;text-shadow:0 0 10px rgba(0,240,255,.35)}
  .wordmark a{color:var(--cyan);text-decoration:none}
  .head .meta{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.06em}
  h1{font-family:var(--sans);font-size:clamp(24px,4.4vw,34px);font-weight:600;margin:24px 0 .25em;letter-spacing:-.02em}
  .stand{color:var(--muted);max-width:none;margin:.2em 0 0;line-height:1.7} .stand b{color:var(--ink-soft);font-weight:600}
  /* ACTION — the one obvious thing, System-1 first */
  .tool{margin-top:26px;background:var(--glass);border:1px solid var(--rule);border-radius:14px;padding:18px 20px;box-shadow:var(--emboss)}
  input,textarea{font-family:var(--sans);font-size:14px;background:var(--well);border:1px solid var(--line);border-radius:8px;color:var(--fg1);padding:10px 12px;width:100%;box-shadow:var(--deboss);transition:.16s;margin-bottom:12px}
  input:focus,textarea:focus{outline:none;border-color:rgba(0,240,255,.4);box-shadow:inset 0 2px 5px rgba(0,0,0,.55),inset 0 -9px 14px -9px rgba(0,240,255,.34),0 0 0 1px rgba(0,240,255,.23)}
  textarea{resize:vertical;min-height:70px;line-height:1.6}
  .btn{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.04em;color:#bdf6ff;background:linear-gradient(180deg,#0b1620,#0a1218);border:1px solid rgba(0,240,255,.4);border-radius:8px;padding:10px 18px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(120,245,255,.28),inset 0 -8px 12px -7px rgba(0,240,255,.4),0 0 11px rgba(0,240,255,.14),0 4px 12px rgba(0,0,0,.45);transition:.16s}
  .btn:hover{color:#eafeff;border-color:rgba(0,240,255,.62)}
  /* RECEIPT — the reward (hero), where how-to-read is learned by seeing */
  .recs{margin-top:26px;display:flex;flex-direction:column;gap:18px}
  .receipt{background:var(--glass);border:1px solid rgba(255,215,0,.34);border-radius:14px;box-shadow:var(--emboss);padding:18px 20px}
  .coord{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .cell{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--well);box-shadow:var(--deboss);display:flex;flex-direction:column;gap:3px;min-width:96px}
  .cell .k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700}
  .cell .v{font-size:15px;font-weight:700;color:var(--fg1)}
  /* MECHANISM — pulled not pushed */
  details.how{margin-top:28px;border-top:1px solid var(--border);padding-top:8px}
  details.how summary{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;cursor:pointer;padding:10px 0;list-style:none}
  details.how summary::-webkit-details-marker{display:none}
  details.how summary::before{content:"▸ ";color:var(--cyan)} details.how[open] summary::before{content:"▾ "}
  footer{font-family:var(--mono);font-size:11px;color:var(--faint);margin:32px 0 44px;line-height:1.8;border-top:1px solid var(--border);padding-top:16px}
</style>

<div class="wrap">
  <div class="head">
    <div class="wordmark"><a href="/">&larr; ARCS Lab</a> &middot; {{SURFACE_NAME}}</div>
    <div class="meta" id="stamp"></div>
  </div>

  <!-- TRIGGER: speak the fire, not the mechanism -->
  <h1>{{FIRE_HEADLINE}}</h1>
  <p class="stand"><b>{{ONE_ACTION_LINE}}</b> {{BENEFIT}}</p>

  <!-- ACTION: one obvious thing -->
  <div class="tool">
    <textarea id="in" placeholder="{{INPUT_PLACEHOLDER}}"></textarea>
    <button class="btn" id="go">{{CTA}} &rarr;</button>
  </div>

  <!-- REWARD: receipts render here (open seeds) -->
  <div id="recs" class="recs"></div>

  <!-- MECHANISM: collapsed, pulled by curiosity -->
  <details class="how">
    <summary>How this works</summary>
    <p class="stand" style="margin-top:12px">{{MECHANISM_EXPLAINER}}</p>
  </details>

  <footer>{{FOOTER}} Saved locally in this browser.</footer>
</div>

<script>
(function(){
  "use strict";
  var KEY="arcs-{{KEY_SLUG}}-v1";
  var uid=function(){return Math.random().toString(36).slice(2,9)};
  var items=[]; try{var r=localStorage.getItem(KEY); if(r) items=JSON.parse(r)||[];}catch(e){}
  var save=function(){try{localStorage.setItem(KEY,JSON.stringify(items));}catch(e){}};
  function esc(s){return String(s).replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];});}
  // seed helpers (unicode-safe) — the choreography seam
  function seedLink(o){return location.origin+location.pathname+"#seed="+btoa(unescape(encodeURIComponent(JSON.stringify(o))));}
  function loadSeed(){var m=location.hash.match(/seed=([^&]+)/);if(!m)return null;try{return JSON.parse(decodeURIComponent(escape(atob(m[1]))));}catch(e){return null;}}

  function receipt(item){ /* {{RECEIPT_LOGIC}} — compute the readout that embodies how-to-read */ return {}; }
  function render(){
    var host=document.getElementById("recs"); host.innerHTML="";
    items.forEach(function(it){
      var el=document.createElement("div"); el.className="receipt"; el.dataset.id=it.id;
      el.innerHTML="{{RECEIPT_TEMPLATE}}"; host.appendChild(el);
    });
  }
  document.getElementById("go").addEventListener("click",function(){
    var v=document.getElementById("in").value.trim(); if(!v){document.getElementById("in").focus();return;}
    items.unshift({id:uid(),input:v}); document.getElementById("in").value=""; save();render();
  });
  (function(){var s=loadSeed(); if(s){ /* onramp: pre-fill from seed */ if(s.v) document.getElementById("in").value=s.v; }})();
  try{document.getElementById("stamp").textContent="local · "+items.length;}catch(e){}
  render();
})();
</script>
