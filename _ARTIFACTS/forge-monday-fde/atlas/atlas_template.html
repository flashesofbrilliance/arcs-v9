<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>monday take-home Atlas</title>
<!-- KINTSUGI SEAMS: generated by atlas/build_atlas.py. Priors are subjective, research is static reads, personas are hypotheses with placeholder names, no assignment content, no credentials. Private: do not publish. -->
<style>
:root{--bg:#020408;--surface:#0d1117;--elev:#111823;--border:#1e293b;--text:#e2e8f0;--muted:#8391a7;--cyan:#00F0FF;--green:#00FF9D;--gold:#FFD700;--red:#FF4D6D}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--cyan)}
header{border-bottom:1px solid var(--border);padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1.t{font-size:18px;letter-spacing:-.01em}h1.t span{color:var(--cyan)}
.badges{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-size:12px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 11px}
.GREEN{color:var(--green);border-color:rgba(0,255,157,.5)}.YELLOW{color:var(--gold);border-color:rgba(255,215,0,.55)}.RED{color:var(--red);border-color:rgba(255,77,109,.6)}
.pill b{font-weight:700}
.shell{display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px;padding:18px 20px;max-width:1280px;margin:0 auto}
@media(max-width:900px){.shell{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.panel h2{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:600}
.tier{cursor:pointer;outline:none}
.tier rect{stroke:#334155;stroke-width:1.5}
.tier:focus rect,.tier.sel rect{stroke:var(--cyan);stroke-width:3}
.tier text{fill:#e2e8f0;font-size:12px;pointer-events:none}
.tier .s{fill:#8391a7;font-size:10px}
.legend{font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px}
.bar{display:grid;grid-template-columns:150px 1fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:12.5px}
.bar .tr{height:10px;background:var(--elev);border:1px solid var(--border);border-radius:999px;overflow:hidden}
.bar .f{height:100%;background:var(--cyan)}.bar .f.r{background:var(--red)}.bar .f.y{background:var(--gold)}.bar .f.g{background:var(--green)}
.bar .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer}
.tab.on{color:var(--text);border-color:var(--cyan)}
input.search{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 12px;font-size:14px;margin-bottom:12px}
.cards{display:grid;gap:10px}
.card{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 14px;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.card:hover,.card:focus{border-color:var(--cyan);outline:none}
.card .m{font-size:12px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:baseline}
.dot.pass{background:var(--green)}.dot.fail{background:var(--red)}.dot.src{background:#64748b}.dot.na{background:#64748b}
.st{font-size:11px;border-radius:6px;padding:1px 7px;margin-left:6px}.st.new{background:rgba(0,240,255,.14);color:var(--cyan)}.st.changed{background:rgba(255,215,0,.14);color:var(--gold)}
article.doc{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 24px}
article.doc h1{font-size:24px;margin-bottom:2px}article.doc h2{font-size:18px;margin:20px 0 6px}article.doc h3{font-size:15px;margin:16px 0 4px}article.doc h4,article.doc h5{font-size:14px;margin:12px 0 4px}
article.doc p,article.doc li{color:#cbd5e1;margin:6px 0;max-width:86ch}
article.doc ul,article.doc ol{padding-left:22px}
article.doc .path{font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;margin-bottom:12px}
article.doc blockquote{border-left:3px solid var(--border);padding-left:12px;color:#cbd5e1;margin:10px 0}
article.doc pre{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;overflow:auto;font-size:12.5px;margin:10px 0}
article.doc code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#cbd5e1}
article.doc table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0}
article.doc th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border)}
article.doc td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.scroll{overflow-x:auto}
button.back{background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer;margin-bottom:12px}
iframe.board{width:100%;height:78vh;border:1px solid var(--border);border-radius:12px;background:var(--bg)}
.tierhead h2{font-size:20px;text-transform:none;letter-spacing:0;color:var(--text)}
.tierhead p{color:var(--muted);margin-bottom:12px}
.apex{border-color:rgba(0,240,255,.4)}
</style></head>
<body>
<header>
 <h1 class="t">monday.com take-home <span>Atlas</span></h1>
 <div class="badges" id="badges"></div>
</header>
<div class="shell">
 <aside>
  <div class="panel"><h2>Ziggurat: base to apex</h2>
   <svg id="zig" viewBox="0 0 320 400" role="group" aria-label="Ziggurat tiers" width="100%"></svg>
   <p class="legend">Gate colour: <i style="background:#134e3a"></i>all pass <i style="background:#5b1f2c"></i>a gate fails <i style="background:#1e293b"></i>source material. Fog: older edits fade.</p>
  </div>
  <div class="panel apex"><h2>Apex: the thesis</h2><p id="apex"></p></div>
  <div class="panel"><h2>Pressure (Monte Carlo, subjective priors)</h2><div id="pressure"></div></div>
  <div class="panel"><h2>Since last build</h2><div id="changes"></div></div>
 </aside>
 <main>
  <div class="tabs" id="tabs"></div>
  <div id="v-tier"><input class="search" id="q" placeholder="Search every document" aria-label="Search every document"><div id="tierhead" class="tierhead"></div><div class="cards" id="cards"></div></div>
  <div id="v-board" hidden><iframe class="board" title="Prep board" srcdoc="__BOARD__"></iframe></div>
  <div id="v-art" hidden><div class="cards" id="arts"></div></div>
  <div id="v-doc" hidden><button class="back" id="back">Back</button>__ARTICLES__</div>
 </main>
</div>
<script>
window.ATLAS = __DATA__;
(function(){
 var A=window.ATLAS, tier=4, view="tier";
 function el(t,c,x){var e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e;}
 var badges=document.getElementById("badges");
 var g=el("span","pill "+A.gate,"Gate: "+A.gate); g.firstChild.nodeValue="Gate: "+A.gate; badges.appendChild(g);
 var cd=el("span","pill","");badges.appendChild(cd);
 badges.appendChild(el("span","pill","Brief: "+(A.flags.brief_read?"read":"not yet read")));
 badges.appendChild(el("span","pill","Link: "+(A.flags.link_opened?"opened":"not opened")));
 badges.appendChild(el("span","pill","Log entries: "+A.entries));
 badges.appendChild(el("span","pill","Built "+A.built+(A.watch?" (live)":"")));
 function tick(){var ms=new Date(A.flags.deadline).getTime()-Date.now(); if(ms<=0){cd.textContent="Deadline passed";return;} var d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5); cd.textContent="Deadline in "+d+"d "+h+"h";} tick(); setInterval(tick,60000);
 document.getElementById("apex").textContent=A.apex;
 // ziggurat
 var svg=document.getElementById("zig"), NS="http://www.w3.org/2000/svg", W=[300,250,200,150,100], H=58, base=390;
 function docsOf(n){return A.docs.filter(function(d){return d.tier===n;});}
 function fogOf(ds){ if(!ds.length) return 1; var a=ds.reduce(function(s,d){return s+d.age_h;},0)/ds.length; return a<6?1:(a<24?.85:.62);}
 A.tiers.forEach(function(t){
   var ds=docsOf(t.n), fail=ds.some(function(d){return d.gate==="fail";}), pass=ds.some(function(d){return d.gate==="pass";});
   var w=W[t.n], x=(320-w)/2, y=base-(t.n+1)*H-t.n*4;
   var gp=document.createElementNS(NS,"g"); gp.setAttribute("class","tier"+(t.n===tier?" sel":"")); gp.setAttribute("tabindex","0"); gp.setAttribute("role","button"); gp.setAttribute("aria-label","Tier "+t.n+" "+t.name+", "+ds.length+" documents"); gp.dataset.n=t.n;
   var r=document.createElementNS(NS,"rect"); r.setAttribute("x",x); r.setAttribute("y",y); r.setAttribute("width",w); r.setAttribute("height",H); r.setAttribute("rx",6);
   r.setAttribute("fill",fail?"#5b1f2c":(pass?"#134e3a":"#1e293b")); r.setAttribute("opacity",fogOf(ds)); gp.appendChild(r);
   var t1=document.createElementNS(NS,"text"); t1.setAttribute("x",160); t1.setAttribute("y",y+24); t1.setAttribute("text-anchor","middle"); t1.textContent="Tier "+t.n+" · "+t.name; gp.appendChild(t1);
   var t2=document.createElementNS(NS,"text"); t2.setAttribute("x",160); t2.setAttribute("y",y+42); t2.setAttribute("text-anchor","middle"); t2.setAttribute("class","s"); t2.textContent=ds.length+" docs"+(ds.length?" · "+ds.filter(function(d){return d.status!=="same";}).length+" changed":""); gp.appendChild(t2);
   function go(){tier=t.n;show("tier");} gp.addEventListener("click",go); gp.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});
   svg.appendChild(gp);
 });
 var ap=document.createElementNS(NS,"polygon"); ap.setAttribute("points","160,"+(base-5*H-5*4-30)+" 175,"+(base-5*H-5*4)+" 145,"+(base-5*H-5*4)); ap.setAttribute("fill","#00F0FF"); ap.setAttribute("opacity",".85"); svg.appendChild(ap);
 // pressure
 var pr=document.getElementById("pressure"), mc=A.mc||{};
 function bar(l,v,c){var r=el("div","bar"); r.appendChild(el("span",null,l)); var tr=el("div","tr"),f=el("div","f "+c); f.style.width=(v*100)+"%"; tr.appendChild(f); r.appendChild(tr); r.appendChild(el("span","v",v.toFixed(2))); pr.appendChild(r);}
 if(mc.base!=null){bar("No pre-work",mc.base,"r");} if(mc.plan!=null){bar("With mitigations",mc.plan,"y");}
 (mc.evidence||[]).forEach(function(e){bar(e[0].replace(/^E\d /,""),e[1],"g");});
 if(mc.kill0!=null){bar("KILL fail, none",mc.kill0,"r"); bar("KILL fail, plan",mc.kill1,"y"); if(mc.kill2!=null)bar("KILL fail, + evidence",mc.kill2,"g");}
 if(!pr.childNodes.length) pr.textContent="No Monte Carlo results found.";
 var ch=document.getElementById("changes");
 if(A.changed.length){var ul=el("ul");A.changed.forEach(function(p){ul.appendChild(el("li",null,p));});ch.appendChild(ul);} else ch.textContent="No changes since the last build.";
 // tabs
 var tabs=document.getElementById("tabs");
 [["tier","Tiers and docs"],["board","Board"],["art","Artifacts"]].forEach(function(t){var b=el("button","tab"+(t[0]==="tier"?" on":""),t[1]); b.dataset.v=t[0]; b.addEventListener("click",function(){show(t[0]);}); tabs.appendChild(b);});
 function show(v){
   view=v; ["tier","board","art","doc"].forEach(function(k){document.getElementById("v-"+k).hidden=(k!==v);});
   Array.prototype.forEach.call(tabs.children,function(b){b.className="tab"+(b.dataset.v===v?" on":"");});
   Array.prototype.forEach.call(svg.querySelectorAll(".tier"),function(g2){g2.setAttribute("class","tier"+(+g2.dataset.n===tier?" sel":""));});
   if(v==="tier") renderTier();
 }
 function card(d){
   var b=el("button","card"); var l=el("div"); var dot=el("span","dot "+(d.gate||"na")); l.appendChild(dot); l.appendChild(document.createTextNode(d.title));
   if(d.status==="new"||d.status==="changed"){l.appendChild(el("span","st "+d.status,d.status));}
   var m=el("div","m", d.path+" · "+d.words+" words · edited "+(d.age_h<1?"<1":d.age_h)+" h ago"+(d.gates&&Object.keys(d.gates).length?" · "+Object.keys(d.gates).map(function(k){return k+":"+d.gates[k];}).join(" "):""));
   l.appendChild(m); b.appendChild(l); b.addEventListener("click",function(){openDoc(d.id);}); return b;
 }
 function renderTier(){
   var q=document.getElementById("q").value.toLowerCase().trim(), c=document.getElementById("cards"), h=document.getElementById("tierhead"); c.innerHTML=""; h.innerHTML="";
   if(q){ A.docs.filter(function(d){return d.title.toLowerCase().indexOf(q)>=0||d.text.indexOf(q)>=0;}).forEach(function(d){c.appendChild(card(d));}); if(!c.childNodes.length)c.textContent="No matches."; return;}
   var t=A.tiers[tier]; var hh=el("h2",null,"Tier "+t.n+" · "+t.name); h.appendChild(hh); h.appendChild(el("p",null,t.sub));
   var ds=docsOf(tier); ds.forEach(function(d){c.appendChild(card(d));});
   if(tier===4){var b=el("button","card"); b.appendChild(el("div",null,"Open the board: runway, risk, ladder, claims, gates")); b.addEventListener("click",function(){show("board");}); c.appendChild(b);}
 }
 function openDoc(id){ Array.prototype.forEach.call(document.querySelectorAll("article.doc"),function(a){a.hidden=("d-"+id)!==a.id;}); show("doc"); history.replaceState(null,"","#doc="+id); window.scrollTo(0,0); }
 document.getElementById("back").addEventListener("click",function(){show("tier");history.replaceState(null,"",location.pathname+location.search);});
 document.getElementById("q").addEventListener("input",renderTier);
 var arts=document.getElementById("arts"); A.artifacts.forEach(function(a){var x=el("a","card",""); x.href=a.path; x.target="_blank"; x.rel="noopener"; x.appendChild(el("div",null,a.title+"  ("+a.path+")")); arts.appendChild(x);});

 if(A.watch){ setInterval(function(){ var sc=document.createElement("script"); sc.src="atlas/version.js?"+Date.now(); sc.onload=function(){ if(window.ATLAS_VERSION&&window.ATLAS_VERSION!==A.version) location.reload(); sc.remove(); }; sc.onerror=function(){sc.remove();}; document.head.appendChild(sc); },3000); }
 var m=location.hash.match(/^#doc=(.+)$/); if(m&&document.getElementById("d-"+m[1])) openDoc(m[1]); else show("tier");
})();
</script>
</body></html>
