<script>
const CAT = JSON.parse(document.getElementById('data').textContent);
const COLORS = {feedback:'var(--green)',project:'var(--cyan)',reference:'var(--steel)',user:'var(--gold)',
  repo:'var(--gold)','problem-shape':'var(--orange)',performer:'var(--purple)',unknown:'var(--fg4)'};
const indeg = {}; CAT.edges.forEach(e => indeg[e.to]=(indeg[e.to]||0)+1);
// pairwise connection strength (either direction) for "strongest edge" traversal
const strength = {};
CAT.edges.forEach(e=>{const k=e.from<e.to?e.from+'|'+e.to:e.to+'|'+e.from;strength[k]=(strength[k]||0)+1});
const fogClass = d => d<14?'f0':d<45?'f1':d<120?'f2':'f3';
const stratumOf = n => {const d=indeg[n.id]||0; return d===0?0:d<=2?1:d<=5?2:d<=9?3:4};
document.getElementById('gen').textContent='· '+CAT.nodes.length+' nodes · '+CAT.edges.length+' declared edges · gen '+CAT.generated;

// ── ziggurat layout: strata plates, nodes ringed by district azimuth ──────────
const STEP_Z=52, plane=document.getElementById('plane');
const strata=[[],[],[],[],[]];
CAT.nodes.forEach(n=>strata[stratumOf(n)].push(n));
const secList=[...new Set(CAT.nodes.map(n=>n.section))].sort();
const secAngle={}; secList.forEach((s,i)=>secAngle[s]=(i/secList.length)*Math.PI*2);
const positions={}, CX=0, CY=0;
let maxR=0;
strata.forEach((nodes,k)=>{
  if(!nodes.length) return;
  const R=Math.max(70, nodes.length*34/(2*Math.PI)) + (4-k)*26;
  maxR=Math.max(maxR,R);
  const plate=document.createElement('div');
  plate.className='plate';
  const pr=R+40;
  plate.style.cssText=`left:${CX-pr}px;top:${CY-pr}px;width:${pr*2}px;height:${pr*2}px;transform:translateZ(${k*STEP_Z}px)`;
  plate.innerHTML=`<span class="pl">S${k} · ${['uncited','echo 1-2','echo 3-5','echo 6-9','canon 10+'][k]} · ${nodes.length}</span>`;
  plane.appendChild(plate);
  nodes.sort((a,b)=>secAngle[a.section]-secAngle[b.section]||a.id.localeCompare(b.id));
  nodes.forEach((n,i)=>{
    const th=(i/nodes.length)*Math.PI*2 - Math.PI/2;
    const x=CX+R*Math.cos(th), y=CY+R*Math.sin(th);
    positions[n.id]=[x,y,k*STEP_Z];
    const deg=indeg[n.id]||0, glow=Math.min(14,deg*1.4);
    const t=document.createElement('div');
    t.className='tile '+fogClass(n.age_days); t.dataset.id=n.id;
    t.style.cssText=`left:${x-13}px;top:${y-13}px;--tc:${COLORS[n.type]||COLORS.unknown};--glow:${glow}px;transform:translateZ(${k*STEP_Z}px)`;
    t.innerHTML='<div class="top"></div><div class="pin"></div>';
    t.title=`${n.id} · S${k}${deg?` · echoed ×${deg}`:''}`;
    t.onclick=ev=>{ev.stopPropagation();select(n.id)};
    plane.appendChild(t);
  });
});
const EXT=maxR+80;
const svg=document.getElementById('threads');
svg.setAttribute('width',EXT*2);svg.setAttribute('height',EXT*2);
svg.style.left=(-EXT)+'px';svg.style.top=(-EXT)+'px';

// ── selection, dossier, threads ───────────────────────────────────────────────
let SEL=null;
function select(id){
  SEL=id;
  document.querySelectorAll('.tile.sel').forEach(t=>t.classList.remove('sel'));
  const el=document.querySelector(`.tile[data-id="${CSS.escape(id)}"]`);
  if(el) el.classList.add('sel');
  svg.innerHTML='';
  CAT.edges.filter(e=>e.from===id||e.to===id).forEach(e=>{
    const a=positions[e.from], b=positions[e.to]; if(!a||!b) return;
    const L=document.createElementNS('http://www.w3.org/2000/svg','line');
    L.setAttribute('x1',a[0]+EXT);L.setAttribute('y1',a[1]+EXT);
    L.setAttribute('x2',b[0]+EXT);L.setAttribute('y2',b[1]+EXT);
    L.setAttribute('stroke', e.from===id?'#00F0FF':'#FFD700');
    svg.appendChild(L);
  });
  const n=CAT.nodes.find(n=>n.id===id), deg=indeg[id]||0, k=stratumOf(n);
  const outs=CAT.edges.filter(e=>e.from===id), ins=CAT.edges.filter(e=>e.to===id);
  document.getElementById('dbody').innerHTML=`
    <div class="k">${n.kind} · ${n.type} · ${n.section}</div>
    <h2>${id}</h2>
    <p class="desc">${n.desc||'(no frontmatter description)'}</p>
    <div class="k">Field state</div>
    <div class="meta">stratum · S${k} (${['uncited','echo 1-2','echo 3-5','echo 6-9','canon 10+'][k]})<br>
    staleness · ${n.age_days}d (${['SHARP','DEGRADED','GRAIN','FOG'][+fogClass(n.age_days)[1]]})<br>
    echo weight · cited ×${deg}${n.promoted?'<br>PROMOTED / live':''}</div>
    ${outs.length?`<div class="k">Declares → (${outs.length})</div>`+outs.map(e=>`<a class="edge" onclick="select('${e.to}')">→ ${e.to}</a>`).join(''):''}
    ${ins.length?`<div class="k">Echoed by ← (${ins.length})</div>`+ins.map(e=>`<a class="edge" onclick="select('${e.from}')">← ${e.from}</a>`).join(''):''}
    <div class="k">Provenance</div>
    <div class="meta">${n.file||'(_SEEDS bank row)'} · edges DECLARED only · absent ancestry stays absent</div>`;
  document.getElementById('dossier').classList.add('open');
}
function closeDossier(){document.getElementById('dossier').classList.remove('open');svg.innerHTML='';
  document.querySelectorAll('.tile.sel').forEach(t=>t.classList.remove('sel'))}

// ── keyboard traversal: terrace walk + strongest-edge climb ──────────────────
function neighbors(id){return CAT.edges.filter(e=>e.from===id||e.to===id)
  .map(e=>e.from===id?e.to:e.from)}
function walk(dir){
  if(!SEL) return;
  const n=CAT.nodes.find(x=>x.id===SEL), k=stratumOf(n);
  const ring=strata[k].map(x=>x.id);
  const i=ring.indexOf(SEL);
  select(ring[(i+dir+ring.length)%ring.length]);
}
function climb(up){
  if(!SEL) return;
  const k=stratumOf(CAT.nodes.find(x=>x.id===SEL));
  const byId={}; CAT.nodes.forEach(n=>byId[n.id]=n);
  const cands=neighbors(SEL)
    .filter(id=>byId[id])
    .map(id=>({id, k2:stratumOf(byId[id]),
      s:strength[SEL<id?SEL+'|'+id:id+'|'+SEL]||0}))
    .filter(c=>up ? c.k2>k : c.k2<k)
    .sort((a,b)=>b.s-a.s || (indeg[b.id]||0)-(indeg[a.id]||0));
  if(cands.length){select(cands[0].id);return}
  // no declared path: step to the spatially nearest tile one stratum away
  // (an honest camera move, not an invented edge — nothing gets drawn)
  const k2=up?k+1:k-1;
  if(k2<0||k2>4||!strata[k2]||!strata[k2].length) return;
  const p=positions[SEL];
  const nearest=[...strata[k2]].sort((a,b)=>{
    const pa=positions[a.id],pb=positions[b.id];
    return ((pa[0]-p[0])**2+(pa[1]-p[1])**2)-((pb[0]-p[0])**2+(pb[1]-p[1])**2)})[0];
  select(nearest.id);
}
let ROT=45;
window.addEventListener('keydown',e=>{
  if(e.target===document.getElementById('q')) return;
  if(e.key==='ArrowLeft'){e.preventDefault();walk(-1)}
  else if(e.key==='ArrowRight'){e.preventDefault();walk(1)}
  else if(e.key==='ArrowUp'){e.preventDefault();climb(true)}
  else if(e.key==='ArrowDown'){e.preventDefault();climb(false)}
  else if(e.key==='['){ROT-=15;placePlane()}
  else if(e.key===']'){ROT+=15;placePlane()}
  else if(e.key==='Escape'){closeDossier()}
});
function placePlane(){plane.style.transform=`rotateX(58deg) rotateZ(${ROT}deg)`}
placePlane();

// ── filters ──────────────────────────────────────────────────────────────────
const active=new Set(Object.keys(COLORS));
const chipbox=document.getElementById('chips');
Object.entries(COLORS).forEach(([k,c])=>{
  if(k==='unknown')return;
  const s=document.createElement('span');
  s.className='chip on';s.style.setProperty('--c',c);s.textContent=k;
  s.onclick=()=>{s.classList.toggle('on');s.classList.contains('on')?active.add(k):active.delete(k);apply()};
  chipbox.appendChild(s);
});
const q=document.getElementById('q');
q.addEventListener('input',apply);
function apply(){
  const term=q.value.trim().toLowerCase();let vis=0;
  CAT.nodes.forEach(n=>{
    const el=document.querySelector(`.tile[data-id="${CSS.escape(n.id)}"]`);
    if(!el)return;
    const hit=(!term||n.id.includes(term)||(n.desc||'').toLowerCase().includes(term))&&active.has(n.type);
    el.classList.toggle('dim',!hit);if(hit)vis++;
  });
  document.getElementById('count').textContent=vis+' / '+CAT.nodes.length+' visible';
}
apply();

// ── pan + zoom ───────────────────────────────────────────────────────────────
const world=document.getElementById('world'),stage=document.getElementById('stage');
let px=0,py=0,zoom=.9,drag=null;
function place(){world.style.transform=`translate(${px}px,${py}px) scale(${zoom})`}
stage.addEventListener('pointerdown',e=>{drag=[e.clientX-px,e.clientY-py];stage.classList.add('dragging')});
window.addEventListener('pointermove',e=>{if(drag){px=e.clientX-drag[0];py=e.clientY-drag[1];place()}});
window.addEventListener('pointerup',()=>{drag=null;stage.classList.remove('dragging')});
stage.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(2.5,Math.max(.3,zoom*(e.deltaY<0?1.08:0.92)));place()},{passive:false});
stage.addEventListener('click',closeDossier);
place();

// boot on the apex's most-echoed node (the canon peak)
const apex=[...CAT.nodes].sort((a,b)=>(indeg[b.id]||0)-(indeg[a.id]||0))[0];
if(apex) select(apex.id);
</script>
