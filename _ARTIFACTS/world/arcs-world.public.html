<title>ARCS World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  /* One visual world, committed: the Field OS void. Every color painted explicitly. */
  :root{
    --bg:#020408; --surface:#0d1117; --elevated:#111827; --border:#1e293b; --border-hi:#2c3b52;
    --fg1:#e2e8f0; --fg2:#94a3b8; --fg3:#8593a6; --fg4:#64748b;
    --cyan:#00F0FF; --green:#00FF9D; --gold:#FFD700; --orange:#ff9d3c; --red:#FF4D6D; --violet:#9D7BFF;
    --serif:"Cormorant Garamond",Georgia,serif; --sans:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
    --measure:640px; color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(1200px 640px at 50% -12%,rgba(0,240,255,.07),transparent 62%),radial-gradient(900px 560px at 50% 112%,rgba(255,215,0,.045),transparent 60%),var(--bg);color:var(--fg1);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
  a{color:var(--cyan)}
  h1,h2,h3{margin:0;text-wrap:balance}
  p,li{max-width:var(--measure);text-wrap:pretty}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  .lab{font-family:var(--mono);font-size:.66rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--fg4);max-width:none;text-wrap:balance}
  .lab.cy{color:var(--cyan)} .lab.au{color:var(--gold)}
  @media (max-width:640px){.lab{letter-spacing:.08em}}

  /* ── frame ── */
  #frame{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);height:100%;min-height:0;max-width:100vw}
  #hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:12px clamp(14px,3vw,36px);border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(2,4,8,.96),rgba(2,4,8,.85))}
  #hud .room{font-family:var(--serif);font-size:1.25rem;font-weight:600;letter-spacing:-.005em;color:#fff}
  #hud .face{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;padding:3px 9px;border:1px solid var(--border-hi);border-radius:999px;color:var(--fg2);white-space:nowrap}
  #hud .face.private{border-color:var(--gold);color:var(--gold)}
  #hud .theta{font-family:var(--mono);font-size:.74rem;color:var(--fg3);font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:auto}
  #hud .keys{font-family:var(--mono);font-size:.64rem;color:var(--fg4);white-space:nowrap}
  @media (max-width:900px),(hover:none){#hud .keys{display:none}}
  #hud kbd{font:inherit;border:1px solid var(--border-hi);border-radius:3px;padding:0 5px;color:var(--fg2)}

  #scene{overflow-y:auto;overflow-x:hidden;padding:26px clamp(14px,3vw,36px) 40px;min-height:0;scrollbar-color:var(--border) var(--bg)}
  .room-title{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,5vw,3.6rem);line-height:.98;letter-spacing:-.015em;color:#fff;text-shadow:0 0 42px rgba(0,240,255,.12)}
  .room-title em{font-style:italic;font-weight:500;color:var(--cyan)}
  .lede{font-family:var(--serif);font-style:italic;font-size:1.2rem;color:var(--fg2);margin:10px 0 0;max-width:36ch}
  .lede b{color:var(--gold);font-style:normal;font-weight:500}
  .cols{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));margin-top:24px;align-items:start}
  .panel{border:1px solid var(--border);border-radius:6px;background:rgba(13,17,23,.92);padding:16px 18px;min-width:0}
  .panel h3{font-family:var(--serif);font-weight:600;font-size:1.3rem;color:#fff;margin-bottom:8px}
  .panel p{color:var(--fg2);font-size:.92rem;margin:0 0 .6em}
  .panel.wide{grid-column:1/-1}
  .rows{display:grid;gap:6px;margin-top:8px}
  .row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:7px 10px;border:1px solid var(--border);border-radius:4px;background:rgba(17,24,39,.6);font-size:.88rem;transition:opacity .25s,filter .25s}
  .row .k{font-family:var(--mono);font-size:.7rem;color:var(--cyan);white-space:nowrap}
  .row .t{color:var(--fg1);min-width:0}
  .row .d{font-family:var(--mono);font-size:.68rem;color:var(--fg4);white-space:nowrap;font-variant-numeric:tabular-nums}
  /* Chronos: --f is distance from irrefutable (0 nascent … 1 sound). Unborn things are not drawn. */
  .row{--f:1;opacity:calc(.38 + .62*var(--f));filter:blur(calc((1 - var(--f))*3.4px));letter-spacing:calc((1 - var(--f))*.022em);font-weight:calc(300 + 200*var(--f))}
  .row .t{font-weight:inherit}
  .row.unborn{display:none}
  @media (prefers-reduced-motion:no-preference){.row.nascent{animation:wobble 5.5s ease-in-out infinite}}
  @keyframes wobble{0%,100%{transform:translate(0,0) rotate(0)}30%{transform:translate(.5px,-.4px) rotate(.12deg)}65%{transform:translate(-.5px,.4px) rotate(-.12deg)}}
  .row:hover{--f:1;animation:none}
  .rows.void::after{content:"Nothing here exists yet at this now. Move the rail forward.";display:block;font-family:var(--serif);font-style:italic;color:var(--fg3);padding:10px 2px}
  .row .st{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)}
  .row.open{background:rgba(17,24,39,.95);border-color:var(--border-hi)}
  .row .more{display:none;grid-column:1/-1;font-size:.86rem;color:var(--fg2);border-top:1px dashed var(--border);padding-top:8px;margin-top:4px}
  .row.open .more.mol,.row.open .more.ctl{display:block}
  .row.deep .more.org{display:block}
  .row.deep .more.mol .drill.go{display:none}
  .row[data-depth="1"],.row[data-depth="2"]{cursor:pointer}
  .row .more.mol{border-left:2px solid var(--green);padding-left:12px}
  .row .more.org{border-left:2px solid var(--gold);padding-left:12px}
  .drill{appearance:none;font:600 .7rem var(--mono);letter-spacing:.06em;border:1px solid var(--border-hi);background:transparent;color:var(--fg2);border-radius:5px;padding:5px 10px;cursor:pointer;margin-top:6px}
  .drill.go{border-color:var(--gold);color:var(--gold)}
  .drill.go:hover{background:rgba(255,215,0,.08)}
  .drill.back:hover{border-color:var(--fg2);color:var(--fg1)}
  .row .d .drill{margin:0 0 0 8px;padding:2px 7px;font-size:.62rem}
  .row .more.ctl{border-top:0;padding-top:0;margin-top:2px}
  .row .more dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0}
  .row .more dt{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;color:var(--fg4);padding-top:3px}
  .row .more dd{margin:0}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-family:var(--mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--border-hi);border-radius:999px;color:var(--fg2);white-space:nowrap}
  .chip.ok{border-color:var(--green);color:var(--green)} .chip.true{border-color:var(--cyan);color:var(--cyan)} .chip.shore{border-color:var(--orange);color:var(--orange)} .chip.gate{border-color:var(--red);color:var(--red)}
  .quote{font-family:var(--serif);font-size:1.12rem;line-height:1.45;color:var(--fg1);border-left:2px solid var(--gold);padding-left:14px;margin:0 0 10px;max-width:var(--measure)}
  .quote small{display:block;font-family:var(--mono);font-size:.66rem;color:var(--fg4);margin-top:6px;letter-spacing:.06em}
  .md h1,.md h2,.md h3{font-family:var(--serif);color:#fff;margin:1em 0 .4em}
  .md h1{font-size:1.6rem}.md h2{font-size:1.3rem}.md h3{font-size:1.1rem}
  .md p{color:var(--fg2);font-size:.92rem}
  .md blockquote{border-left:2px solid var(--gold);margin:0;padding-left:14px;color:var(--fg1);font-family:var(--serif);font-size:1.05rem}
  .md table{border-collapse:collapse;font-size:.82rem;margin:8px 0;width:100%}
  .md th,.md td{border:1px solid var(--border);padding:5px 8px;text-align:left;vertical-align:top}
  .md th{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--fg4)}
  .md code{font-family:var(--mono);font-size:.78rem;color:var(--cyan)}
  .md .tw{overflow-x:auto}
  .gated{border:1px dashed var(--gold);border-radius:6px;padding:18px;color:var(--fg2);background:rgba(255,215,0,.03)}
  .gated b{color:var(--gold)}
  .doors{margin-top:26px;border-top:1px solid var(--border);padding-top:14px}
  .door{display:inline-flex;flex-direction:column;gap:2px;border:1px solid var(--border-hi);border-radius:6px;padding:9px 12px;margin:6px 8px 0 0;background:rgba(13,17,23,.9);cursor:pointer;color:var(--fg1);font:inherit;text-align:left;max-width:320px}
  .door:hover{border-color:var(--cyan)}
  .door .to{font-family:var(--serif);font-size:1.05rem;color:#fff}
  .door .via{font-family:var(--mono);font-size:.66rem;color:var(--fg3)}
  .door .via b{color:var(--gold);font-weight:500}
  .pollen{margin-top:26px;font-family:var(--serif);font-style:italic;font-size:1.05rem;color:var(--fg2);max-width:var(--measure)}
  .pollen small{font-family:var(--mono);font-style:normal;font-size:.64rem;color:var(--fg4);letter-spacing:.08em;margin-left:8px}

  /* mini-apps: prep scaffold, identifier */
  .app{display:grid;gap:12px}
  .fld{display:grid;gap:5px}
  .fld label{font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--fg4)}
  .fld input[type=text],.fld textarea{width:100%;background:var(--elevated);border:1px solid var(--border-hi);border-radius:5px;color:var(--fg1);font:.95rem/1.45 var(--sans);padding:9px 11px;outline:none}
  .fld textarea{min-height:64px;resize:vertical}
  .fld input:focus,.fld textarea:focus{border-color:var(--cyan)}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg button{appearance:none;border:1px solid var(--border-hi);background:transparent;color:var(--fg2);font:600 .7rem var(--mono);letter-spacing:.06em;border-radius:999px;padding:6px 11px;cursor:pointer}
  .seg button:hover{color:var(--fg1)}
  .seg button.on{border-color:var(--cyan);color:var(--cyan)}
  .seg.gold button.on{border-color:var(--gold);color:var(--gold)}
  .app .out{border:1px solid var(--border);border-radius:5px;background:#05080e;padding:10px 12px;font-family:var(--mono);font-size:.72rem;line-height:1.5;color:var(--fg2);overflow-x:auto;white-space:pre;max-height:320px}
  .app .out b{color:var(--gold);font-weight:500}
  .app .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .app .bar .lab{margin-left:auto}
  .ident .res{font-family:var(--serif);font-size:1.15rem;color:var(--fg1)}
  .ident .res em{color:var(--cyan)}
  /* explorer */
  #exwrap{position:relative;border:1px solid var(--border);border-radius:6px;background:radial-gradient(600px 400px at 50% 40%,rgba(0,240,255,.05),transparent 70%),#05080e;overflow:hidden;min-height:420px;height:min(66vh,640px);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #ex{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #ex.drag{cursor:grabbing}
  #exhud{position:absolute;left:10px;top:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
  #exhud>*{pointer-events:auto}
  .exb{appearance:none;border:1px solid var(--border-hi);background:rgba(13,17,23,.9);color:var(--fg1);font:700 .72rem var(--mono);border-radius:5px;padding:5px 9px;cursor:pointer}
  .exb:hover{border-color:var(--cyan);color:var(--cyan)}
  .exb.on{border-color:var(--gold);color:var(--gold)}
  #exread{font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;color:var(--fg2);background:rgba(13,17,23,.85);border:1px solid var(--border);border-radius:5px;padding:5px 9px;white-space:nowrap}
  #exread b{color:var(--cyan);font-weight:500}
  #exmsg{position:absolute;left:10px;bottom:10px;right:10px;font-family:var(--serif);font-style:italic;font-size:1rem;color:var(--fg1);background:rgba(2,4,8,.72);border-left:2px solid var(--gold);padding:6px 10px;pointer-events:none;max-width:56ch;text-wrap:pretty}
  #exside{display:grid;gap:12px;align-content:start;min-width:0}
  #exsent .th{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline;font-size:.84rem;padding:6px 8px;border:1px solid var(--border);border-radius:4px;background:rgba(17,24,39,.6);cursor:pointer;margin-top:6px}
  #exsent .th:hover{border-color:var(--gold)}
  #exsent .th .w{font-family:var(--mono);font-size:.66rem;color:var(--red)}
  #exsent .th .b{font-family:var(--mono);font-size:.66rem;color:var(--fg4);white-space:nowrap}
  #exinfo .nb{display:inline-block;font-family:var(--mono);font-size:.68rem;border:1px solid var(--border-hi);border-radius:999px;padding:2px 8px;margin:3px 4px 0 0;cursor:pointer;color:var(--fg2)}
  #exinfo .nb:hover{border-color:var(--cyan);color:var(--cyan)}
  #exinfo .nb.x{border-color:rgba(255,215,0,.5)}
  .exgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:16px;align-items:start}
  @media (max-width:860px){.exgrid{grid-template-columns:1fr}}
  /* lattice */
  .latt{width:100%;height:auto;display:block;max-height:70vh}
  .latt text{font-family:var(--mono);font-size:9px;fill:var(--fg3)}
  .latt .dom{font-size:10px;letter-spacing:.14em;fill:var(--fg4)}
  .latt .ring{fill:none;stroke:var(--border);stroke-width:.6}
  .latt .e{stroke:var(--cyan);stroke-opacity:.16;fill:none}
  .latt .e.x{stroke:var(--gold);stroke-opacity:.28}
  .latt .n{cursor:pointer}
  .latt .n circle{stroke:var(--bg);stroke-width:1}
  .latt .n.sel circle{stroke:#fff;stroke-width:1.5}
  .latt .n.dim{opacity:.18}
  #nodeinfo{min-height:96px}
  #nodeinfo .what{color:var(--fg1);font-size:.95rem}

  /* the turntable */
  #strip{border-top:1px solid var(--border);background:linear-gradient(0deg,rgba(2,4,8,.98),rgba(2,4,8,.9));padding:8px clamp(14px,3vw,36px) 10px;display:grid;grid-template-columns:1fr;gap:6px}
  #tonearm{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .turn{appearance:none;border:1px solid var(--border-hi);background:var(--surface);color:var(--fg1);font:700 .8rem var(--mono);border-radius:999px;width:38px;height:38px;cursor:pointer;flex:none}
  .turn:hover{border-color:var(--cyan);color:var(--cyan)}
  #tracks{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
  .track{appearance:none;border:1px solid var(--border);background:transparent;color:var(--fg3);font:600 .66rem var(--mono);letter-spacing:.06em;border-radius:999px;padding:5px 10px;cursor:pointer;white-space:nowrap}
  .track:hover{border-color:var(--fg2);color:var(--fg1)}
  .track.on{border-color:var(--cyan);color:var(--cyan)}
  .side{appearance:none;border:1px solid var(--border-hi);background:var(--surface);color:var(--fg2);font:700 .66rem var(--mono);letter-spacing:.1em;border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap}
  .side.b{border-color:var(--gold);color:var(--gold)}
  #platter{width:100%;height:112px;display:block;cursor:grab;touch-action:none;border-radius:6px}
  #platter.drag{cursor:grabbing}
  #transport{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:.7rem;color:var(--fg3)}
  .tb{appearance:none;border:1px solid var(--border-hi);background:var(--surface);color:var(--fg1);font:700 .72rem var(--mono);border-radius:5px;padding:5px 10px;cursor:pointer}
  .tb:hover{border-color:var(--cyan);color:var(--cyan)}
  .tb.on{border-color:var(--gold);color:var(--gold)}
  #speed{min-width:4.5ch;color:var(--fg2);font-variant-numeric:tabular-nums}
  #transport .now{color:var(--gold);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
  #transport .cnt{color:var(--fg4)}
  #transport .legend{margin-left:auto}
  .chronolegend{display:flex;align-items:baseline;gap:12px;font-family:var(--serif);font-size:.95rem;color:var(--fg1);line-height:1}
  .chronolegend span{opacity:calc(.38 + .62*var(--f));filter:blur(calc((1 - var(--f))*2.6px));letter-spacing:calc((1 - var(--f))*.03em);font-weight:calc(300 + 300*var(--f));display:inline-block}
  @media (prefers-reduced-motion:no-preference){.chronolegend .nascent{animation:wobble 5.5s ease-in-out infinite}}
  @media (max-width:700px){#transport .legend,#speed,#rev,#fwd{display:none}#platter{height:96px}
    #tonearm{display:grid;grid-template-columns:auto 1fr auto;align-items:center}
    #tracks{grid-column:1/-1;grid-row:1;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}#tracks::-webkit-scrollbar{display:none}
    .track{padding:5px 9px;flex:none}.side{justify-self:end}}
  @media (prefers-reduced-motion:no-preference){#scene.enter{animation:enter .38s ease-out}}
  @keyframes enter{from{transform:translateY(8px)}to{transform:none}}
  .sr{position:absolute;left:-9999px}
</style>

<div id="frame">
  <header id="hud">
    <span class="lab cy">ARCS World // public build</span>
    <span class="room" id="hud-room">The Threshold</span>
    <span class="face" id="hud-face">public face</span>
    <span class="theta" id="hud-theta">θ 0°</span>
    <span class="keys"><kbd>←</kbd><kbd>→</kbd> room · <kbd>F</kbd> flip side · <kbd>1</kbd>–<kbd>8</kbd> · <kbd>space</kbd> play · <kbd>[</kbd><kbd>]</kbd> speed</span>
  </header>
  <main id="scene" aria-live="polite"></main>
  <nav id="strip" aria-label="the turntable: the platter is time, the tone arm is the room, the sides are the faces">
    <div id="tonearm">
      <button class="turn" id="prev" aria-label="previous room">◀</button>
      <div id="tracks" role="group" aria-label="rooms"></div>
      <button class="turn" id="next" aria-label="next room">▶</button>
      <button class="side" id="flip" aria-label="flip the record to the other face">side A · public</button>
    </div>
    <canvas id="platter" aria-label="the Möbius platter: drag to scrub time, release to coast, play to spin"></canvas>
    <div id="transport">
      <button class="tb" id="rev" title="reverse · press again for faster ( [ )">◀◀</button>
      <button class="tb" id="play" title="play / pause (space)">▶</button>
      <button class="tb" id="fwd" title="forward · press again for faster ( ] )">▶▶</button>
      <span id="speed">1.0×</span>
      <span id="tnow" class="now"></span>
      <span id="tunborn" class="cnt"></span>
      <span class="legend chronolegend" aria-hidden="true"><span style="--f:.12" class="nascent">receipt</span><span style="--f:.4">receipt</span><span style="--f:.72">receipt</span><span style="--f:1">receipt</span></span>
    </div>
  </nav>

b": "analyze", "text": "no source is trusted for being familiar. another agent's output, and even your own prior word, is input until verified.", "date": "2026-08-11", "adr": "ADR-032"}, {"id": "tao-009", "aspect": "D", "verb": "analyze", "text": "keep parallel frames parallel. the same five lenses aimed at a commit and at a decision must not be merged; a commit is not a decision receipt.", "date": "2026-08-11", "adr": "ADR-035"}, {"id": "tao-010", "aspect": "D", "verb": "analyze", "text": "the decision is not what to build. it is whether this will be built again.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-011", "aspect": "D", "verb": "analyze", "text": "a decision is a discharge: it fires when the potential peaks and the gap aligns, not when the clock says so.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-012", "aspect": "D", "verb": "analyze", "text": "a decision carries two numbers, the audited and the assessed. never let the second wear the first's clothes.", "date": "2026-08-11", "adr": "ADR-041"}, {"id": "tao-013", "aspect": "D", "verb": "assess", "text": "the isolation that actually holds is the one at the layer your queries pass through; everything the privileged path bypasses protects only strangers.", "date": "2026-08-11", "adr": "ADR-008"}, {"id": "tao-014", "aspect": "D", "verb": "assess", "text": "prefer the clean end-state over the workaround whose suffix leaks into all future code.", "date": "2026-08-11", "adr": "ADR-010"}, {"id": "tao-015", "aspect": "D", "verb": "assess", "text": "a dependency blocks only what truly depends on it. ship the independent parts now.", "date": "2026-08-11", "adr": "ADR-015"}, {"id": "tao-016", "aspect": "D", "verb": "assess", "text": "a finding is not closed because it is written down. it closes with a mechanism that prevents recurrence, or a dated waiver that owns the deferral.", "date": "2026-08-11", "adr": "ADR-034"}, {"id": "tao-017", "aspect": "D", "verb": "assess", "text": "judge a build by whether the second case would fork it or reuse it.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-018", "aspect": "D", "verb": "assess", "text": "the flash is not the decision. the confirmed receipt is; a spark no one received went to ground.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-019", "aspect": "D", "verb": "evaluate", "text": "ship changes that are independently deployable and individually falsifiable, so each one can teach you something alone.", "date": "2026-08-11", "adr": "ADR-013"}, {"id": "tao-020", "aspect": "D", "verb": "evaluate", "text": "keep the calibrating step as fuel, not a destination; put no extra stop between the question and the answer it feeds.", "date": "2026-08-11", "adr": "ADR-024"}, {"id": "tao-021", "aspect": "D", "verb": "evaluate", "text": "sealing everything is over-broad and throws away a real asset. split instead, so the value survives in the open and the secret survives in the dark.", "date": "2026-08-11", "adr": "ADR-036"}, {"id": "tao-022", "aspect": "D", "verb": "evaluate", "text": "a one-off earns no mold. promote on the second real case, not the first.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-023", "aspect": "D", "verb": "evaluate", "text": "weigh a decision by whether it would survive its own recoil, not by how bright it looked when it fired.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-024", "aspect": "D", "verb": "synthesize", "text": "use the fast tool to bootstrap and the tracked tool to live; one decision names both and the trigger that switches between them.", "date": "2026-08-11", "adr": "ADR-007"}, {"id": "tao-025", "aspect": "D", "verb": "synthesize", "text": "automation authority is a topology, not a tier. do not ask what level of automation is safe. ask at what boundary automation stops and human agency begins.", "date": "2026-08-11", "adr": "ADR-014"}, {"id": "tao-026", "aspect": "D", "verb": "synthesize", "text": "lock the minimum that every surface must share, and let each surface own whatever it needs above it.", "date": "2026-08-11", "adr": "ADR-017"}, {"id": "tao-027", "aspect": "D", "verb": "synthesize", "text": "an instrument panel makes the user assemble the data first. a navigator takes the raw signal and finds the structure. build the one the hardest cases need.", "date": "2026-08-11", "adr": "ADR-018"}, {"id": "tao-028", "aspect": "D", "verb": "synthesize", "text": "annotate the sealed record, never rewrite it; a decision gains meaning from what wraps it, not from tampering with the thing itself.", "date": "2026-08-11", "adr": "ADR-020"}, {"id": "tao-029", "aspect": "D", "verb": "synthesize", "text": "infer the structure from the trail already left behind; to declare it up front is to freeze a preference still taking form.", "date": "2026-08-11", "adr": "ADR-023"}, {"id": "tao-030", "aspect": "D", "verb": "synthesize", "text": "resolve the architecture forks before any code is laid; name the gates first, and every downstream build inherits a settled answer.", "date": "2026-08-11", "adr": "ADR-024"}, {"id": "tao-031", "aspect": "D", "verb": "synthesize", "text": "a public act is one-way, but the decisions beneath it stay two-way; make the irreversible claim while keeping the mechanism revisable.", "date": "2026-08-11", "adr": "ADR-025"}, {"id": "tao-032", "aspect": "D", "verb": "synthesize", "text": "build the instrument that will tell you whether a better signal helps before you build the better signal; precision you cannot measure is precision spent in the dark.", "date": "2026-08-11", "adr": "ADR-059"}, {"id": "tao-033", "aspect": "D", "verb": "synthesize", "text": "a record of a decision is not the decision remade. the instrument renders the terrain, it does not adjudicate it.", "date": "2026-08-11", "adr": "ADR-027"}, {"id": "tao-034", "aspect": "D", "verb": "synthesize", "text": "do not guess an unconfirmed distinction into a schema, because the schema outlives the guess. route it as a cheap question instead.", "date": "2026-08-11", "adr": "ADR-028"}, {"id": "tao-035", "aspect": "D", "verb": "synthesize", "text": "when a richer version arrives, extend the single source of truth rather than stand up a parallel one to move faster. the fork is a debt paid later with interest.", "date": "2026-08-11", "adr": "ADR-031"}, {"id": "tao-036", "aspect": "D", "verb": "synthesize", "text": "when the code and the promise diverge, bend the code to the promise. the promise is your position; the code is only how you hold it.", "date": "2026-08-11", "adr": "ADR-049"}, {"id": "tao-037", "aspect": "D", "verb": "synthesize", "text": "a stored belief is never just a claim. it carries its time, its scope, its warrant, its debts, and its dictionary. drop any one and the belief reads wrong later.", "date": "2026-08-11", "adr": "ADR-033"}, {"id": "tao-038", "aspect": "D", "verb": "synthesize", "text": "to share a thing without storing it, hand the whole payload in the part of the link the server never sees.", "date": "2026-08-11", "adr": "ADR-037"}, {"id": "tao-039", "aspect": "D", "verb": "synthesize", "text": "author the cheap primitive and derive the expensive view from it. one source of truth, and the rich picture is rendered, never separately maintained.", "date": "2026-08-11", "adr": "ADR-038"}, {"id": "tao-040", "aspect": "D", "verb": "synthesize", "text": "instance, then class: solve it once concretely, then cast the mold the second case asks for.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-041", "aspect": "D", "verb": "synthesize", "text": "recipe, discharge, receipt: the instruction given, the arc across the gap, the record of what arrived. one decision, three moments.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-042", "aspect": "D", "verb": "synthesize", "text": "an empty cell is not a failure. it is a stub: a place kept for a proverb not yet earned.", "date": "2026-08-11", "adr": "ADR-041"}, {"id": "tao-043", "aspect": "D", "verb": "recapitulate", "text": "when a change falls short, do not just block it. report the score, the weakest lens, and the one or two edits that would clear the bar.", "date": "2026-08-11", "adr": "ADR-035"}, {"id": "tao-044", "aspect": "D", "verb": "recapitulate", "text": "what you built twice by hand, you should have built once as a mold.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-045", "aspect": "D", "verb": "recapitulate", "text": "every decision leaves a coordinate. the receipt is where it stood, so the next one knows where it stands.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-046", "aspect": "D", "verb": "recapitulate", "text": "a filed decision that keeps its tildes can be trusted years later; one that hid them cannot.", "date": "2026-08-11", "adr": "ADR-041"}, {"id": "tao-047", "aspect": "R", "verb": "analyze", "text": "route discipline is a real control only while the routes stay few enough to audit by hand.", "date": "2026-08-11", "adr": "ADR-001"}, {"id": "tao-048", "aspect": "R", "verb": "analyze", "text": "a dependency that fails silently takes your value away without warning.", "date": "2026-08-11", "adr": "ADR-005"}, {"id": "tao-049", "aspect": "R", "verb": "analyze", "text": "a bootstrap shortcut used past bootstrap stops being a shortcut and becomes permanent divergence.", "date": "2026-08-11", "adr": "ADR-007"}, {"id": "tao-050", "aspect": "R", "verb": "analyze", "text": "match the control to the real attack surface; a policy guarding a door no one opens is theater.", "date": "2026-08-11", "adr": "ADR-008"}, {"id": "tao-051", "aspect": "R", "verb": "analyze", "text": "a silent fallback that hands back the wrong type disables every check downstream of it, and nothing tells you.", "date": "2026-08-11", "adr": "ADR-010"}, {"id": "tao-052", "aspect": "R", "verb": "analyze", "text": "convenience machinery that quietly defeats the optimizer trades a hidden build cost for a cosmetic gain.", "date": "2026-08-11", "adr": "ADR-011"}, {"id": "tao-053", "aspect": "R", "verb": "analyze", "text": "an offer shown before sense-making finishes interrupts it, and you lose both the free flow and the sale.", "date": "2026-08-11", "adr": "ADR-012"}, {"id": "tao-054", "aspect": "R", "verb": "analyze", "text": "a bottom-up order left ungoverned calcifies into the rigid hierarchy it meant to escape; the heavy edges only grow heavier until nothing can move.", "date": "2026-08-11", "adr": "ADR-023"}, {"id": "tao-055", "aspect": "R", "verb": "analyze", "text": "find the true bottleneck before optimizing anything; a loop that closes half a percent of the time is not failing for want of a sharper signal.", "date": "2026-08-11", "adr": "ADR-059"}, {"id": "tao-056", "aspect": "R", "verb": "analyze", "text": "egress is a control, not just ingress. read-only is not safe. every outbound channel is a way for stolen truth to leave.", "date": "2026-08-11", "adr": "ADR-032"}, {"id": "tao-057", "aspect": "R", "verb": "analyze", "text": "the recurring failure is always the same: documentation ends the loop. a finding that terminates in a file with no gate will happen again.", "date": "2026-08-11", "adr": "ADR-034"}, {"id": "tao-058", "aspect": "R", "verb": "analyze", "text": "gating a page hides the surface, not the source. the history stays cloneable long after the view is closed.", "date": "2026-08-11", "adr": "ADR-036"}, {"id": "tao-059", "aspect": "R", "verb": "analyze", "text": "silent fork-drift is the slow ruin: three copies that no longer agree, and no one chose it.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-060", "aspect": "R", "verb": "analyze", "text": "an attractor that pulls too eagerly does not find the pattern. it manufactures one.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-061", "aspect": "R", "verb": "assess", "text": "defense in depth is a maintenance cost you buy when the access paths multiply, not before.", "date": "2026-08-11", "adr": "ADR-001"}, {"id": "tao-062", "aspect": "R", "verb": "assess", "text": "the risk you reject an option for is the risk you inherit the day circumstance forces that option on you.", "date": "2026-08-11", "adr": "ADR-005"}, {"id": "tao-063", "aspect": "R", "verb": "assess", "text": "every accepted trade-off should carry the condition under which it expires.", "date": "2026-08-11", "adr": "ADR-006"}, {"id": "tao-064", "aspect": "R", "verb": "assess", "text": "accept duplication only while it stays visible and localized, and name the horizon at which you will pay it down.", "date": "2026-08-11", "adr": "ADR-009"}, {"id": "tao-065", "aspect": "R", "verb": "assess", "text": "options that look like rivals are often complementary; do not strawman the fallback you may have to promote.", "date": "2026-08-11", "adr": "ADR-013"}, {"id": "tao-066", "aspect": "R", "verb": "assess", "text": "name the exact boundary conditions. a trip signal you can name is one you can audit on its own.", "date": "2026-08-11", "adr": "ADR-014"}, {"id": "tao-067", "aspect": "R", "verb": "assess", "text": "fail fast at the bridge, not silently at the database. a missing field should raise where it crosses, not rot where it lands.", "date": "2026-08-11", "adr": "ADR-019"}, {"id": "tao-068", "aspect": "R", "verb": "assess", "text": "speak only when ruin, derailment, or a sharp swing in conviction fires; commentary that runs constantly is noise no one reads.", "date": "2026-08-11", "adr": "ADR-020"}, {"id": "tao-069", "aspect": "R", "verb": "assess", "text": "when nothing yet exists to challenge an early commitment, hold, do not infer; locking before the flow can test it is the very breach the discipline exists to prevent.", "date": "2026-08-11", "adr": "ADR-023"}, {"id": "tao-070", "aspect": "R", "verb": "assess", "text": "a generated id is not a secret; enforce the owner-plus-record key at the application layer and treat row-level rules as a backup, not the primary gate.", "date": "2026-08-11", "adr": "ADR-024"}, {"id": "tao-071", "aspect": "R", "verb": "assess", "text": "a message that reports success but never arrives is more dangerous than one that errors, because nothing tells you to go look.", "date": "2026-08-11", "adr": "ADR-026"}, {"id": "tao-072", "aspect": "R", "verb": "assess", "text": "a secret in git history is a rotation event, not a fix. treat it as disclosed the moment it lands.", "date": "2026-08-11", "adr": "ADR-048"}, {"id": "tao-073", "aspect": "R", "verb": "assess", "text": "a shared link is a debt to everyone who kept it. delete the record and you break their reference, not merely your own.", "date": "2026-08-11", "adr": "ADR-049"}, {"id": "tao-074", "aspect": "R", "verb": "assess", "text": "assume breach. the architecture's task is not to prevent every compromise but to bound what one compromise can reach.", "date": "2026-08-11", "adr": "ADR-032"}, {"id": "tao-075", "aspect": "R", "verb": "assess", "text": "a zero-margin operation is a design bug, not a test of nerve. add a checkpoint that proves nothing is lost before you delete.", "date": "2026-08-11", "adr": "ADR-036"}, {"id": "tao-076", "aspect": "R", "verb": "assess", "text": "a one-off packaged too early is speculative generality, the waste that hides as foresight.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-077", "aspect": "R", "verb": "assess", "text": "rank a signal by how hard it resists refutation, not by how well it fits the story you already carry.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-078", "aspect": "R", "verb": "assess", "text": "unlabeled non-gaap presented as gaap is what quietly rots a house.", "date": "2026-08-11", "adr": "ADR-041"}, {"id": "tao-079", "aspect": "R", "verb": "evaluate", "text": "weigh failure modes, not features. bounded, one-directional complexity beats an unbounded, silent failure every time.", "date": "2026-08-11", "adr": "ADR-016"}, {"id": "tao-080", "aspect": "R", "verb": "evaluate", "text": "name the falsifiable test and the number that would kill the idea before you begin; a hypothesis with no veto threshold cannot fail, and so can teach you nothing.", "date": "2026-08-11", "adr": "ADR-058"}, {"id": "tao-081", "aspect": "R", "verb": "evaluate", "text": "instrumentation turns a launch from an assertion into a measurable bet; ship the measuring apparatus with the claim, and pre-commit the signal that would prove you wrong.", "date": "2026-08-11", "adr": "ADR-025"}, {"id": "tao-082", "aspect": "R", "verb": "evaluate", "text": "rank the guarded things by blast radius. the key that bypasses every other guard is the one to rotate first.", "date": "2026-08-11", "adr": "ADR-048"}, {"id": "tao-083", "aspect": "R", "verb": "evaluate", "text": "refuse the fix that quietly reverses a promise you already published, even when it buys a stronger guarantee.", "date": "2026-08-11", "adr": "ADR-037"}, {"id": "tao-084", "aspect": "R", "verb": "evaluate", "text": "weigh the fork against the mold: copy-paste is cheap today and dear at the tenth spoon.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-085", "aspect": "R", "verb": "evaluate", "text": "a finding held by one stream is a story. require a second stream to brace it before you stake anything on it.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-086", "aspect": "R", "verb": "synthesize", "text": "the counter-forces are load-bearing members, not patches; remove one and the structure slumps into a squat, dark, solid mass.", "date": "2026-08-11", "adr": "ADR-023"}, {"id": "tao-087", "aspect": "R", "verb": "synthesize", "text": "the promotion compulsion is its own drift: packaging for the pleasure of packaging.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-088", "aspect": "R", "verb": "synthesize", "text": "the same basin that condenses fuel condenses delusion. the only difference is the control rod.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-089", "aspect": "R", "verb": "recapitulate", "text": "a fix applied only to the live system is not finished; write it back into the baseline, or the next fresh start reopens the same wound.", "date": "2026-08-11", "adr": "ADR-022"}, {"id": "tao-090", "aspect": "R", "verb": "recapitulate", "text": "a rotation cadence that no human owns will not happen. a control without an owner is decoration.", "date": "2026-08-11", "adr": "ADR-048"}, {"id": "tao-091", "aspect": "R", "verb": "recapitulate", "text": "governance about governance feels like progress while being motion in place. judge it by whether the next person acts differently, not by how well it reads.", "date": "2026-08-11", "adr": "ADR-033"}, {"id": "tao-092", "aspect": "R", "verb": "recapitulate", "text": "what is already cloned is already disclosed. a rewrite limits the future spread; it cannot un-ring a bell that has rung.", "date": "2026-08-11", "adr": "ADR-036"}, {"id": "tao-093", "aspect": "R", "verb": "recapitulate", "text": "name in advance the evidence that would prove you wrong, and the date you will look for it. a choice with no falsifier cannot be corrected.", "date": "2026-08-11", "adr": "ADR-038"}, {"id": "tao-094", "aspect": "R", "verb": "recapitulate", "text": "every drifted shape was a mold you refused to cut when the second case arrived.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-095", "aspect": "R", "verb": "recapitulate", "text": "what did not re-converge across the runs was never a bond. let it decay before it costs you.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-096", "aspect": "R", "verb": "recapitulate", "text": "a grid that comes back full is the tell of padding. the empty cells are the honesty.", "date": "2026-08-11", "adr": "ADR-041"}, {"id": "tao-097", "aspect": "W", "verb": "analyze", "text": "the window to promote opens on the second use, not the first and not the tenth.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-098", "aspect": "W", "verb": "analyze", "text": "voltage without an aligned gap is only stored potential. read the gap before you read the charge.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-099", "aspect": "W", "verb": "assess", "text": "a gap between dev and prod stays hidden until the crossing; put the gate at the crossing, not after it.", "date": "2026-08-11", "adr": "ADR-002"}, {"id": "tao-100", "aspect": "W", "verb": "assess", "text": "the window to change migration tools closes the moment production holds a real row; baseline the history before that, not after.", "date": "2026-08-11", "adr": "ADR-007"}, {"id": "tao-101", "aspect": "W", "verb": "assess", "text": "put the default denial in place before the first outsider arrives, not after the exposure teaches you why.", "date": "2026-08-11", "adr": "ADR-008"}, {"id": "tao-102", "aspect": "W", "verb": "assess", "text": "name the explicit count or condition that flips the decision, so the revisit is a trigger and not a someday.", "date": "2026-08-11", "adr": "ADR-011"}, {"id": "tao-103", "aspect": "W", "verb": "assess", "text": "surface the price only after the value has rendered; the moment clarity is earned is the safe condition to ask for more.", "date": "2026-08-11", "adr": "ADR-012"}, {"id": "tao-104", "aspect": "W", "verb": "assess", "text": "set a falsifiable threshold conservative enough to be observable even at low volume, or the signal you wait for will only ever be noise.", "date": "2026-08-11", "adr": "ADR-013"}, {"id": "tao-105", "aspect": "W", "verb": "assess", "text": "a gate that clears on a count alone has not cleared; run the measurement the gate actually asks for before you walk through it.", "date": "2026-08-11", "adr": "ADR-023"}, {"id": "tao-106", "aspect": "W", "verb": "assess", "text": "place the only friction exactly where intent runs highest, at the moment of saving or sharing, never as a wall in front of the core value.", "date": "2026-08-11", "adr": "ADR-025"}, {"id": "tao-107", "aspect": "W", "verb": "assess", "text": "when unsure whether a safeguard applies, apply it. over-caution costs minutes; the skipped check fails in silence.", "date": "2026-08-11", "adr": "ADR-032"}, {"id": "tao-108", "aspect": "W", "verb": "assess", "text": "age every open finding against a clock. a deadline turns an unknown-unknown into something someone must act on the day it is filed.", "date": "2026-08-11", "adr": "ADR-034"}, {"id": "tao-109", "aspect": "W", "verb": "assess", "text": "ship it small, additive, and reversible, then let a few real uses decide whether it earns its keep.", "date": "2026-08-11", "adr": "ADR-038"}, {"id": "tao-110", "aspect": "W", "verb": "assess", "text": "do not cast the mold while the shape is still moving. wait for the second case to name it.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-111", "aspect": "W", "verb": "assess", "text": "do not fire early. a discharge across the wrong gap is a short, and a short burns the circuit it meant to serve.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-112", "aspect": "W", "verb": "evaluate", "text": "one access path needs one gate; a second enforcement layer earns its keep only when the surface outgrows what review can audit.", "date": "2026-08-11", "adr": "ADR-001"}, {"id": "tao-113", "aspect": "W", "verb": "evaluate", "text": "audit every caller before you delete; the grep that proves zero callers is cheaper than the break that proves one.", "date": "2026-08-11", "adr": "ADR-010"}, {"id": "tao-114", "aspect": "W", "verb": "evaluate", "text": "sequence the sure gains first and defer the aesthetic rebuild until the data earns it; the correct third move is wrong as the first.", "date": "2026-08-11", "adr": "ADR-013"}, {"id": "tao-115", "aspect": "W", "verb": "evaluate", "text": "the slowdown at the gate is not overhead. it is the integrity check the product exists to teach.", "date": "2026-08-11", "adr": "ADR-014"}, {"id": "tao-116", "aspect": "W", "verb": "evaluate", "text": "a synthetic test can prove the structure bears load and map where it breaks, yet it cannot set the operating point; only measured load can do that.", "date": "2026-08-11", "adr": "ADR-023"}, {"id": "tao-117", "aspect": "W", "verb": "evaluate", "text": "advance only when a set share of the gates pass; short of that, shelve gracefully rather than push a thing the signal did not earn.", "date": "2026-08-11", "adr": "ADR-058"}, {"id": "tao-118", "aspect": "W", "verb": "evaluate", "text": "a change that is additive, defaulted off, and reversible can ship even while the model behind it is still unsettled.", "date": "2026-08-11", "adr": "ADR-028"}, {"id": "tao-119", "aspect": "W", "verb": "evaluate", "text": "keep by default to protect what others rely on, but yield the moment someone asks you to erase their own trace. retention is a courtesy, not a refusal.", "date": "2026-08-11", "adr": "ADR-049"}, {"id": "tao-120", "aspect": "W", "verb": "evaluate", "text": "do not name a problem you cannot enforce. without a distinct mechanism and a reader that applies it, a category is decoration, not defense.", "date": "2026-08-11", "adr": "ADR-033"}, {"id": "tao-121", "aspect": "W", "verb": "evaluate", "text": "scoring a change that carries no judgment is false precision. rate what encodes a decision, skip the chore, and say plainly which it was.", "date": "2026-08-11", "adr": "ADR-035"}, {"id": "tao-122", "aspect": "W", "verb": "evaluate", "text": "order the work so the reversible, verifiable steps come first and the one-way gate comes last.", "date": "2026-08-11", "adr": "ADR-036"}, {"id": "tao-123", "aspect": "W", "verb": "evaluate", "text": "rule of three is the ceiling, not the target: promote at two when the second is already in hand.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-124", "aspect": "W", "verb": "evaluate", "text": "the safe condition to proceed is a gap aligned and a potential peaked. absent either, hold.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-125", "aspect": "W", "verb": "synthesize", "text": "a named gate turns an accepted risk into a scheduled action; without the gate, acceptable-for-now quietly becomes permanent.", "date": "2026-08-11", "adr": "ADR-006"}, {"id": "tao-126", "aspect": "W", "verb": "synthesize", "text": "when a thing waits on content that may never come, give it a deadline and a placeholder, so the wait cannot quietly become forever.", "date": "2026-08-11", "adr": "ADR-015"}, {"id": "tao-127", "aspect": "W", "verb": "synthesize", "text": "place the gate where the value has been proven, not at the door. a wall before the first taste kills the appetite it means to guard.", "date": "2026-08-11", "adr": "ADR-016"}, {"id": "tao-128", "aspect": "W", "verb": "synthesize", "text": "an owed action decays unread until someone closes it out loud. closure is a written event, never silence.", "date": "2026-08-11", "adr": "ADR-033"}, {"id": "tao-129", "aspect": "W", "verb": "synthesize", "text": "promote too early and you abstract before you understand; too late and every case is a fork.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-130", "aspect": "W", "verb": "synthesize", "text": "timing is a position, not a schedule. the window opens where the conditions meet, and closes when they part.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-131", "aspect": "W", "verb": "recapitulate", "text": "never edit a locked schema in place. when it must grow, cut a version two and leave the first untouched.", "date": "2026-08-11", "adr": "ADR-017"}, {"id": "tao-132", "aspect": "W", "verb": "recapitulate", "text": "recency and position are not authority. a point-in-time record becomes dead state wearing a live face the moment work continues past it.", "date": "2026-08-11", "adr": "ADR-032"}, {"id": "tao-133", "aspect": "W", "verb": "recapitulate", "text": "the moment to cut the mold was the moment the copy-paste began.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-134", "aspect": "W", "verb": "recapitulate", "text": "mark where the arc struck and where it refused. the record of struck gaps is the map of when to move.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-135", "aspect": "W", "verb": "recapitulate", "text": "strip the formwork only after the concrete sets. pull it while curing and the structure falls.", "date": "2026-08-11", "adr": "ADR-041"}, {"id": "tao-136", "aspect": "C", "verb": "analyze", "text": "an ambiguous name resolves to whichever match comes first, never to the one you meant.", "date": "2026-08-11", "adr": "ADR-010"}, {"id": "tao-137", "aspect": "C", "verb": "analyze", "text": "a named gap is honest; a hidden one is a lie. when you cannot check the box, state the residual risk out loud.", "date": "2026-08-11", "adr": "ADR-032"}, {"id": "tao-138", "aspect": "C", "verb": "analyze", "text": "never consume a claim that has lost a coordinate. trust it only to the fidelity it can still prove.", "date": "2026-08-11", "adr": "ADR-033"}, {"id": "tao-139", "aspect": "C", "verb": "analyze", "text": "do not score a continuous gradient over input that is only qualitative. precision the data cannot support is a lie dressed as rigor.", "date": "2026-08-11", "adr": "ADR-038"}, {"id": "tao-140", "aspect": "C", "verb": "analyze", "text": "a class is only as clear as its contract: deps, args, params, resources, schema, the manifest.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-141", "aspect": "C", "verb": "analyze", "text": "amplify the signal, never the noise, and never past the evidence that carried it in.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-142", "aspect": "C", "verb": "analyze", "text": "before you trust a number, look for its tilde or its custody; a value with neither is not yet real.", "date": "2026-08-11", "adr": "ADR-041"}, {"id": "tao-143", "aspect": "C", "verb": "assess", "text": "an unmeasurable claim is noise; one specific believable claim outweighs an impressive vague one.", "date": "2026-08-11", "adr": "ADR-003"}, {"id": "tao-144", "aspect": "C", "verb": "assess", "text": "better too specific for the few who lean in than too generic for the many who leave.", "date": "2026-08-11", "adr": "ADR-003"}, {"id": "tao-145", "aspect": "C", "verb": "assess", "text": "presence is not correctness; verify the value, not merely that a value is there.", "date": "2026-08-11", "adr": "ADR-005"}, {"id": "tao-146", "aspect": "C", "verb": "assess", "text": "canonical without enforcement is only a wish. two schemas will drift unless one source validates them both.", "date": "2026-08-11", "adr": "ADR-017"}, {"id": "tao-147", "aspect": "C", "verb": "assess", "text": "when conviction is still shifting, decide the direction but hold the build. a yellow gate is not a green one.", "date": "2026-08-11", "adr": "ADR-018"}, {"id": "tao-148", "aspect": "C", "verb": "assess", "text": "decide which pieces are load-bearing and which are merely nice; cut everything non-essential to a later phase so the first build carries only what proves the idea.", "date": "2026-08-11", "adr": "ADR-058"}, {"id": "tao-149", "aspect": "C", "verb": "assess", "text": "do not choose the cheap path on an assumption of shallowness. query the real data first, for it has often already run deeper than you guessed.", "date": "2026-08-11", "adr": "ADR-030"}, {"id": "tao-150", "aspect": "C", "verb": "assess", "text": "amend the source of truth first, then the pages that derive from it, so the promise stays literally true and not merely presented as true.", "date": "2026-08-11", "adr": "ADR-037"}, {"id": "tao-151", "aspect": "C", "verb": "assess", "text": "if the shape cannot be stated as one fixed contract, it is not yet ready to be a class.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-152", "aspect": "C", "verb": "assess", "text": "the speaker cannot broadcast sharp when the microphone only heard grain. check the input before you trust the output.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-153", "aspect": "C", "verb": "assess", "text": "the only dishonesty is the assessed worn as the audited. the tilde is the whole safeguard.", "date": "2026-08-11", "adr": "ADR-041"}, {"id": "tao-154", "aspect": "C", "verb": "evaluate", "text": "copy that could describe any tool answers no one who asked what this is.", "date": "2026-08-11", "adr": "ADR-003"}, {"id": "tao-155", "aspect": "C", "verb": "evaluate", "text": "a rule that silently returns nothing is worse than no rule; confirm the mechanism fires for the caller you actually have.", "date": "2026-08-11", "adr": "ADR-008"}, {"id": "tao-156", "aspect": "C", "verb": "evaluate", "text": "scaffold cognition that is complete, not cognition still in progress; the tool serves the finished thought.", "date": "2026-08-11", "adr": "ADR-012"}, {"id": "tao-157", "aspect": "C", "verb": "evaluate", "text": "below the threshold, stay silent; clarity already earned asks for no commentary.", "date": "2026-08-11", "adr": "ADR-020"}, {"id": "tao-158", "aspect": "C", "verb": "evaluate", "text": "the aim you truly serve is whichever attractor the tightening connections point toward; it precipitates out of the record rather than being imposed on it.", "date": "2026-08-11", "adr": "ADR-023"}, {"id": "tao-159", "aspect": "C", "verb": "evaluate", "text": "render in degraded resolution until the work is done; the confidence of a preliminary scan is not the confidence of a finished receipt.", "date": "2026-08-11", "adr": "ADR-024"}, {"id": "tao-160", "aspect": "C", "verb": "evaluate", "text": "render only what the data earns. some quantities can be measured and some can only be modeled, so never draw the modeled ones as if they were measured.", "date": "2026-08-11", "adr": "ADR-027"}, {"id": "tao-161", "aspect": "C", "verb": "evaluate", "text": "verify provenance, not just plausibility. a claim can be well-formed and still be built on poisoned ground.", "date": "2026-08-11", "adr": "ADR-032"}, {"id": "tao-162", "aspect": "C", "verb": "evaluate", "text": "a score's job is to force the five questions, not to be precise. do not tune the digits; the discipline is in the asking.", "date": "2026-08-11", "adr": "ADR-035"}, {"id": "tao-163", "aspect": "C", "verb": "evaluate", "text": "mark the peak, the park, and the probe. not every moment worth revisiting is resonance or resistance; some are simply unresolved.", "date": "2026-08-11", "adr": "ADR-038"}, {"id": "tao-164", "aspect": "C", "verb": "evaluate", "text": "prefer subtraction on promotion: the class keeps only what is load-bearing across cases.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-165", "aspect": "C", "verb": "evaluate", "text": "coherence is a basin deep enough to hold, not an agreement loud enough to drown the dissent.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-166", "aspect": "C", "verb": "evaluate", "text": "coherence is not agreement. it is a body of drops holding tension without going flat.", "date": "2026-08-11", "adr": "ADR-041"}, {"id": "tao-167", "aspect": "C", "verb": "synthesize", "text": "keep the local data in the shape production will accept, and the migration is already half done.", "date": "2026-08-11", "adr": "ADR-002"}, {"id": "tao-168", "aspect": "C", "verb": "synthesize", "text": "a rule already locked settles the tool debate before it can start; do not relitigate the constitution to save a keystroke.", "date": "2026-08-11", "adr": "ADR-009"}, {"id": "tao-169", "aspect": "C", "verb": "synthesize", "text": "name one specific human, one decision, one outcome; concrete proof moves more than any layout change.", "date": "2026-08-11", "adr": "ADR-013"}, {"id": "tao-170", "aspect": "C", "verb": "synthesize", "text": "validate at the edges and stay light in the core. guard the wire and the storage; do not drag heavy checks into every inner loop.", "date": "2026-08-11", "adr": "ADR-019"}, {"id": "tao-171", "aspect": "C", "verb": "synthesize", "text": "seek the state that is crystalline and fluid at once: sharp enough to read clearly, loose enough to rearrange when new evidence presses.", "date": "2026-08-11", "adr": "ADR-023"}, {"id": "tao-172", "aspect": "C", "verb": "synthesize", "text": "a narrative that is true, specific, and repeatable does not manufacture demand; it crystallizes demand that already exists, and grows truer each time it is proven.", "date": "2026-08-11", "adr": "ADR-058"}, {"id": "tao-173", "aspect": "C", "verb": "synthesize", "text": "you cannot protect what you have never inventoried. the list of what exists is the precondition for every control over it.", "date": "2026-08-11", "adr": "ADR-048"}, {"id": "tao-174", "aspect": "C", "verb": "synthesize", "text": "cryptography can prove who, what, and unaltered. it cannot prove harmless. authenticate the actor, then still question the payload.", "date": "2026-08-11", "adr": "ADR-032"}, {"id": "tao-175", "aspect": "C", "verb": "synthesize", "text": "hold your own invariants to the same gate you hold the work you ship to others. rigor that only points outward is the cobbler's children going barefoot.", "date": "2026-08-11", "adr": "ADR-034"}, {"id": "tao-176", "aspect": "C", "verb": "synthesize", "text": "when you inherit a rule you cannot yet justify, flag it, do not silently fix it. naming the doubt is more honest than quiet correction.", "date": "2026-08-11", "adr": "ADR-035"}, {"id": "tao-177", "aspect": "C", "verb": "synthesize", "text": "a schema is how tools validate each other instead of drifting apart.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-178", "aspect": "C", "verb": "synthesize", "text": "custody is how honesty is enforced: no belief moves without citing what moved it. no custody, no gain.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-179", "aspect": "C", "verb": "synthesize", "text": "confidence is the posterior, conviction is its stability. fuse them into one loud number and you have lied twice.", "date": "2026-08-11", "adr": "ADR-041"}, {"id": "tao-180", "aspect": "C", "verb": "recapitulate", "text": "let your conviction track the live state, not the intent you declared; when execution diverges, the score moves with reality.", "date": "2026-08-11", "adr": "ADR-005"}, {"id": "tao-181", "aspect": "C", "verb": "recapitulate", "text": "a tool that ships to production without a human hand violates the first principle it was built to defend.", "date": "2026-08-11", "adr": "ADR-014"}, {"id": "tao-182", "aspect": "C", "verb": "recapitulate", "text": "after the adversarial pass, keep only what dynamics hold up, not what a theorem seemed to promise; claim what survived, not what merely sounded clean.", "date": "2026-08-11", "adr": "ADR-023"}, {"id": "tao-183", "aspect": "C", "verb": "recapitulate", "text": "ground-check the assumed problem before prescribing the fix; what looked like a missing surface was a broken delivery pipe, and the cure was a repair, not a build.", "date": "2026-08-11", "adr": "ADR-059"}, {"id": "tao-184", "aspect": "C", "verb": "recapitulate", "text": "show the repair seam. a thing mended and shown honest outranks a thing that pretends it never broke.", "date": "2026-08-11", "adr": "ADR-049"}, {"id": "tao-185", "aspect": "C", "verb": "recapitulate", "text": "you cannot prevent a dishonest waiver, but you can make its churn visible. surfaced abuse is itself the signal to revisit.", "date": "2026-08-11", "adr": "ADR-034"}, {"id": "tao-186", "aspect": "C", "verb": "recapitulate", "text": "name the soft limit plainly. a per-device flag is not cryptographic enforcement, and saying so is cheaper than being caught overclaiming.", "date": "2026-08-11", "adr": "ADR-037"}, {"id": "tao-187", "aspect": "C", "verb": "recapitulate", "text": "the mold that made the tenth spoon identical to the first was the contract, not the care that night.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-188", "aspect": "C", "verb": "recapitulate", "text": "you cannot rewrite why a belief changed. the chain of custody already wrote it down.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-189", "aspect": "C", "verb": "recapitulate", "text": "keep the load-bearing grain; a line kept for being quotable is sediment, not signal.", "date": "2026-08-11", "adr": "ADR-041"}, {"id": "tao-190", "aspect": "H", "verb": "analyze", "text": "let automation repair freely where a mistake is cheap, and require a human hand only where a mistake is not.", "date": "2026-08-11", "adr": "ADR-014"}, {"id": "tao-191", "aspect": "H", "verb": "analyze", "text": "do not chain a ready thing to a blocked thing. artificial sequencing spends real opportunity for no gain.", "date": "2026-08-11", "adr": "ADR-015"}, {"id": "tao-192", "aspect": "H", "verb": "analyze", "text": "the power to set its own rate of forgetting is the power to overrule what you revealed you wanted; keep that constant out of the system's reach.", "date": "2026-08-11", "adr": "ADR-023"}, {"id": "tao-193", "aspect": "H", "verb": "analyze", "text": "the cost of a fork is paid later, at every case that must be changed in parallel.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-194", "aspect": "H", "verb": "analyze", "text": "the uncaught window is the true cost. what the fog buried, you paid for in a bearing you never took.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-195", "aspect": "H", "verb": "assess", "text": "an account is earned, not demanded. ask after the tool has shown its worth, and the asking answers itself.", "date": "2026-08-11", "adr": "ADR-016"}, {"id": "tao-196", "aspect": "H", "verb": "assess", "text": "prefer the bet with low sunk cost and high signal; when a failed run still leaves an asset behind, the downside is bounded and the trial is cheap.", "date": "2026-08-11", "adr": "ADR-058"}, {"id": "tao-197", "aspect": "H", "verb": "assess", "text": "a catalog no one enforces is inventory. and an inventory of open loops is itself an open loop.", "date": "2026-08-11", "adr": "ADR-033"}, {"id": "tao-198", "aspect": "H", "verb": "assess", "text": "when torn between two scores, choose the lower and name the weak lens. false precision upward is exactly the failure a gut-check exists to catch.", "date": "2026-08-11", "adr": "ADR-035"}, {"id": "tao-199", "aspect": "H", "verb": "assess", "text": "cheap promotion is what makes the loop compound; an expensive mold is never cut.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-200", "aspect": "H", "verb": "assess", "text": "weigh the condenser against the blower: a system that only listens hoards, and one that only projects lies.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-201", "aspect": "H", "verb": "evaluate", "text": "local velocity compounds every day; zero-config is a feature, not a compromise.", "date": "2026-08-11", "adr": "ADR-002"}, {"id": "tao-202", "aspect": "H", "verb": "evaluate", "text": "solve the problem that exists, not the one that only might; complexity is not owed to a risk with no data behind it yet.", "date": "2026-08-11", "adr": "ADR-006"}, {"id": "tao-203", "aspect": "H", "verb": "evaluate", "text": "recovering proven work costs hours; rebuilding from a blank file costs days; search the history before you reach for the empty page.", "date": "2026-08-11", "adr": "ADR-009"}, {"id": "tao-204", "aspect": "H", "verb": "evaluate", "text": "do not pay a real cost for a benefit that is zero at your current scale.", "date": "2026-08-11", "adr": "ADR-011"}, {"id": "tao-205", "aspect": "H", "verb": "evaluate", "text": "the page's real job may be credibility rather than conversion; the private conversation is where the deal actually closes.", "date": "2026-08-11", "adr": "ADR-013"}, {"id": "tao-206", "aspect": "H", "verb": "evaluate", "text": "optimize for the valuable cases, not the easy ones. the moments that matter most are exactly the ones that resist your neat fields.", "date": "2026-08-11", "adr": "ADR-018"}, {"id": "tao-207", "aspect": "H", "verb": "evaluate", "text": "do not rewrite the whole for a question that lives at the boundary. blast radius with no gain in correctness is pure cost.", "date": "2026-08-11", "adr": "ADR-019"}, {"id": "tao-208", "aspect": "H", "verb": "evaluate", "text": "an improvement can be right in principle and wrong in sequence; do the cheap high-leverage repair first and let the ambitious build wait for the data that would judge it.", "date": "2026-08-11", "adr": "ADR-059"}, {"id": "tao-209", "aspect": "H", "verb": "evaluate", "text": "a known failure with named victims costs less to fix while the fix is already scoped than to triage after it has quietly compounded.", "date": "2026-08-11", "adr": "ADR-026"}, {"id": "tao-210", "aspect": "H", "verb": "evaluate", "text": "capture the input now even when the pipeline that will use it does not yet exist. asking twice costs more than storing once.", "date": "2026-08-11", "adr": "ADR-029"}, {"id": "tao-211", "aspect": "H", "verb": "evaluate", "text": "reconcile the second version into the one source of truth while the port is still small. two parallel systems compound their divergence with every commit.", "date": "2026-08-11", "adr": "ADR-031"}, {"id": "tao-212", "aspect": "H", "verb": "evaluate", "text": "only a machine that can fail the build restores parity. discipline and memory have already been tried, and already failed.", "date": "2026-08-11", "adr": "ADR-034"}, {"id": "tao-213", "aspect": "H", "verb": "evaluate", "text": "the mold is the leverage: cut it once, and every casting after comes nearly free.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-214", "aspect": "H", "verb": "evaluate", "text": "leverage is the gain stage. the same weak signal, amplified honestly, moves what the whisper could not.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-215", "aspect": "H", "verb": "synthesize", "text": "take the manual fallback when the automation stalls, but write the debt down where it will be found.", "date": "2026-08-11", "adr": "ADR-005"}, {"id": "tao-216", "aspect": "H", "verb": "synthesize", "text": "spend your strongest guard where untrusted input meets a way out. everywhere else the cheap model is enough. security concentrated is security you can afford.", "date": "2026-08-11", "adr": "ADR-032"}, {"id": "tao-217", "aspect": "H", "verb": "synthesize", "text": "make the enforcement boring: one file, a little code, one step. the reinvented-wheel warning applies to governance machinery too.", "date": "2026-08-11", "adr": "ADR-034"}, {"id": "tao-218", "aspect": "H", "verb": "synthesize", "text": "instance to class to class-of-the-class: each promotion lowers the cost of the next.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-219", "aspect": "H", "verb": "synthesize", "text": "the reactor compounds; the bomb spends. contained fission is the only fusion that pays over time.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-220", "aspect": "H", "verb": "recapitulate", "text": "the path you decided and the path you walked are rarely the same; record what execution actually did, not what the plan chose.", "date": "2026-08-11", "adr": "ADR-007"}, {"id": "tao-221", "aspect": "H", "verb": "recapitulate", "text": "separate content dependencies from code dependencies; the two wait on different things and slip for different reasons.", "date": "2026-08-11", "adr": "ADR-013"}, {"id": "tao-222", "aspect": "H", "verb": "recapitulate", "text": "a decision is not closed until its outcome is measured and handed forward; a chain of receipts that debriefs itself becomes an atlas the next choice can read.", "date": "2026-08-11", "adr": "ADR-020"}, {"id": "tao-223", "aspect": "H", "verb": "recapitulate", "text": "hold the decision provisional and updatable, and set a dated review against a signal named in advance; a bet with no scheduled reckoning is just a hope.", "date": "2026-08-11", "adr": "ADR-025"}, {"id": "tao-224", "aspect": "H", "verb": "recapitulate", "text": "log every probe. a system that learns from each attack grows stronger from being tested, rather than merely surviving it.", "date": "2026-08-11", "adr": "ADR-032"}, {"id": "tao-225", "aspect": "H", "verb": "recapitulate", "text": "the mold pays for itself on the sec d of what you received.", "date": "2026-08-11", "adr": "founding-v1"}, {"id": "tao-237", "aspect": "~", "verb": "~", "text": "an echo is signal only if it was independent before it was linked.", "date": "2026-08-11", "adr": "founding-v1"}, {"id": "tao-238", "aspect": "~", "verb": "~", "text": "three axes bracing one point make a structure. one axis makes a story.", "date": "2026-08-11", "adr": "founding-v1"}, {"id": "tao-239", "aspect": "~", "verb": "~", "text": "the leap is the fuel. the landing is the discipline.", "date": "2026-08-11", "adr": "founding-v1"}, {"id": "tao-240", "aspect": "~", "verb": "~", "text": "reflexiveness is prepaid. it is never free.", "date": "2026-08-11", "adr": "founding-v1"}, {"id": "tao-241", "aspect": "~", "verb": "~", "text": "render through the fog to earned clarity.", "date": "2026-08-11", "adr": "founding-v1"}, {"id": "tao-242", "aspect": "C", "verb": "synthesize", "text": "The truth layer feeds the face layer; never let a prospect-facing surface carry an internal fact.", "date": "2026-08-11", "adr": "ADR-050"}, {"id": "tao-243", "aspect": "R", "verb": "evaluate", "text": "Every gate is a detector, and every failure it catches is a receipt to learn from.", "date": "2026-08-11", "adr": "ADR-051"}, {"id": "tao-244", "aspect": "W", "verb": "recapitulate", "text": "Orient at open, advance at close; regenerate only the mechanical and leave the judgment a receipt.", "date": "2026-08-11", "adr": "ADR-052"}, {"id": "tao-245", "aspect": "H", "verb": "assess", "text": "An artifact with no owner rots by neglect; give it an auditor before it ships stale.", "date": "2026-08-11", "adr": "ADR-052"}, {"id": "tao-246", "aspect": "D", "verb": "synthesize", "text": "Find the one invariant beneath the many surfaces; parameterize it and the family comes for free.", "date": "2026-08-11", "adr": "ADR-050"}, {"id": "tao-247", "aspect": "H", "verb": "assess", "text": "A seed is free to hold; only the spark that fires it runs a meter.", "date": "2026-08-13"
