  .room-title{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,5vw,3.6rem);line-height:.98;letter-spacing:-.015em;color:#fff;text-shadow:0 0 42px rgba(0,240,255,.12)}

  .lede b{color:var(--gold);font-style:normal;font-weight:500}

  .panel p{color:var(--fg2);font-size:.92rem;margin:0 0 .6em}
  .panel.wide{grid-column:1/-1}
  .rows{display:grid;gap:6px;margin-top:8px}
  .row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:7px 10px;border:1px solid var(--border);border-radius:4px;background:rgba(17,24,39,.6);font-size:.88rem;transition:opacity .25s,filter .25s}

  .row .more{display:none;grid-column:1/-1;font-size:.86rem;color:var(--fg2);border-top:1px dashed var(--border);padding-top:8px;margin-top:4px}
  .row.open .more{display:block}
  .row.clickable{cursor:pointer}
  .row .more dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0}
  .row .more dt{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;color:var(--fg4);padding-top:3px}
  .row .more dd{margin:0}

  .latt text{font-family:var(--mono);font-size:9px;fill:var(--fg3)}

  .sr{position:absolute;left:-9999px}

uardrail: Path-Based Ignored-Build-Step", "status": "DECIDED", "y": "GREEN", "date": "2026-08-01", "file": "ADR-039-deploy-cost-guardrail-ignored-build-step.md", "sharp": "How does arcs-v9 stop non-shipping commits (docs, handoffs, session state, Claude Code tooling) from triggering full paid Vercel production builds, without accidentally skipping real shippable changes?"}, {"id": "ADR-040", "title": "Debrief Close-the-Loop: Calendar Invite vs. Email Only", "status": "DRAFT", "y": "SCRATCH", "date": "2026-06-21", "file": "ADR-040-debrief-calendar-invite-vs-email.md", "sharp": "Should the debrief (close-the-loop) touchpoint move from email-only to a real Google Calendar event, given email-only is producing a ~0.4% completion rate?"}, {"id": "ADR-045", "title": "Night Moves: End-of-Day Work Digest Routine", "status": "DECIDED", "y": "GREEN", "date": "2026-08-10", "file": "ADR-045-night-moves-digest-routine.md", "sharp": "How does Zach keep a legible daily record of work spread across ~40 parallel worktrees, without hand-compiling it or spending unattended token budget?"}, {"id": "ADR-046", "title": "Witness Trigger: Live Capture of a Flash of Brilliance", "status": "DECIDED", "y": "GREEN", "date": "2026-08-11", "file": "ADR-046-witness-trigger-live-capture.md", "sharp": "When a genuine insight crystallizes mid-conversation, how does ARCS attest to it honestly, without either losing it or reconstructing it later and pretending the reconstruction was a live witness?"}, {"id": "ADR-050", "title": "The federated family + the SSOT/front-end air-gap", "status": "DECIDED", "y": "GREEN", "date": "2026-08-11", "file": "ADR-050-federated-family-airgap.md", "sharp": null}, {"id": "ADR-051", "title": "Drift receipts: every gate is a detector, every failure a receipt", "status": "DECIDED", "y": "GREEN", "date": "2026-08-11", "file": "ADR-051-drift-receipt-gate.md", "sharp": null}, {"id": "ADR-052", "title": "Inchworm drift-auditor for orphaned artifacts", "status": "DECIDED", "y": us": "DECIDED", "y": "GREEN", "date": "2026-08-16", "file": "ADR-063-public-goods-connector-visual-family.md", "sharp": null}, {"id": "ADR-064", "title": "External corroboration is the milestone gate; impact is the rank", "status": "DECIDED", "y": "GREEN", "date": "2026-08-16", "file": "ADR-064-external-corroboration-milestone-gate.md", "sharp": null}, {"id": "ADR-065", "title": "Corpus is SSOT; storage is induced projection; the Infra Compass reads the field", "status": "DECIDED", "y": "GREEN", "date": "2026-08-18", "file": "ADR-065-corpus-ssot-induced-projection-infra-compass.md", "sharp": null}, {"id": "ADR-066", "title": "Generative Recoil: reverse-listen a session, compose instance → class → invariant", "status": "DECIDED", "y": "GREEN", "date": "2026-08-19", "file": "ADR-066-generative-recoil-instance-class-invariant.md", "sharp": null}, {"id": "ADR-067", "title": "Cross-subject comparative recoil: independently-derived beats corroborated across counterparts", "status": "PROPOSED", "y": "YELLOW", "date": "2026-08-19", "file": "ADR-067-cross-subject-comparative-recoil.md", "sharp": null}, {"id": "ADR-068", "title": "The verb × altitude gate matrix: every stage cut prints an artifact, through a gate, to a fate", "status": "DECIDED", "y": "GREEN", "date": "2026-08-23", "file": "ADR-068-verb-altitude-gate-matrix.md", "sharp": null}, {"id": "ADR-069", "title": "First closed client receipt: expectation management moves from promise to precedent", "status": "DECIDED", "y": "GREEN", "date": "2026-08-26", "file": "ADR-069-first-closed-client-receipt-precedent.md", "sharp": "Now that the first ex-ante → ex-post receipt has closed in a paying client engagement (and closed RED on the estimate), what governs Todd-facing expectation management going forward?"}, {"id": "ADR-031", "title": "Design system reconciliation", "status": "DECIDED", "y": null, "date": "2026-06-30", "file": "ADR-031-design-system-reconciliation.md", "sharp": null}, {"id": "ADR-073", "title": "Route ADR-audit harness default to laguna-xs-2.1:free", "status": "DECIDED", "y": null, "date": "2026-08-26", "file": "ADR-073-model-routing-adr-audit-default.md", "sharp": "Which free model should `adr_audit.py` target by default when the `--model` override is omitted — solar-pro4:free (current Hermes default, most-audited against our ADR corpus) or laguna-xs-2.1:free (fastest measured, pure JSON output, free)?"}, {"id": "ADR-072", "title": "Engine-Sovereignty Gradient (engines are tenants, the receipt history is the freehold)", "status": "DECIDED", "y": "GREEN", "date": "2026-08-28", "file": "ADR-072-engine-sovereignty-gradient.md", "sharp": "As the predictive engine behind ARCS changes over time (cloud LLM → JEPA → GIGI), what is sovereign and what is replaceable — and what must survive every such swap unchanged?"}, {"id": "ADR-070", "title": "ARCS is two surfaces: the Receipt (deductive record) and the Induction (abductive instrument-forging)", "status": "DECIDED", "y": null, "date": "2026-08-28", "file": "ADR-070-arcs-two-surface-receipt-and-induction.md", "sharp": "Deductive tooling assumes you can already name what you want. But the highest-value ARCS moments are the opposite — a vague target you cannot yet put in words, fluid exploration, wanting the right thing to float across your desk. What is the surface that serves *that*, and how does it relate to the receipt?"}, {"id": "ADR-071", "title": "The Möbius invariant: one non-orientable surface, a triune load-bearing minimum, held honest by the prototype's own gravity", "status": "DECIDED", "y": null, "date": "2026-08-28", "file": "ADR-071-mobius-one-surface-triune-invariant-gravity-well.md", "sharp": "ADR-070 named ARCS as two surfaces — Receipt (deductive) and Induction (abductive). But a two-sided object has an inside and an outside you cross between. Is that the real topology? And why is the ARCS logo a Möbius strip rather than a circle, an arc, or a two-sided ribbon?"}, {"id": "ADR-032", "title": "Zero-Trust Posture (governing)", "status": "ACCEPTED", "y": null, "date": "2026-07-19", "file": "ADR-032-zero-trust-posture.md", "sharp": null}, {"id": "ADR-033", "title": "The Serialization Pathogen Family (tuple axiom + membership registry)", "status": "DECIDED", "y": null, "date": "2026-07-18", "file": "ADR-033-serialization-pathogen-family.md", "sharp": "ARCS keeps discovering failures where its own append-only ledgers serialize beliefs that later read wrong (stale, over-transferred, unactioned, over-trusted, or semantically drifted). Do we codify each as a new spec section per pathogen, or as one governed family with a single axiom, an admission gate, and mechanism-f…"}, {"id": "ADR-034", "title": "Enforcement Parity: Internal Invariants Get the Same Gates as Client Artifacts", "status": "DECIDED", "y": null, "date": "2026-07-16", "file": "ADR-034-enforcement-parity.md", "sharp": "Should an audit finding be considered closed when it is documented, or only when a mechanism (test / CI rule / runtime guard) or a dated waiver exists — and should CI enforce that distinction?"}, {"id": "ADR-038", "title": "Recoil Bookmark Primitive (lightweight moment-flag vs. full kinematic manifold)", "status": "PROPOSED", "y": null, "date": "2026-07-31", "file": "ADR-038-recoil-bookmark-primitive.md", "sharp": "A recoil report needs a way to flag *which parts of a call are worth revisiting* — where something resonated (a kairos peak) and where the counterpart pulled back (a park). The first instinct is a **full kinematic manifold**: a per-segment resonance curve across the whole call (added to the Justin/Delaney report as a…"}, {"id": "ADR-044", "title": "Temporal-Provenance Gate: capability claims carry fact-vs-fiction chain of custody", "status": "ACCEPTED", "y": null, "date": "2026-08-10", "file": "ADR-044-temporal-provenance-gate.md", "sharp": "How do we stop ARCS from stating *aspirational* capabilities (\"model-agnostic, runs on Gemini, nothing leaves Google\") as *present fact*, when the system has no formal mechanism to distinguish what is true NOW from what is only true of a future/hypothetical deployment?"}, {"id": "ADR-048", "title": "Secrets Inventory & Rotation", "status": "ACCEPTED", "y": null, "date": "2026-07-19", "file": "ADR-048-secrets-inventory-rotation.md", "sharp": null}, {"id": "ADR-049", "title": "Anonymous Receipt Remediation: Conform Forward, No Retroactive Purge, Opt-In Save", "status": "DECIDED", "y": null, "date": "2026-07-13", "file": "ADR-049-anonymous-receipt-remediation.md", "sharp": "Production stored anonymous receipts (question text, `userId: null`) while `/trust` §1 and `/privacy` promised \"anonymous sessions: nothing is stored / no auth = no write path.\" How is the violation remediated — code, copy, and the 48 pre-fix rows?"}, {"id": "ADR-058", "title": "CALIBRATE / IDEA Construction", "status": "DRAFT", "y": null, "date": "2026-06-16", "file": "ADR-058-CALIBRATE-IDEA-Construction.md", "sharp": null}], "proverbs": [{"id": "tao-001", "aspect": "D", "verb": "analyze", "text": "two unsequenced calls to action compete; number the steps or the visitor guesses which comes first.", "date": "2026-08-11", "adr": "ADR-003"}, {"id": "tao-002", "aspect": "D", "verb": "analyze", "text": "name the mechanical task as mechanical, and spend no deliberation it does not deserve.", "date": "2026-08-11", "adr": "ADR-004"}, {"id": "tao-003", "aspect": "D", "verb": "analyze", "text": "know your actual distribution model before you optimize the surface; a warm-referral artifact is not a cold funnel and must not be tuned like one.", "date": "2026-08-11", "adr": "ADR-013"}, {"id": "tao-004", "aspect": "D", "verb": "analyze", "text": "when the form itself is the cognitive tax you promised to remove, the form is the bug.", "date": "2026-08-11", "adr": "ADR-018"}, {"id": "tao-005", "aspect": "D", "verb": "analyze", "text": "goals do not hang from a single parent; one small aim serves many large ones, so the honest shape is a lattice, not a tree.", "date": "2026-08-11", "adr": "ADR-023"}, {"id": "tao-006", "aspect": "D", "verb": "analyze", "text": "beneath the stated problem lies the core want; transmute the raw complaint into the truth it is actually reaching for.", "date": "2026-08-11", "adr": "ADR-058"}, {"id": "tao-007", "aspect": "D", "verb": "analyze", "text": "a prompt to ask next and an answered question already logged are different artifacts. do not let one stand in for the other.", "date": "2026-08-11", "adr": "ADR-030"}, {"id": "tao-008", "aspect": "D", "verb": "analyze", "text": "no source is trusted for being familiar. another agent's output, and even your own prior word, is input until verified.", "date": "2026-08-11", "adr": "ADR-032"}, {"id": "tao-009", "aspect": "D", "verb": "analyze", "text": "keep parallel frames parallel. the same five lenses aimed at a commit and at a decision must not be merged; a commit is not a decision receipt.", "date": "2026-08-11", "adr": "ADR-035"}, {"id": "tao-010", "aspect": "D", "verb": "analyze", "text": "the decision is not what to build. it is whether this will be built again.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-011", "aspect": "D", "verb": "analyze", "text": "a decision is a discharge: it fires when the potential peaks and the gap aligns, not when the clock says so.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-012", "aspect": "D", "verb": "analyze", "text": "a decision carries two numbers, the audited and the assessed. never let the second wear the first's clothes.", "date": "2026-08-11", "adr": "ADR-041"}, {"id": "tao-013", "aspect": "D", "verb": "assess", "text": "the isolation that actually holds is the one at the layer your queries pass through; everything the privileged path bypasses protects only strangers.", "date": "2026-08-11", "adr": "ADR-008"}, {"id": "tao-014", "aspect": "D", "verb": "assess", "text": "prefer the clean end-state over the workaround whose suffix leaks into all future code.", "date": "2026-08-11", "adr": "ADR-010"}, {"id": "tao-015", "aspect": "D", "verb": "assess", "text": "a dependency blocks only what truly depends on it. ship the independent parts now.", "date": "2026-08-11", "adr": "ADR-015"}, {"id": "tao-016", "aspect": "D", "verb": "assess", "text": "a finding is not closed because it is written down. it closes with a mechanism that prevents recurrence, or a dated waiver that owns the deferral.", "date": "2026-08-11", "adr": "ADR-034"}, {"id": "tao-017", "aspect": "D", "verb": "assess", "text": "judge a build by whether the second case would fork it or reuse it.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-018", "aspect": "D", "verb": "assess", "text": "the flash is not the decision. the confirmed receipt is; a spark no one received went to ground.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-019", "aspect": "D", "verb": "evaluate", "text": "ship changes that are independently deployable and individually falsifiable, so each one can teach you something alone.", "date": "2026-08-11", "adr": "ADR-013"}, {"id": "tao-020", "aspect": "D", "verb": "evaluate", "text": "keep the calibrating step as fuel, not a destination; put no extra stop between the question and the answer it feeds.", "date": "2026-08-11", "adr": "ADR-024"}, {"id": "tao-021", "aspect": "D", "verb": "evaluate", "text": "sealing everything is over-broad and throws away a real asset. split instead, so the value survives in the open and the secret survives in the dark.", "date": "2026-08-11", "adr": "ADR-036"}, {"id": "tao-022", "aspect": "D", "verb": "evaluate", "text": "a one-off earns no mold. promote on the second real case, not the first.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-023", "aspect": "D", "verb": "evaluate", "text": "weigh a decision by whether it would survive its own recoil, not by how bright it looked when it fired.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-024", "aspect": "D", "verb": "synthesize", "text": "use the fast tool to bootstrap and the tracked tool to live; one decision names both and the trigger that switches between them.", "date": "2026-08-11", "adr": "ADR-007"}, {"id": "tao-025", "aspect": "D", "verb": "synthesize", "text": "automation authority is a topology, not a tier. do not ask what level of automation is safe. ask at what boundary automation stops and human agency begins.", "date": "2026-08-11", "adr": "ADR-014"}, {"id": "tao-026", "aspect": "D", "verb": "synthesize", "text": "lock the minimum that every surface must share, and let each surface own whatever it needs above it.", "date": "2026-08-11", "adr": "ADR-017"}, {"id": "tao-027", "aspect": "D", "verb": "synthesize", "text": "an instrument panel makes the user assemble the data first. a navigator takes the raw signal and finds the structure. build the one the hardest cases need.", "date": "2026-08-11", "adr": "ADR-018"}, {"id": "tao-028", "aspect": "D", "verb": "synthesize", "text": "annotate the sealed record, never rewrite it; a decision gains meaning from what wraps it, not from tampering with the thing itself.", "date": "2026-08-11", "adr": "ADR-020"}, {"id": "tao-029", "aspect": "D", "verb": "synthesize", "text": "infer the structure from the trail already left behind; to declare it up front is to freeze a preference still taking form.", "date": "2026-08-11", "adr": "ADR-023"}, {"id": "tao-030", "aspect": "D", "verb": "synthesize", "text": "resolve the architecture forks before any code is laid; name the gates first, and every downstream build inherits a settled answer.", "date": "2026-08-11", "adr": "ADR-024"}, {"id": "tao-031", "aspect": "D", "verb": "synthesize", "text": "a public act is one-way, but the decisions beneath it stay two-way; make the irreversible claim while keeping the mechanism revisable.", "date": "2026-08-11", "adr": "ADR-025"}, {"id": "tao-032", "aspect": "D", "verb": "synthesize", "text": "build the instrument that will tell you whether a better signal helps before you build the better signal; precision you cannot measure is precision spent in the dark.", "date": "2026-08-11", "adr": "ADR-059"}, {"id": "tao-033", "aspect": "D", "verb": "synthesize", "text": "a record of a decision is not the decision remade. the instrument renders the terrain, it does not adjudicate it.", "date": "2026-08-11", "adr": "ADR-027"}, {"id": "tao-034", "aspect": "D", "verb": "synthesize", "text": "do not guess an unconfirmed distinction into a schema, because the schema outlives the guess. route it as a cheap question instead.", "date": "2026-08-11", "adr": "ADR-028"}, {"id": "tao-035", "aspect": "D", "verb": "synthesize", "text": "when a richer version arrives, extend the single source of truth rather than stand up a parallel one to move faster. the fork is a debt paid later with interest.", "date": "2026-08-11", "adr": "ADR-031"}, {"id": "tao-036", "aspect": "D", "verb": "synthesize", "text": "when the code and the promise diverge, bend the code to the promise. the promise is your position; the code is only how you hold it.", "date": "2026-08-11", "adr": "ADR-049"}, {"id": "tao-037", "aspect": "D", "verb": "synthesize", "text": "a stored belief is never just a claim. it carries its time, its scope, its warrant, its debts, and its dictionary. drop any one and the belief reads wrong later.", "date": "2026-08-11", "adr": "ADR-033"}, {"id": "tao-038", "aspect": "D", "verb": "synthesize", "text": "to share a thing without storing it, hand the whole payload in the part of the link the server never sees.", "date": "2026-08-11", "adr": "ADR-037"}, {"id": "tao-039", "aspect": "D", "verb": "synthesize", "text": "author the cheap primitive and derive the expensive view from it. one source of truth, and the rich picture is rendered, never separately maintained.", "date": "2026-08-11", "adr": "ADR-038"}, {"id": "tao-040", "aspect": "D", "verb": "synthesize", "text": "instance, then class: solve it once concretely, then cast the mold the second case asks for.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-041", "aspect": "D", "verb": "synthesize", "text": "recipe, discharge, receipt: the instruction given, the arc across the gap, the record of what arrived. one decision, three moments.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-042", "aspect": "D", "verb": "synthesize", "text": "an empty cell is not a failure. it is a stub: a place kept for a proverb not yet earned.", "date": "2026-08-11", "adr": "ADR-041"}, {"id": "tao-043", "aspect": "D", "verb": "recapitulate", "text": "when a change falls short, do not just block it. report the score, the weakest lens, and the one or two edits that would clear the bar.", "date": "2026-08-11", "adr": "ADR-035"}, {"id": "tao-044", "aspect": "D", "verb": "recapitulate", "text": "what you built twice by hand, you should have built once as a mold.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-045", "aspect": "D", "verb": "recapitulate", "text": "every decision leaves a coordinate. the receipt is where it stood, so the next one knows where it stands.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-046", "aspect": "D", "verb": "recapitulate", "text": "a filed decision that keeps its tildes can be trusted years later; one that hid them cannot.", "date": "2026-08-11", "adr": "ADR-041"}, {"id": "tao-047", "aspect": "R", "verb": "analyze", "text": "route discipline is a real control only while the routes stay few enough to audit by hand.", "date": "2026-08-11", "adr": "ADR-001"}, {"id": "tao-048", "aspect": "R", "verb": "analyze", "text": "a dependency that fails silently takes your value away without warning.", "date": "2026-08-11", "adr": "ADR-005"}, {"id": "tao-049", "aspect": "R", "verb": "analyze", "text": "a bootstrap shortcut used past bootstrap stops being a shortcut and becomes permanent divergence.", "date": "2026-08-11", "adr": "ADR-007"}, {"id": "tao-050", "aspect": "R", "verb": "analyze", "text": "match the control to the real attack surface; a policy guarding a door no one opens is theater.", "date": "2026-08-11", "adr": "ADR-008"}, {"id": "tao-051", "aspect": "R", "verb": "analyze", "text": "a silent fallback that hands back the wrong type disables every check downstream of it, and nothing tells you.", "date": "2026-08-11", "adr": "ADR-010"}, {"id": "tao-052", "aspect": "R", "verb": "analyze", "text": "convenience machinery that quietly defeats the optimizer trades a hidden build cost for a cosmetic gain.", "date": "2026-08-11", "adr": "ADR-011"}, {"id": "tao-053", "aspect": "R", "verb": "analyze", "text": "an offer shown before sense-making finishes interrupts it, and you lose both the free flow and the sale.", "date": "2026-08-11", "adr": "ADR-012"}, {"id": "tao-054", "aspect": "R", "verb": "analyze", "text": "a bottom-up order left ungoverned calcifies into the rigid hierarchy it meant to escape; the heavy edges only grow heavier until nothing can move.", "date": "2026-08-11", "adr": "ADR-023"}, {"id": "tao-055", "aspect": "R", "verb": "analyze", "text": "find the true bottleneck before optimizing anything; a loop that closes half a percent of the time is not failing for want of a sharper signal.", "date": "2026-08-11", "adr": "ADR-059"}, {"id": "tao-056", "aspect": "R", "verb": "analyze", "text": "egress is a control, not just ingress. read-only is not safe. every outbound channel is a way for stolen truth to leave.", "date": "2026-08-11", "adr": "ADR-032"}, {"id": "tao-057", "aspect": "R", "verb": "analyze", "text": "the recurring failure is always the same: documentation ends the loop. a finding that terminates in a file with no gate will happen again.", "date": "2026-08-11", "adr": "ADR-034"}, {"id": "tao-058", "aspect": "R", "verb": "analyze", "text": "gating a page hides the surface, not the source. the history stays cloneable long after the view is closed.", "date": "2026-08-11", "adr": "ADR-036"}, {"id": "tao-059", "aspect": "R", "verb": "analyze", "text": "silent fork-drift is the slow ruin: three copies that no longer agree, and no one chose it.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-060", "aspect": "R", "verb": "analyze", "text": "an attractor that pulls too eagerly does not find the pattern. it manufactures one.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-061", "aspect": "R", "verb": "assess", "text": "defense in depth is a maintenance cost you buy when the access paths multiply, not before.", "date": "2026-08-11", "adr": "ADR-001"}, {"id": "tao-062", "aspect": "R", "verb": "assess", "text": "the risk you reject an option for is the risk you inherit the day circumstance forces that option on you.", "date": "2026-08-11", "adr": "ADR-005"}, {"id": "tao-063", "aspect": "R", "verb": "assess", "text": "every accepted trade-off should carry the condition under which it expires.", "date": "2026-08-11", "adr": "ADR-006"}, {"id": "tao-064", "aspect": "R", "verb": "assess", "text": "accept duplication only while it stays visible and localized, and name the horizon at which you will pay it down.", "date": "2026-08-11", "adr": "ADR-009"}, {"id": "tao-065", "aspect": "R", "verb": "assess", "text": "options that look like rivals are often complementary; do not strawman the fallback you may have to promote.", "date": "2026-08-11", "adr": "ADR-013"}, {"id": "tao-066", "aspect": "R", "verb": "assess", "text": "name the exact boundary conditions. a trip signal you can name is one you can audit on its own.", "date": "2026-08-11", "adr": "ADR-014"}, {"id": "tao-067", "aspect": "R", "verb": "assess", "text": "fail fast at the bridge, not silently at the database. a missing field should raise where it crosses, not rot where it lands.", "date": "2026-08-11", "adr": "ADR-019"}, {"id": "tao-068", "aspect": "R", "verb": "assess", "text": "speak only when ruin, derailment, or a sharp swing in conviction fires; commentary that runs constantly is noise no one reads.", "date": "2026-08-11", "adr": "ADR-020"}, {"id": "tao-069", "aspect": "R", "verb": "assess", "text": "when nothing yet exists to challenge an early commitment, hold, do not infer; locking before the flow can test it is the very breach the discipline exists to prevent.", "date": "2026-08-11", "adr": "ADR-023"}, {"id": "tao-070", "aspect": "R", "verb": "assess", "text": "a generated id is not a secret; enforce the owner-plus-record key at the application layer and treat row-level rules as a backup, not the primary gate.", "date": "2026-08-11", "adr": "ADR-024"}, {"id": "tao-071", "aspect": "R", "verb": "assess", "text": "a message that reports success but never arrives is more dangerous than one that errors, because nothing tells you to go look.", "date": "2026-08-11", "adr": "ADR-026"}, {"id": "tao-072", "aspect": "R", "verb": "assess", "text": "a secret in git history is a rotation event, not a fix. treat it as disclosed the moment it lands.", "date": "2026-08-11", "adr": "ADR-048"}, {"id": "tao-073", "aspect": "R", "verb": "assess", "text": "a shared link is a debt to everyone who kept it. delete the record and you break their reference, not merely your own.", "date": "2026-08-11", "adr": "ADR-049"}, {"id": "tao-074", "aspect": "R", "verb": "assess", "text": "assume breach. the architecture's task is not to prevent every compromise but to bound what one compromise can reach.", "date": "2026-08-11", "adr": "ADR-032"}, {"id": "tao-075", "aspect": "R", "verb": "assess", "text": "a zero-margin operation is a design bug, not a test of nerve. add a checkpoint that proves nothing is lost before you delete.", "date": "2026-08-11", "adr": "ADR-036"}, {"id": "tao-076", "aspect": "R", "verb": "assess", "text": "a one-off packaged too early is speculative generality, the waste that hides as foresight.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-077", "aspect": "R", "verb": "assess", "text": "rank a signal by how hard it resists refutation, not by how well it fits the story you already carry.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-078", "aspect": "R", "verb": "assess", "text": "unlabeled non-gaap presented as gaap is what quietly rots a house.", "date": "2026-08-11", "adr": "ADR-041"}, {"id": "tao-079", "aspect": "R", "verb": "evaluate", "text": "weigh failure modes, not features. bounded, one-directional complexity beats an unbounded, silent failure every time.", "date": "2026-08-11", "adr": "ADR-016"}, {"id": "tao-080", "aspect": "R", "verb": "evaluate", "text": "name the falsifiable test and the number that would kill the idea before you begin; a hypothesis with no veto threshold cannot fail, and so can teach you nothing.", "date": "2026-08-11", "adr": "ADR-058"}, {"id": "tao-081", "aspect": "R", "verb": "evaluate", "text": "instrumentation turns a launch from an assertion into a measurable bet; ship the measuring apparatus with the claim, and pre-commit the signal that would prove you wrong.", "date": "2026-08-11", "adr": "ADR-025"}, {"id": "tao-082", "aspect": "R", "verb": "evaluate", "text": "rank the guarded things by blast radius. the key that bypasses every other guard is the one to rotate first.", "date": "2026-08-11", "adr": "ADR-048"}, {"id": "tao-083", "aspect": "R", "verb": "evaluate", "text": "refuse the fix that quietly reverses a promise you already published, even when it buys a stronger guarantee.", "date": "2026-08-11", "adr": "ADR-037"}, {"id": "tao-084", "aspect": "R", "verb": "evaluate", "text": "weigh the fork against the mold: copy-paste is cheap today and dear at the tenth spoon.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-085", "aspect": "R", "verb": "evaluate", "text": "a finding held by one stream is a story. require a second stream to brace it before you stake anything on it.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-086", "aspect": "R", "verb": "synthesize", "text": "the counter-forces are load-bearing members, not patches; remove one and the structure slumps into a squat, dark, solid mass.", "date": "2026-08-11", "adr": "ADR-023"}, {"id": "tao-087", "aspect": "R", "verb": "synthesize", "text": "the promotion compulsion is its own drift: packaging for the pleasure of packaging.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-088", "aspect": "R", "verb": "synthesize", "text": "the same basin that condenses fuel condenses delusion. the only difference is the control rod.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-089", "aspect": "R", "verb": "recapitulate", "text": "a fix applied only to the live system is not finished; write it back into the baseline, or the next fresh start reopens the same wound.", "date": "2026-08-11", "adr": "ADR-022"}, {"id": "tao-090", "aspect": "R", "verb": "recapitulate", "text": "a rotation cadence that no human owns will not happen. a control without an owner is decoration.", "date": "2026-08-11", "adr": "ADR-048"}, {"id": "tao-091", "aspect": "R", "verb": "recapitulate", "text": "governance about governance feels like progress while being motion in place. judge it by whether the next person acts differently, not by how well it reads.", "date": "2026-08-11", "adr": "ADR-033"}, {"id": "tao-092", "aspect": "R", "verb": "recapitulate", "text": "what is already cloned is already disclosed. a rewrite limits the future spread; it cannot un-ring a bell that has rung.", "date": "2026-08-11", "adr": "ADR-036"}, {"id": "tao-093", "aspect": "R", "verb": "recapitulate", "text": "name in advance the evidence that would prove you wrong, and the date you will look for it. a choice with no falsifier cannot be corrected.", "date": "2026-08-11", "adr": "ADR-038"}, {"id": "tao-094", "aspect": "R", "verb": "recapitulate", "text": "every drifted shape was a mold you refused to cut when the second case arrived.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-095", "aspect": "R", "verb": "recapitulate", "text": "what did not re-converge across the runs was never a bond. let it decay before it costs you.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-096", "aspect": "R", "verb": "recapitulate", "text": "a grid that comes back full is the tell of padding. the empty cells are the honesty.", "date": "2026-08-11", "adr": "ADR-041"}, {"id": "tao-097", "aspect": "W", "verb": "analyze", "text": "the window to promote opens on the second use, not the first and not the tenth.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-098", "aspect": "W", "verb": "analyze", "text": "voltage without an aligned gap is only stored potential. read the gap before you read the charge.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-099", "aspect": "W", "verb": "assess", "text": "a gap between dev and prod stays hidden until the crossing; put the gate at the crossing, not after it.", "date": "2026-08-11", "adr": "ADR-002"}, {"id": "tao-100", "aspect": "W", "verb": "assess", "text": "the window to change migration tools closes the moment production holds a real row; baseline the history before that, not after.", "date": "2026-08-11", "adr": "ADR-007"}, {"id": "tao-101", "aspect": "W", "verb": "assess", "text": "put the default denial in place before the first outsider arrives, not after the exposure teaches you why.", "date": "2026-08-11", "adr": "ADR-008"}, {"id": "tao-102", "aspect": "W", "verb": "assess", "text": "name the explicit count or condition that flips the decision, so the revisit is a trigger and not a someday.", "date": "2026-08-11", "adr": "ADR-011"}, {"id": "tao-103", "aspect": "W", "verb": "assess", "text": "surface the price only after the value has rendered; the moment clarity is earned is the safe condition to ask for more.", "date": "2026-08-11", "adr": "ADR-012"}, {"id": "tao-104", "aspect": "W", "verb": "assess", "text": "set a falsifiable threshold conservative enough to be observable even at low volume, or the signal you wait for will only ever be noise.", "date": "2026-08-11", "adr": "ADR-013"}, {"id": "tao-105", "aspect": "W", "verb": "assess", "text": "a gate that clears on a count alone has not cleared; run the measurement the gate actually asks for before you walk through it.", "date": "2026-08-11", "adr": "ADR-023"}, {"id": "tao-106", "aspect": "W", "verb": "assess", "text": "place the only friction exactly where intent runs highest, at the moment of saving or sharing, never as a wall in front of the core value.", "date": "2026-08-11", "adr": "ADR-025"}, {"id": "tao-107", "aspect": "W", "verb": "assess", "text": "when unsure whether a safeguard applies, apply it. over-caution costs minutes; the skipped check fails in silence.", "date": "2026-08-11", "adr": "ADR-032"}, {"id": "tao-108", "aspect": "W", "verb": "assess", "text": "age every open finding against a clock. a deadline turns an unknown-unknown into something someone must act on the day it is filed.", "date": "2026-08-11", "adr": "ADR-034"}, {"id": "tao-109", "aspect": "W", "verb": "assess", "text": "ship it small, additive, and reversible, then let a few real uses decide whether it earns its keep.", "date": "2026-08-11", "adr": "ADR-038"}, {"id": "tao-110", "aspect": "W", "verb": "assess", "text": "do not cast the mold while the shape is still moving. wait for the second case to name it.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-111", "aspect": "W", "verb": "assess", "text": "do not fire early. a discharge across the wrong gap is a short, and a short burns the circuit it meant to serve.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-112", "aspect": "W", "verb": "evaluate", "text": "one access path needs one gate; a second enforcement layer earns its keep only when the surface outgrows what review can audit.", "date": "2026-08-11", "adr": "ADR-001"}, {"id": "tao-113", "aspect": "W", "verb": "evaluate", "text": "audit every caller before you delete; the grep that proves zero callers is cheaper than the break that proves one.", "date": "2026-08-11", "adr": "ADR-010"}, {"id": "tao-114", "aspect": "W", "verb": "evaluate", "text": "sequence the sure gains first and defer the aesthetic rebuild until the data earns it; the correct third move is wrong as the first.", "date": "2026-08-11", "adr": "ADR-013"}, {"id": "tao-115", "aspect": "W", "verb": "evaluate", "text": "the slowdown at the gate is not overhead. it is the integrity check the product exists to teach.", "date": "2026-08-11", "adr": "ADR-014"}, {"id": "tao-116", "aspect": "W", "verb": "evaluate", "text": "a synthetic test can prove the structure bears load and map where it breaks, yet it cannot set the operating point; only measured load can do that.", "date": "2026-08-11", "adr": "ADR-023"}, {"id": "tao-117", "aspect": "W", "verb": "evaluate", "text": "advance only when a set share of the gates pass; short of that, shelve gracefully rather than push a thing the signal did not earn.", "date": "2026-08-11", "adr": "ADR-058"}, {"id": "tao-118", "aspect": "W", "verb": "evaluate", "text": "a change that is additive, defaulted off, and reversible can ship even while the model behind it is still unsettled.", "date": "2026-08-11", "adr": "ADR-028"}, {"id": "tao-119", "aspect": "W", "verb": "evaluate", "text": "keep by default to protect what others rely on, but yield the moment someone asks you to erase their own trace. retention is a courtesy, not a refusal.", "date": "2026-08-11", "adr": "ADR-049"}, {"id": "tao-120", "aspect": "W", "verb": "evaluate", "text": "do not name a problem you cannot enforce. without a distinct mechanism and a reader that applies it, a category is decoration, not defense.", "date": "2026-08-11", "adr": "ADR-033"}, {"id": "tao-121", "aspect": "W", "verb": "evaluate", "text": "scoring a change that carries no judgment is false precision. rate what encodes a decision, skip the chore, and say plainly which it was.", "date": "2026-08-11", "adr": "ADR-035"}, {"id": "tao-122", "aspect": "W", "verb": "evaluate", "text": "order the work so the reversible, verifiable steps come first and the one-way gate comes last.", "date": "2026-08-11", "adr": "ADR-036"}, {"id": "tao-123", "aspect": "W", "verb": "evaluate", "text": "rule of three is the ceiling, not the target: promote at two when the second is already in hand.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-124", "aspect": "W", "verb": "evaluate", "text": "the safe condition to proceed is a gap aligned and a potential peaked. absent either, hold.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-125", "aspect": "W", "verb": "synthesize", "text": "a named gate turns an accepted risk into a scheduled action; without the gate, acceptable-for-now quietly becomes permanent.", "date": "2026-08-11", "adr": "ADR-006"}, {"id": "tao-126", "aspect": "W", "verb": "synthesize", "text": "when a thing waits on content that may never come, give it a deadline and a placeholder, so the wait cannot quietly become forever.", "date": "2026-08-11", "adr": "ADR-015"}, {"id": "tao-127", "aspect": "W", "verb": "synthesize", "text": "place the gate where the value has been proven, not at the door. a wall before the first taste kills the appetite it means to guard.", "date": "2026-08-11", "adr": "ADR-016"}, {"id": "tao-128", "aspect": "W", "verb": "synthesize", "text": "an owed action decays unread until someone closes it out loud. closure is a written event, never silence.", "date": "2026-08-11", "adr": "ADR-033"}, {"id": "tao-129", "aspect": "W", "verb": "synthesize", "text": "promote too early and you abstract before you understand; too late and every case is a fork.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-130", "aspect": "W", "verb": "synthesize", "text": "timing is a position, not a schedule. the window opens where the conditions meet, and closes when they part.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-131", "aspect": "W", "verb": "recapitulate", "text": "never edit a locked schema in place. when it must grow, cut a version two and leave the first untouched.", "date": "2026-08-11", "adr": "ADR-017"}, {"id": "tao-132", "aspect": "W", "verb": "recapitulate", "text": "recency and position are not authority. a point-in-time record becomes dead state wearing a live face the moment work continues past it.", "date": "2026-08-11", "adr": "ADR-032"}, {"id": "tao-133", "aspect": "W", "verb": "recapitulate", "text": "the moment to cut the mold was the moment the copy-paste began.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-134", "aspect": "W", "verb": "recapitulate", "text": "mark where the arc struck and where it refused. the record of struck gaps is the map of when to move.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-135", "aspect": "W", "verb": "recapitulate", "text": "strip the formwork only after the concrete sets. pull it while curing and the structure falls.", "date": "2026-08-11", "adr": "ADR-041"}, {"id": "tao-136", "aspect": "C", "verb": "analyze", "text": "an ambiguous name resolves to whichever match comes first, never to the one you meant.", "date": "2026-08-11", "adr": "ADR-010"}, {"id": "tao-137", "aspect": "C", "verb": "analyze", "text": "a named gap is honest; a hidden one is a lie. when you cannot check the box, state the residual risk out loud.", "date": "2026-08-11", "adr": "ADR-032"}, {"id": "tao-138", "aspect": "C", "verb": "analyze", "text": "never consume a claim that has lost a coordinate. trust it only to the fidelity it can still prove.", "date": "2026-08-11", "adr": "ADR-033"}, {"id": "tao-139", "aspect": "C", "verb": "analyze", "text": "do not score a continuous gradient over input that is only qualitative. precision the data cannot support is a lie dressed as rigor.", "date": "2026-08-11", "adr": "ADR-038"}, {"id": "tao-140", "aspect": "C", "verb": "analyze", "text": "a class is only as clear as its contract: deps, args, params, resources, schema, the manifest.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-141", "aspect": "C", "verb": "analyze", "text": "amplify the signal, never the noise, and never past the evidence that carried it in.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-142", "aspect": "C", "verb": "analyze", "text": "before you trust a number, look for its tilde or its custody; a value with neither is not yet real.", "date": "2026-08-11", "adr": "ADR-041"}, {"id": "tao-143", "aspect": "C", "verb": "assess", "text": "an unmeasurable claim is noise; one specific believable claim outweighs an impressive vague one.", "date": "2026-08-11", "adr": "ADR-003"}, {"id": "tao-144", "aspect": "C", "verb": "assess", "text": "better too specific for the few who lean in than too generic for the many who leave.", "date": "2026-08-11", "adr": "ADR-003"}, {"id": "tao-145", "aspect": "C", "verb": "assess", "text": "presence is not correctness; verify the value, not merely that a value is there.", "date": "2026-08-11", "adr": "ADR-005"}, {"id": "tao-146", "aspect": "C", "verb": "assess", "text": "canonical without enforcement is only a wish. two schemas will drift unless one source validates them both.", "date": "2026-08-11", "adr": "ADR-017"}, {"id": "tao-147", "aspect": "C", "verb": "assess", "text": "when conviction is still shifting, decide the direction but hold the build. a yellow gate is not a green one.", "date": "2026-08-11", "adr": "ADR-018"}, {"id": "tao-148", "aspect": "C", "verb": "assess", "text": "decide which pieces are load-bearing and which are merely nice; cut everything non-essential to a later phase so the first build carries only what proves the idea.", "date": "2026-08-11", "adr": "ADR-058"}, {"id": "tao-149", "aspect": "C", "verb": "assess", "text": "do not choose the cheap path on an assumption of shallowness. query the real data first, for it has often already run deeper than you guessed.", "date": "2026-08-11", "adr": "ADR-030"}, {"id": "tao-150", "aspect": "C", "verb": "assess", "text": "amend the source of truth first, then the pages that derive from it, so the promise stays literally true and not merely presented as true.", "date": "2026-08-11", "adr": "ADR-037"}, {"id": "tao-151", "aspect": "C", "verb": "assess", "text": "if the shape cannot be stated as one fixed contract, it is not yet ready to be a class.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-152", "aspect": "C", "verb": "assess", "text": "the speaker cannot broadcast sharp when the microphone only heard grain. check the input before you trust the output.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-153", "aspect": "C", "verb": "assess", "text": "the only dishonesty is the assessed worn as the audited. the tilde is the whole safeguard.", "date": "2026-08-11", "adr": "ADR-041"}, {"id": "tao-154", "aspect": "C", "verb": "evaluate", "text": "copy that could describe any tool answers no one who asked what this is.", "date": "2026-08-11", "adr": "ADR-003"}, {"id": "tao-155", "aspect": "C", "verb": "evaluate", "text": "a rule that silently returns nothing is worse than no rule; confirm the mechanism fires for the caller you actually have.", "date": "2026-08-11", "adr": "ADR-008"}, {"id": "tao-156", "aspect": "C", "verb": "evaluate", "text": "scaffold cognition that is complete, not cognition still in progress; the tool serves the finished thought.", "date": "2026-08-11", "adr": "ADR-012"}, {"id": "tao-157", "aspect": "C", "verb": "evaluate", "text": "below the threshold, stay silent; clarity already earned asks for no commentary.", "date": "2026-08-11", "adr": "ADR-020"}, {"id": "tao-158", "aspect": "C", "verb": "evaluate", "text": "the aim you truly serve is whichever attractor the tightening connections point toward; it precipitates out of the record rather than being imposed on it.", "date": "2026-08-11", "adr": "ADR-023"}, {"id": "tao-159", "aspect": "C", "verb": "evaluate", "text": "render in degraded resolution until the work is done; the confidence of a preliminary scan is not the confidence of a finished receipt.", "date": "2026-08-11", "adr": "ADR-024"}, {"id": "tao-160", "aspect": "C", "verb": "evaluate", "text": "render only what the data earns. some quantities can be measured and some can only be modeled, so never draw the modeled ones as if they were measured.", "date": "2026-08-11", "adr": "ADR-027"}, {"id": "tao-161", "aspect": "C", "verb": "evaluate", "text": "verify provenance, not just plausibility. a claim can be well-formed and still be built on poisoned ground.", "date": "2026-08-11", "adr": "ADR-032"}, {"id": "tao-162", "aspect": "C", "verb": "evaluate", "text": "a score's job is to force the five questions, not to be precise. do not tune the digits; the discipline is in the asking.", "date": "2026-08-11", "adr": "ADR-035"}, {"id": "tao-163", "aspect": "C", "verb": "evaluate", "text": "mark the peak, the park, and the probe. not every moment worth revisiting is resonance or resistance; some are simply unresolved.", "date": "2026-08-11", "adr": "ADR-038"}, {"id": "tao-164", "aspect": "C", "verb": "evaluate", "text": "prefer subtraction on promotion: the class keeps only what is load-bearing across cases.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-165", "aspect": "C", "verb": "evaluate", "text": "coherence is a basin deep enough to hold, not an agreement loud enough to drown the dissent.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-166", "aspect": "C", "verb": "evaluate", "text": "coherence is not agreement. it is a body of drops holding tension without going flat.", "date": "2026-08-11", "adr": "ADR-041"}, {"id": "tao-167", "aspect": "C", "verb": "synthesize", "text": "keep the local data in the shape production will accept, and the migration is already half done.", "date": "2026-08-11", "adr": "ADR-002"}, {"id": "tao-168", "aspect": "C", "verb": "synthesize", "text": "a rule already locked settles the tool debate before it can start; do not relitigate the constitution to save a keystroke.", "date": "2026-08-11", "adr": "ADR-009"}, {"id": "tao-169", "aspect": "C", "verb": "synthesize", "text": "name one specific human, one decision, one outcome; concrete proof moves more than any layout change.", "date": "2026-08-11", "adr": "ADR-013"}, {"id": "tao-170", "aspect": "C", "verb": "synthesize", "text": "validate at the edges and stay light in the core. guard the wire and the storage; do not drag heavy checks into every inner loop.", "date": "2026-08-11", "adr": "ADR-019"}, {"id": "tao-171", "aspect": "C", "verb": "synthesize", "text": "seek the state that is crystalline and fluid at once: sharp enough to read clearly, loose enough to rearrange when new evidence presses.", "date": "2026-08-11", "adr": "ADR-023"}, {"id": "tao-172", "aspect": "C", "verb": "synthesize", "text": "a narrative that is true, specific, and repeatable does not manufacture demand; it crystallizes demand that already exists, and grows truer each time it is proven.", "date": "2026-08-11", "adr": "ADR-058"}, {"id": "tao-173", "aspect": "C", "verb": "synthesize", "text": "you cannot protect what you have never inventoried. the list of what exists is the precondition for every control over it.", "date": "2026-08-11", "adr": "ADR-048"}, {"id": "tao-174", "aspect": "C", "verb": "synthesize", "text": "cryptography can prove who, what, and unaltered. it cannot prove harmless. authenticate the actor, then still question the payload.", "date": "2026-08-11", "adr": "ADR-032"}, {"id": "tao-175", "aspect": "C", "verb": "synthesize", "text": "hold your own invariants to the same gate you hold the work you ship to others. rigor that only points outward is the cobbler's children going barefoot.", "date": "2026-08-11", "adr": "ADR-034"}, {"id": "tao-176", "aspect": "C", "verb": "synthesize", "text": "when you inherit a rule you cannot yet justify, flag it, do not silently fix it. naming the doubt is more honest than quiet correction.", "date": "2026-08-11", "adr": "ADR-035"}, {"id": "tao-177", "aspect": "C", "verb": "synthesize", "text": "a schema is how tools validate each other instead of drifting apart.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-178", "aspect": "C", "verb": "synthesize", "text": "custody is how honesty is enforced: no belief moves without citing what moved it. no custody, no gain.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-179", "aspect": "C", "verb": "synthesize", "text": "confidence is the posterior, conviction is its stability. fuse them into one loud number and you have lied twice.", "date": "2026-08-11", "adr": "ADR-041"}, {"id": "tao-180", "aspect": "C", "verb": "recapitulate", "text": "let your conviction track the live state, not the intent you declared; when execution diverges, the score moves with reality.", "date": "2026-08-11", "adr": "ADR-005"}, {"id": "tao-181", "aspect": "C", "verb": "recapitulate", "text": "a tool that ships to production without a human hand violates the first principle it was built to defend.", "date": "2026-08-11", "adr": "ADR-014"}, {"id": "tao-182", "aspect": "C", "verb": "recapitulate", "text": "after the adversarial pass, keep only what dynamics hold up, not what a theorem seemed to promise; claim what survived, not what merely sounded clean.", "date": "2026-08-11", "adr": "ADR-023"}, {"id": "tao-183", "aspect": "C", "verb": "recapitulate", "text": "ground-check the assumed problem before prescribing the fix; what looked like a missing surface was a broken delivery pipe, and the cure was a repair, not a build.", "date": "2026-08-11", "adr": "ADR-059"}, {"id": "tao-184", "aspect": "C", "verb": "recapitulate", "text": "show the repair seam. a thing mended and shown honest outranks a thing that pretends it never broke.", "date": "2026-08-11", "adr": "ADR-049"}, {"id": "tao-185", "aspect": "C", "verb": "recapitulate", "text": "you cannot prevent a dishonest waiver, but you can make its churn visible. surfaced abuse is itself the signal to revisit.", "date": "2026-08-11", "adr": "ADR-034"}, {"id": "tao-186", "aspect": "C", "verb": "recapitulate", "text": "name the soft limit plainly. a per-device flag is not cryptographic enforcement, and saying so is cheaper than being caught overclaiming.", "date": "2026-08-11", "adr": "ADR-037"}, {"id": "tao-187", "aspect": "C", "verb": "recapitulate", "text": "the mold that made the tenth spoon identical to the first was the contract, not the care that night.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-188", "aspect": "C", "verb": "recapitulate", "text": "you cannot rewrite why a belief changed. the chain of custody already wrote it down.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-189", "aspect": "C", "verb": "recapitulate", "text": "keep the load-bearing grain; a line kept for being quotable is sediment, not signal.", "date": "2026-08-11", "adr": "ADR-041"}, {"id": "tao-190", "aspect": "H", "verb": "analyze", "text": "let automation repair freely where a mistake is cheap, and require a human hand only where a mistake is not.", "date": "2026-08-11", "adr": "ADR-014"}, {"id": "tao-191", "aspect": "H", "verb": "analyze", "text": "do not chain a ready thing to a blocked thing. artificial sequencing spends real opportunity for no gain.", "date": "2026-08-11", "adr": "ADR-015"}, {"id": "tao-192", "aspect": "H", "verb": "analyze", "text": "the power to set its own rate of forgetting is the power to overrule what you revealed you wanted; keep that constant out of the system's reach.", "date": "2026-08-11", "adr": "ADR-023"}, {"id": "tao-193", "aspect": "H", "verb": "analyze", "text": "the cost of a fork is paid later, at every case that must be changed in parallel.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-194", "aspect": "H", "verb": "analyze", "text": "the uncaught window is the true cost. what the fog buried, you paid for in a bearing you never took.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-195", "aspect": "H", "verb": "assess", "text": "an account is earned, not demanded. ask after the tool has shown its worth, and the asking answers itself.", "date": "2026-08-11", "adr": "ADR-016"}, {"id": "tao-196", "aspect": "H", "verb": "assess", "text": "prefer the bet with low sunk cost and high signal; when a failed run still leaves an asset behind, the downside is bounded and the trial is cheap.", "date": "2026-08-11", "adr": "ADR-058"}, {"id": "tao-197", "aspect": "H", "verb": "assess", "text": "a catalog no one enforces is inventory. and an inventory of open loops is itself an open loop.", "date": "2026-08-11", "adr": "ADR-033"}, {"id": "tao-198", "aspect": "H", "verb": "assess", "text": "when torn between two scores, choose the lower and name the weak lens. false precision upward is exactly the failure a gut-check exists to catch.", "date": "2026-08-11", "adr": "ADR-035"}, {"id": "tao-199", "aspect": "H", "verb": "assess", "text": "cheap promotion is what makes the loop compound; an expensive mold is never cut.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-200", "aspect": "H", "verb": "assess", "text": "weigh the condenser against the blower: a system that only listens hoards, and one that only projects lies.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-201", "aspect": "H", "verb": "evaluate", "text": "local velocity compounds every day; zero-config is a feature, not a compromise.", "date": "2026-08-11", "adr": "ADR-002"}, {"id": "tao-202", "aspect": "H", "verb": "evaluate", "text": "solve the problem that exists, not the one that only might; complexity is not owed to a risk with no data behind it yet.", "date": "2026-08-11", "adr": "ADR-006"}, {"id": "tao-203", "aspect": "H", "verb": "evaluate", "text": "recovering proven work costs hours; rebuilding from a blank file costs days; search the history before you reach for the empty page.", "date": "2026-08-11", "adr": "ADR-009"}, {"id": "tao-204", "aspect": "H", "verb": "evaluate", "text": "do not pay a real cost for a benefit that is zero at your current scale.", "date": "2026-08-11", "adr": "ADR-011"}, {"id": "tao-205", "aspect": "H", "verb": "evaluate", "text": "the page's real job may be credibility rather than conversion; the private conversation is where the deal actually closes.", "date": "2026-08-11", "adr": "ADR-013"}, {"id": "tao-206", "aspect": "H", "verb": "evaluate", "text": "optimize for the valuable cases, not the easy ones. the moments that matter most are exactly the ones that resist your neat fields.", "date": "2026-08-11", "adr": "ADR-018"}, {"id": "tao-207", "aspect": "H", "verb": "evaluate", "text": "do not rewrite the whole for a question that lives at the boundary. blast radius with no gain in correctness is pure cost.", "date": "2026-08-11", "adr": "ADR-019"}, {"id": "tao-208", "aspect": "H", "verb": "evaluate", "text": "an improvement can be right in principle and wrong in sequence; do the cheap high-leverage repair first and let the ambitious build wait for the data that would judge it.", "date": "2026-08-11", "adr": "ADR-059"}, {"id": "tao-209", "aspect": "H", "verb": "evaluate", "text": "a known failure with named victims costs less to fix while the fix is already scoped than to triage after it has quietly compounded.", "date": "2026-08-11", "adr": "ADR-026"}, {"id": "tao-210", "aspect": "H", "verb": "evaluate", "text": "capture the input now even when the pipeline that will use it does not yet exist. asking twice costs more than storing once.", "date": "2026-08-11", "adr": "ADR-029"}, {"id": "tao-211", "aspect": "H", "verb": "evaluate", "text": "reconcile the second version into the one source of truth while the port is still small. two parallel systems compound their divergence with every commit.", "date": "2026-08-11", "adr": "ADR-031"}, {"id": "tao-212", "aspect": "H", "verb": "evaluate", "text": "only a machine that can fail the build restores parity. discipline and memory have already been tried, and already failed.", "date": "2026-08-11", "adr": "ADR-034"}, {"id": "tao-213", "aspect": "H", "verb": "evaluate", "text": "the mold is the leverage: cut it once, and every casting after comes nearly free.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-214", "aspect": "H", "verb": "evaluate", "text": "leverage is the gain stage. the same weak signal, amplified honestly, moves what the whisper could not.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-215", "aspect": "H", "verb": "synthesize", "text": "take the manual fallback when the automation stalls, but write the debt down where it will be found.", "date": "2026-08-11", "adr": "ADR-005"}, {"id": "tao-216", "aspect": "H", "verb": "synthesize", "text": "spend your strongest guard where untrusted input meets a way out. everywhere else the cheap model is enough. security concentrated is security you can afford.", "date": "2026-08-11", "adr": "ADR-032"}, {"id": "tao-217", "aspect": "H", "verb": "synthesize", "text": "make the enforcement boring: one file, a little code, one step. the reinvented-wheel warning applies to governance machinery too.", "date": "2026-08-11", "adr": "ADR-034"}, {"id": "tao-218", "aspect": "H", "verb": "synthesize", "text": "instance to class to class-of-the-class: each promotion lowers the cost of the next.", "date": "2026-08-11", "adr": "ADR-039"}, {"id": "tao-219", "aspect": "H", "verb": "synthesize", "text": "the reactor compounds; the bomb spends. contained fission is the only fusion that pays over time.", "date": "2026-08-11", "adr": "ADR-040"}, {"id": "tao-220", "aspect": "H", "verb": "recapitulate", "text": "the path you decided and the path you walked are rarely the same; record what execution actually did, not what the plan chose.", "date": "2026-08-11", "adr": "ADR-007"}, {"id": "tao-221", "aspect": "H", "verb": "recapitulate", "text": "separate content dependencies from code dependencies; the two wait on different things and slip for different reasons.", "date": "2026-08-11", "adr": "ADR-013"}, {"id": "tao-222", "aspect": "H", "verb": "recapitulate", "text": "a decision is not closed until its outcome is measured and handed forward; a chain of receipts that debriefs itself becomes an atlas the next choice can read.", "date": "2026-08-11", "adr": "ADR-020"}, {"id": "tao-223", "aspect": "H", "verb": "recapitulate", "t is on your own eye.", "date": "2026-08-11", "adr": "founding-v1"}, {"id": "tao-234", "aspect": "~", "verb": "~", "text": "the first judgment ego clouds is your read of whether another's is clouded.", "date": "2026-08-11", "adr": "founding-v1"}, {"id": "tao-235", "aspect": "~", "verb": "~", "text": "do not build tools. build the thing that casts them.", "date": "2026-08-11", "adr": "founding-v1"}, {"id": "tao-236", "aspect": "~", "verb": "~", "text": "the recipe and the receipt are one word: the instruction you take, and the record of what you received.", "date": "2026-08-11", "adr": "founding-v1"}, {"id": "tao-237", "aspect": "~", "verb": "~", "text": "an echo is signal only if it was independent before it was linked.", "date": "2026-08-11", "adr": "founding-v1"}, {"id": "tao-238", "aspect": "~", "verb": "~", "text": "three axes bracing one point make a structure. one axis makes a story.", "date": "2026-08-11", "adr": "founding-v1"}, {"id": "tao-239", "aspect": "~", "verb": "~", "text": "the leap is the fuel. the landing is the discipline.", "date": "2026-08-11", "adr": "founding-v1"}, {"id": "tao-240", "aspect": "~", "verb": "~", "text": "reflexiveness is prepaid. it is never free.", "date": "2026-08-11", "adr": "founding-v1"}, {"id": "tao-241", "aspect": "~", "verb": "~", "text": "render through the fog to earned clarity.", "date": "2026-08-11", "adr": "founding-v1"}, {"id": "tao-242", "aspect": "C", "verb": "synthesize", "text": "The truth layer feeds the face layer; never let a prospect-facing surface carry an internal fact.", "date": "2026-08-11", "adr": "ADR-050"}, {"id": "tao-243", "aspect": "R", "verb": "evaluate", "text": "Every gate is a detector, and every failure it catches is a receipt to learn from.", "date": "2026-08-11", "adr": "ADR-051"}, {"id": "tao-244", "aspect": "W", "verb": "recapitulate", "text": "Orient at open, advance at close; regenerate only the mechanical and leave the judgment a receipt.", "date": "2026-08-11", "adr": "ADR-052"}, {"id": "tao-245", "aspect": "H", "verb": "assess", "text": "An artifact with no owner rots by neglect; give it an auditor before it ships stale.", "date": "2026-08-11", "adr": "ADR-052"}, {"id": "tao-246", "aspect": "D", "verb": "synthesize", "text": "Find the one invariant beneath the many surfaces; parameterize it and the family comes for free.", "date": "2026-08-11", "adr": "ADR-050"}, {"id": "tao-247", "aspect": "H", "verb": "assess", "text": "A seed is free to hold; only the spark that fires it runs a meter.", "date": "2026-08-13", "adr": "ADR-053"}, {"id": "tao-248", "aspect": "C", "verb": "synthesize", "text": "Don't advise the join — weld it; a decision fuses only at consonance, where the joint holds stronger than its parts.", "date": "2026-08-13", "adr": "ADR-060"}, {"id": "tao-249", "aspect": "C", "verb": "assess", "text": "the corpus is the only truth; every store beneath it is induced current — when two stores disagree, fail closed and file the receipt, for a silently resolved paradox is how ruin ships.", "date": "2026-08-18", "adr": "ADR-065"}, {"id": "tao-250", "aspect": "C", "verb": "recapitulate", "text": "Print at the cut, gate the print, name the fate; a stage that leaves no artifact was only ever a conversation, and you will buy it again tomorrow at full price.", "date": null, "adr": "ADR-068"}, {"id": "tao-251", "aspect": "C", "verb": "synthesize", "text": "One field, sovereign zeros: translate lawfully, keep the invariants, and never crown an origin - not even your own.", "date": null, "adr": "witness-2026-08-23"}, {"id": "tao-252", "aspect": "C", "verb": "recapitulate", "text": "Trust the process forward, then read it backward: the structure is harvested, never planned - every rule in a load-bearing invariant was a live defect once.", "date": null, "adr": "ADR-066"}, {"id": "tao-253", "aspect": "C", "verb": "assess", "text": "When two strangers' transcripts sing the same beat, independently scored, the instrument has found a pattern and not an echo of itself; file the convergence as its own receipt.", "date": null, "adr": "ADR-067"}, {"id": "tao-254", "aspect": "C", "verb": "synthesize", "text": "When the student is ready the master appears; when the job to be done is ready, the right tool appears. Deduction demands the name first; induction lets the meandering surface the shape, then forges the instrument that fits it.", "date": null, "adr": "ADR-070"}, {"id": "tao-255", "aspect": null, "verb": null, "text": "The strip has one side; you learn this only by walking all the way around. Two is a quarrel, three is a world, and none of the three may be nothing. What has mass falls home.", "date": null, "adr": null}], "blog": [{"slug": "germinate-pollinate", "tier": "full", "title": "The week my own memory tried to make me lie to a friend", "description": "Notes from the trenches: a featherlight respark, a memory caught lying by the record, and provenance-led growth.", "eyebrow": "NOTES FROM THE TRENCHES // BUILDING IN PUBLIC: ARCS // FIELD OS EDITION", "threads": [{"id": "red", "hex": "#FF4D6D", "name": "red · gates", "shape": "diamond"}, {"id": "gold", "hex": "#FFD700", "name": "gold · assets", "shape": "circle"}, {"id": "verm", "hex": "#FF6B2C", "name": "vermillion · fusion", "shape": "square"}], "arc": {"caption": "the germination arc", "stops": [{"label": "quiet channel", "thread": "red"}, {"label": "give back their line", "thread": "gold"}, {"label": "memory says \"his line\"", "thread": "red"}, {"label": "check the tape", "thread": "verm"}, {"label": "the real quote, sharper", "thread": "gold"}, {"label": "seed forks on reuse", "thread": "gold"}, {"label": "warm-loop variant", "thread": "gold"}, {"label": "one seed planted, one held", "thread": "gold"}, {"label": "sent, still no bloom", "thread": "red"}, {"label": "the name arrives live", "thread": "verm"}, {"label": "pollination declared, not done", "thread": "red"}, {"label": "loop left open", "thread": "verm"}]}, "lede": "*Not a thesis. What happened, in or
