ds": [{"id": "red", "hex": "#FF4D6D", "name": "red · gates", "shape": "diamond"}, {"id": "gold", "hex": "#FFD700", "name": "gold · receipts", "shape": "circle"}, {"id": "verm", "hex": "#FF6B2C", "name": "vermillion · pathogen", "shape": "square"}], "arc": {"caption": "one night, one braid", "stops": [{"label": "one artifact, one complaint", "thread": "gold"}, {"label": "the wrap bug, again", "thread": "red"}, {"label": "fix the class, arm the gate", "thread": "red"}, {"label": "the gate that never ran", "thread": "red"}, {"label": "my words, their mouth", "thread": "verm"}, {"label": "four infections, one census", "thread": "verm"}, {"label": "the sixth coordinate, ratified", "thread": "gold"}, {"label": "first catch: its own golden", "thread": "verm"}, {"label": "exhaust becomes fuel", "thread": "gold"}]}, "lede": "*Last time, my own memory tried to put my words in a friend's mouth, and the tape caught it. This is the sequel: the night that failure got a name, a seat in canon, and a machine. Three threads again. Red is the gates: linters, hooks, the checks that block a commit. Gold is the receipts: what got witnessed, ratified, and banked. Vermillion is the pathogen i…", "file": "_ARTIFACTS/blog/stories/sixth-coordinate.story.md"}, {"slug": "take-home-trap", "tier": "full", "title": null, "description": null, "eyebrow": "NOTES FROM THE TRENCHES // when the take-home is the trap", "threads": [{"id": "red", "hex": "#FF4D6D", "name": "red · the exploit", "shape": "diamond"}, {"id": "cyan", "hex": "#00F0FF", "name": "cyan · the echo", "shape": "circle"}, {"id": "green", "hex": "#00FF9D", "name": "green · the ship", "shape": "square"}], "arc": {"caption": "the arc of one week in the trenches", "stops": [{"label": "a recruiter's take-home", "thread": "red"}, {"label": "no one was home", "thread": "red"}, {"label": "is any of this ours?", "thread": "cyan"}, {"label": "the opposite-sign echo", "thread": "cyan"}, {"label": "ship the control", "thread": "green"}, {"label": "the eval said no edge", "thread": "green"}]}, "lede": "*A North Korean crew ships malware disguised as a job interview. I know, because I took the call. We wrote the defensive dossier, then asked the question that actually mattered: is any of this ours? Three threads run through what happened next. Red is the exploit, the recruiter's repo that runs the instant you open it, and the tell that gave it away before…", "file": "_ARTIFACTS/blog/stories/take-home-trap.story.md"}], "covenant": {"trust": {"version": "1.3", "date": "2026-07-19", "sections": [{"h": "What ARCS is", "body": "ARCS is a reasoning instrument. It takes the decision you're carrying — the real fork, not the noise around it — and makes its shape visible. It stress-tests the question, surfaces what you might be missing, and produces a single clear direction graded by honest confidence.\n\nARCS does not make decisions. You do. ARCS never compresses, replaces, or overrules your judgment — it scaffolds and sharpens it. This is not a design aspiration; it is a hard constitutional rule of the system (ROM Primitive 1: NOTOMATION).\n\n---"}, {"h": "What you're entering into", "body": "Using ARCS is not a subscription to a black box. It is a relationship with a transparent instrument. This document defines what that relationship is, in plain terms.\n\n---"}, {"h": "1. What is stored, and what isn't", "body": "**Your question (compass input):**\nProcessed in real time and used to generate your result. If you are not signed in, it is not stored beyond your session — it exists only long enough to produce the receipt.\n\n**Your receipt:**\nIf you are signed in, your decision receipt is stored in your account and accessible via your history. It is yours. If you are not signed in, the receipt is generated and displayed in your browser only — nothing is written server-side. If you want to keep an anonymous bearing, you can sign in and save it; the write happens only after you authenticate.\n\n**Sharing an anonymous bearing:** If you create a one-time share link for an anonymous bearing, the bearing is encoded inside the link itself — in the URL fragment, which browsers never transmit to a server. Nothing is written server-side; the content travels only in the link you send. The link renders once on the recipient's device (a per-device flag then flips it to a sign-in page), and because the content rides in the link, anyone you send it to can read it — treat it like any message. See ADR-037.\n\n> **Disclosure (2026-07-13 — repair seam, kept visible on purpose):** From launch until\n> 2026-07-13, a defect stored anonymous receipts server-side, contrary to this section —\n> 48 such receipts existed when it was found. The write path was fixed the same day\n> (commit `8b486e8`; the repository is public, so this is verifiable, not just claimed).\n> The pre-fix receipts were deliberately retained rather than deleted: receipt links are\n> made to be shared, and some are referenced in the wild — deleting them would break\n> those references. They carry no account identity. If you ran an anonymous session\n> before 2026-07-13: signing in from the same browser claims your receipts automatically,\n> and a deletion request (via the inquiry link on arcs.care) will be honored.\n\n**Your debrief:**\nIf you log an outcome (how the decision went), that is stored in your account linked to the receipt. This data is used to improve ARCS's ability to read terrain accurately over time — specifically, to validate whether the system's confidence grades correspond to real outcomes. It is never shared or sold.\n\n**System logs:**\nStandard infrastructure logs (request metadata, error traces) are retained for debugging. They do not contain your decision content.\n\n---"}, {"h": "2. Does ARCS train on your input?", "body": "**No.**\n\nARCS uses the Anthropic API (Claude) to process your question. Anthropic's API terms prohibit using API inputs to train foundation models without explicit consent. Your compass inputs do not train Claude or any other model.\n\nARCS's own modeling work (operator scoring, NCI calibration) uses aggregate, anonymized outcome data — not your raw decision content.\n\n---"}, {"h": "3. Export and delete", "body": "**Export:** Receipts and briefs are viewable and shareable via direct link. Full data export (all receipts, outcomes, and session history in structured format) is on the near-term roadmap and not yet shipped.\n\n**Delete:** You can request deletion of your account and all associated data by emailing [contact]. Account deletion removes all receipts, outcomes, and personal data from the production database within 30 days. This is a one-way gate — deleted data cannot be recovered.\n\n*These are commitments, not aspirations. When export ships, this document will be updated with the exact path.*\n\n---"}, {"h": "4. Can you run ARCS yourself?", "body": "**Yes — partially, today. More fully, soon.**\n\nThe arcs-v9 repository is public: [github.com/flashesofbrilliance/arcs-v9](https://github.com/flashesofbrilliance/arcs-v9). The full application stack (Next.js, Prisma, the L0–L5 pipeline, operator logic) is inspectable and forkable. You can read exactly how your question is processed.\n\nRunning it locally requires an Anthropic API key, a Supabase instance, and environment setup — there is no one-click local build yet. A packaged local-first version is a stated product direction. It is not yet shipped.\n\nThe honest answer is: today, using arcs.care means trusting the hosted infrastructure. The code is open so you can verify what it does. The roadmap points toward self-hostable. If that gap is a dealbreaker right now, that's a fair call — and the repository is there if you want to run your own version in the meantime.\n\n---"}, {"h": "5. What ARCS is and isn't designed for", "body": "**Designed for:**\n- Decisions with a real fork — where two or more paths are genuinely available and the choice has material consequences\n- High-stakes clarity under time pressure — when you need structure, not more information\n- Stress-testing your own instinct — when you suspect you might be thinking about the problem the wrong way\n- Founder and operator decisions: capital, team, strategy, timing, partnerships, exits\n- Personal high-stakes decisions where you'd normally pay for an advisor or trusted thinking partner\n\n**Not designed for:**\n- Decisions that are already made — ARCS is not a rationalization engine\n- Pure information lookup — use a search engine\n- Decisions requiring licensed professional advice (legal, medical, financial) — ARCS can help you think, not practice law or medicine\n- Decisions with no real fork — if there's only one live option, ARCS will surface that, but it won't invent alternatives\n- Passive consumption — ARCS requires you to name the real decision; vague inputs produce vague outputs\n\n---"}, {"h": "6. How much confidence should you place in the output?", "body": "**Honest answer: calibrated skepticism, not deference.**\n\nARCS produces a direction and a conviction grade. The conviction grade is the important part — it tells you how much weight to put on the direction.\n\nWhat the grades mean in plain terms:\n\n| Grade | What it means | How to use it |\n|---|---|---|\n| High conviction (GREEN) | The terrain supports a clear direction; the case for it is significantly stronger than the case against | Move. The system is confident and the Loki test didn't break it. |\n| Medium conviction (YELLOW) | Real signal, genuine uncertainty — both directions have live cases | Use as one strong input, not a final answer. Cross-check with someone who knows the terrain. |\n| Low conviction / contested (SCRATCH/FORK) | The question doesn't have a dominant answer yet — the fork is real | Don't decide yet. ARCS is surfacing the shape of the uncertainty, not dodging the question. |\n| PARADOX | The options are genuinely non-separable right now | The decision is premature. Something upstream needs to resolve first. |\n\n**What ARCS cannot do:** It cannot know things you haven't told it. It doesn't have context about your relationships, your risk tolerance, your financial position, or the hundred texture details that live in your head. The output is only as good as the input — and even a perfect input produces a direction, not a guarantee.\n\n**The NCI score (conviction index):** This is a numerical grade of the decision's coherence and the confidence level the pipeline reached. It is currently calibrated against a proxy signal (stakes + horizon) rather than validated outcome data. Treat it as a soft signal — directionally useful, not mathematically precise. We are building the outcome dataset to validate and improve it. When that validation is complete, this section will be updated.\n\n---"}, {"h": "7. Your autonomy is the point", "body": "ARCS is built on a single constitutional rule: the system may only scaffold and sequence your cognition. It may never compress it, replace it, or overrule it.\n\nThis means:\n- ARCS will surface the strongest case against your instinct (Loki test) — not to talk you out of it, but so you've stress-tested it yourself\n- ARCS will tell you when the terrain is unclear rather than manufacturing false confidence\n- ARCS will produce one direction, not a menu of options to defer to — because the point is earned clarity, not paralysis by analysis\n- The receipt is yours — it documents the reasoning, not just the conclusion, so you can inspect and disagree with it\n\nThe goal is not that you trust ARCS. The goal is that you trust your own judgment more, because you've run it through a rigorous instrument.\n\n---"}, {"h": "8. How ARCS catches you at the fork", "body": "**Honest answer: it doesn't, yet — you have to recognize it and bring it.**\n\n§5 above defines what kinds of decisions ARCS is designed for. It does not address a different question: how do you know you're standing at one of those forks *before* you ever open the compass? Today, the answer is that ARCS does not proactively detect this. There is no background system watching your calendar, your messages, or your behavior for a decision forming and tapping you on the shoulder. You have to notice the fork yourself and bring it to the instrument.\n\nThis is a real limitation, not a hidden one. Two things are true at once:\n\n- **It's partly a deliberate boundary, not just a gap.** A system that silently watches your data for \"decision-shaped moments\" and surfaces itself uninvited is closer to the black box ARCS is explicitly trying not to be (see §7). Discovery without consent is its own trust problem — solving \"how do you find the fork\" by adding ambient surveillance would trade one trust gap for a worse one.\n- **It's also genuinely unbuilt, not fully resolved by that boundary.** A consent-based version of fork-detection — something that helps you notice a decision is forming from signals you've explicitly opted into, rather than ambient monitoring — is a real, not-yet-built direction (`Kairos detection`, tracked as backlog in this repo's `AGENTS.md`, gated behind having enough real outcome data to calibrate it responsibly). It is not shipped. This document will be updated when that changes.\n\n**What exists today instead:** product copy is the current, honest mechanism — surfaces like the homepage's \"name the real fork\" framing exist to prompt *you* to recognize the moment, not to detect it for you. That's a discovery aid, not a disclosure claim, and it lives in product copy rather than this contract for that reason: it's a UX nudge, not a guarantee about what the system does on your behalf.\n\n---"}]}, "privacy": ["ARCS advocates for information access as a right. That obligation runs both ways. This policy tells you exactly what we collect, how long we keep it, who can see it, and what we will never do — receipted, not promised.", "Unconditional. No carve-outs. No exceptions for business reasons.", "Conditional. You control the trigger. We state the condition clearly.", "Scout's honor. Enforced by architecture and covenant, not just policy.", "— not yet built. You can delete, but you can't yet download your receipt history in a portable format. This is on the roadmap. Until it ships, contact us directly if you need your data.", "— you can't yet see a log of every time your data was accessed. We log it internally; the user-facing view isn't built. On the roadmap.", "— if a receipt was used in the journalism pipeline and you later want it removed, the workflow for that isn't formalized yet. Contact us directly.", "as a journalism engine. Content is produced from ARCS's own analysis — not from your sessions. Your compass queries are never published without an explicit, session-specific opt-in — not buried in account settings, not assumed from prior consent. If we ever build a feature where you can voluntarily contribute an anonymized receipt to the journalism corpus, that will be a separate, prominent, reversible consent step.", "Email to request full account deletion. 30-day window, one-way gate.", "If something here conflicts with what you observe in the source code, flag it. We will investigate and correct the discrepancy or the code.", "No dark patterns, no retention loops, no data held to encourage you to stay."], "terms": ["Most terms of service are written to protect the company from you. These are written as a mutual agreement — what ARCS commits to, what you commit to, and what happens when either side breaks the covenant.", "Loyalty is earned through demonstrated reciprocity — not demanded through terms.", "If ARCS breaks this covenant, you are released from it. If you break it, we may terminate your access. Either side can walk away.", "ARCS is a decision navigation instrument. You bring a real question; ARCS produces a directional bearing, a conviction grade, and a set of tributaries — adjacent questions worth asking.", "The bearing is an input to your judgment, not a replacement for it. Using ARCS means understanding this distinction.", "Decisions with irreversible consequences should be validated against domain expertise, not just the compass."], "trust_page": ["Before you run the compass — what you're agreeing to, what we store, and what we won't do. Plain language. No buried terms.", "Eight commitments. Read them once. They don't change without notice.", "Your question and the bearing live only in your browser tab and disappear when you close it. Want to keep one? Sign in and save it — the write happens only after you authenticate. If you sign in, your receipts are stored so you can return to them. System logs don't contain your decision content — only request metadata (timestamps, response codes).", "if you create a one-time share link, the bearing is encoded", "(in the URL fragment, which browsers never send to a server) — still nothing on ours. The link opens once on the recipient's device, then becomes a sign-in page. Because the content rides in the link, treat it like any message you send: anyone you give it to can read it.", "until this date, a defect stored anonymous receipts server-side, contrary to this section — 48 existed when found. Fixed the same day (commit 8b486e8; the repo is public, so this is verifiable, not just claimed). The pre-fix receipts were kept rather than deleted because shared receipt links reference them; they carry no account identity. Sign in from the same browser to claim yours, or request deletion via the inqu…", "ARCS runs through the Anthropic API. Per Anthropic's API terms, inputs are not used to train models. Your questions are not data collection — they're compass queries.", "on the roadmap, not yet live. If you need your data before export is built, reach out directly.", "github.com/flashesofbrilliance/arcs-v9", ". Local-first mode is on the roadmap. If you want to run it without any data touching our infrastructure, that path will exist.", "NCI (Navigational Conviction Index) is a proxy, not ground truth. It reflects pattern coherence, not outcome probability. Here's how to read the grades:", "The governing rule of ARCS is called NOTOMATION: scaffold and sequence cognition. Never compress, replace, or overrule it.", "You might expect the system to detect when you're about to override a clear signal. Here's what's honest:", "Right now, ARCS surfaces the terrain. You bring the awareness of where you are in the decision arc."]}, "covenant_adrs": ["ADR-032", "ADR-037", "ADR-044", "ADR-048", "ADR-049", "ADR-050", "ADR-055", "ADR-072"], "apex": "# Apex Spine — The Möbius Induction Circuit\n\n> An associative index, not a flat record. *Shared documentation is not shared understanding;\n> only associative documentation approaches it.* This page carries the **relations between** the\n> night's artifacts — the understanding lives in the links, not the prose. Every terminal is\n> independently dated and attestable, which is what keeps it a self-portrait and not a story.\n\n**Thesis (ADR-071):** Receipt and Induction are not two sides of a ribbon; they are two\ntraversals of **one non-orientable surface** — which is why the ARCS mark is a Möbius. Its\nminimum stable cross-section is a **triad, none-may-null** (flagged verbatim in the Book of ARCS,\nNov 2025). It is held at the bottom of a **potential well** by the corpus's own accumulated mass.\nMöbius = topology · triad = invariant · gravity = dynamics. One object.\n\n---\n\n## The induction circuit, named across 28 years\n\nThe Möbius is a wiring diagram of the author, named terminal-by-terminal in the correct physics\norder (Faraday: `EMF = −dΦ/dt` — a changing flux *induces* a current; abduction *is* induction).\n\n| ~year | self-naming | terminal | physics |\n|---|---|---|---|\n| ~1998–2006 | *the flux* (music artist name) | field / source | the changing Φ |\n| 2010 | *flashesofbrilliance* (GitHub org) | the spark | induced EMF arcing the gap; arc-**weld** flash |\n| 2021 | *\"ball of livewire energy\"* (Gareth Kay rec) | current, witnessed | current in the wire |\n| Nov 2025 | *Book of ARCS* (Book III) | lattice / structure | \"two is unstable, three is the minimum\" — none-may-null |\n| 2026 | *ARCS* + the Möbius mark | the loop | the lossless non-orientable conductor |\n\n**Self-exciting close:** the terminal phase is the **superionic nucleus** (rigid lattice + fluid\ncharge, one volume, conductive *because* fused). In planetary cores the superionic dynamo\n*generates* the field — so the end terminal regenerates the source. A Möbius in time as well as\nspace: flux → current → spark → loop → superionic dynamo → flux.\n\n**Torque and drive:** posterior reasoning → dynamo → **drive** (the current, from the settled\npast); anterior reasoning → collider → **torque** (the half-twist, from the forward abductive\ncollision). They meet at a **spline knot**, resolved by the one *shipped* operator here:\n**Operator21** (`operators/arcs_operator21.py`, P1 determinism PASS 2026-08-28).\n\n---\n\n## The spine (witness → ADR → DEWY → wisdom → Tao)\n\n| Stage | Artifact |\n|---|---|\n| Witness | `_STATE/witness/2026-08-28.jsonl` — 23:11 (gravity well) · 23:16 (triad + Möbius) · 23:37 (graduation-gate-held) |\n| ADR | [`ADR-070`](../_DECISIONS/ADR-070-arcs-two-surface-receipt-and-induction.md) (two surfaces) · [`ADR-071`](../_DECISIONS/ADR-071-mobius-one-surface-triune-invariant-gravity-well.md) (Möbius/triune/gravity) · `ADR-072` (engine-sovereignty, sibling branch) |\n| DEWY | `_STATE/2026-08-28-session-decisions.dewy.json` — two-surface · Möbius/triune/gravity · ROM-graduation-gate-held |\n| Wisdom | memory `arcs-mobius-triune-gravity-invariant` · `rom-graduation-earn-through-gate-never-decree` · `engine-sovereignty-gradient-receipts-freehold` |\n| Tao | `_CANON/tao-proverbs.jsonl` — tao-254 (two surfaces) · tao-255 (Möbius/triad/gravity) |\n| Silkscreen | `_ARTIFACTS/session-visuals/tao-255-induction-circuit-silkscreen.html` |\n\n---\n\n## Honesty air-gaps (the spine being its own gate)\n\n- **Dynamo/collider imagery = honest identity, NOT a mechanism claim.** \"Vector Collision Engine\"\n  was composted once (`_PATTERNS/2026-07-13-dual-audit-reconciliation.md`, \"metaphor posing as\n  tech\"); the real, *gated* engine is the Orthogonal Echo Detector (`operators/arcs_inchworm_echo.py`,\n  RC-OPS-001). Keep the nod wired to the real detector; never let \"VCE v2\" travel as a spec.\n- **The Orthogonal Echo Detector is NOT yet ROM.** Graduation gated; a graduation-initiation\n  receipt is the honest next step. A primitive *becomes* ROM by surviving its gate, never by\n  being decreed. (memory `rom-graduation-earn-through-gate-never-decree`.)\n- **Bias ≠ source-blindness.** Tonight's foreshadow echoes are bias-free (a kill-gauntlet ran,\n  VCE composted, gate held) but not source-blind (one searcher, one intent). Blind count ≈ 1\n  (2026-07-13 dual-audit).\n- **Cross-substrate corroboration (2026-08-28):** the ARCS prototype in **Perplexity**, handed\n  the Hyperstition Atlas, independently produced the same honest-gate discipline\n  (`_STATE/2026-08-28-arcs-thread-serialization.md`) — confirming the gravity-well/engine-\n  sovereignty claim; a *candidate* (not clean-blind) echo for the detector's gate.\n\n## Tao (tao-255)\n\n> The strip has one side; you learn this only by walking all the way around. Two is a quarrel,\n> three is a world, and none of the three may be nothing. What has mass falls home.\n", "flora": {"kingdoms": [{"n": "III", "name": "Flora", "organisms": [{"binomial": "Semen atomicum", "name": "the Seed"}, {"binomial": "Receptum dewyi", "name": "the Receipt"}, {"binomial": "Quercus decisionis", "name": "the ADR (heartwood)"}, {"binomial": "Sequoia canonica", "name": "Canon (old growth)"}, {"binomial": "Pollen taoense", "name": "the Proverb"}, {"binomial": "Lichen durabilis", "name": "the Pattern"}, {"binomial": "Flos artificialis", "name": "the Artifact (bloom)"}, {"binomial": "Folium traditum", "name": "the Handoff (leaf litter)"}]}, {"n": "IV", "name": "Fauna", "organisms": [{"binomial": "Homo navigans", "name": "the Operator (keystone species)"}, {"binomial": "Pyxis quaerens", "name": "the Compass (the parser)"}, {"binomial": "Loki adversarius", "name": "the Trickster (beneficial parasite)"}, {"binomial": "Geometrida aurea", "name": "the Golden Inchworm (ROM Primitive 4)"}, {"binomial": "Auris orthogonalis", "name": "the Orthogonal Echo Detector (ROM Primitive 5)"}, {"binomial": "Ouroboros falsificans", "name": "recursive self-falsification (ADR-062)"}]}], "file": "_CANON/flora-and-fauna.md"}, "dewy": [{"date": "2026-08-10", "id": "2026-08-10-temporal-provenance-gate", "surface": "meta / forge", "q": "How do we stop ARCS stating aspirational capabilities as present fact?", "D": "Capability claims carry temporal placement (NOW/NEXT/ASPIRATIONAL); fiction = not-NOW; enforce by a gate that refuses to write unhedged aspiration.", "E": "scripts/forge_counterpart.py::temporal_provenance + run_gates; all counterpart surfaces.", "W": "DURABLE (extends ADR-039). Revisit when ARCS ships a genuinely model-agnostic runtime.", "Y": "GREEN", "file": "_STATE/2026-08-10-session-decisions.dewy.json"}, {"date": "2026-08-10", "id": "2026-08-10-redact-dossier-two-link-warm", "surface": "yuri one-door", "q": "Given the full LinkedIn thread, does the artifact family fit Yuri's actual vibe?", "D": "Refit to a warm, bite-size, no-agenda reader who bounces off abstraction: redact the profile (dossier) from the send, collapse the menu to two (before/after + diamond), warm the entry, and open by telling him what it is in his terms (a pre-meeting brief, closed and scored).", "E": "yuri.html + facesnav; profile page kept live but unlinked.", "W": "This-send tactical (per-recipient), grounded in his verbatim 'high level and theoretical / how do I use this'.", "Y": "GREEN", "file": "_STATE/2026-08-10-session-decisions.dewy.json"}, {"date": "2026-08-10", "id": "2026-08-09-diamond-earned-fidelity", "surface": "yuri-diamond (--surface diamond)", "q": "Would a full-manifold diamond-cut recoil of the call be valuable, or an overclaim?", "D": "Ship the diamond cut as EARNED-fidelity, not maximal: 2 defensible dimensions (Sync + self-scored Conviction), verbatim-anchored, the gap-between-lines is the read, resolution said out loud, fence intact; surface it for the builder (the closed-loop 'after' he never built), not the front door for everyone.", "E": "render_diamond in forge_counterpart.py; yuri-diamond.arcs.care.", "W": "DURABLE design principle.", "Y": "GREEN", "file": "_STATE/2026-08-10-session-decisions.dewy.json"}, {"date": "2026-08-10", "id": "2026-08-09-persona-facet-gauntlet", "surface": "meta / QA method", "q": "Before sending a counterpart artifact, how do we catch what the register/lens gauntlet misses?", "D": "Run a 6-facet counterpart-persona simulation (builder/practitioner/skeptic/connector/hedge/bite-size) + an adversarial verifier that rejects over-flags, grounded in the primary transcript + memory; verify each surviving flag against source before healing.", "E": "yuri-persona-gauntlet Workflow.", "W": "DURABLE method for pre-send QA of any counterpart family.", "Y": "GREEN", "file": "_STATE/2026-08-10-session-decisions.dewy.json"}, {"date": "2026-08-10", "id": "2026-08-10-yuri-send-final-structure", "surface": "yuri family / send", "q": "After 4 gauntlets, what is the final structure sent to Yuri, and is it sent?", "D": "Two-link warm one-door (before/after=codex + diamond-as-a-read); the machine (scored closed-loop + file-your-own-bet = the RECEIPT) chained off the codex close; profile redacted; all honest, machine-gated for overclaim (ADR-044). SENT via Gmail 2026-08-10 after replacing the stale draft that carried the false model-agnostic claim.", "E": "yuri.arcs.care family; Gmail draft r-2135081402185612206 -> sent to siryuri@gmail.com.", "W": "Ball in Yuri's court; part-two / guidance / Agentum threads live.", "Y": "GREEN", "file": "_STATE/2026-08-10-session-decisions.dewy.json"}, {"date": "2026-08-10", "id": "2026-08-10-night-moves-routine-built", "surface": "meta / tooling", "q": "How does Zach keep a legible daily record across ~40 parallel worktrees without hand-compiling it?", "D": "Build /night-moves: a deterministic gather script (git log --all + net-new-tool/ADR/DEWY/memory detection, zero LLM cost) + a skill that synthesizes 5 sections (shipped/next/learned/tool-shape/net-new tools) into a dated ledger.", "E": "scripts/night_moves_gather.sh + .claude/skills/night-moves/SKILL.md; writes _STATE/night-moves/<date>.md.", "W": "DURABLE. Revisit if a nightly schedule is added or git/worktree topology changes.", "Y": "GREEN", "file": "_STATE/2026-08-10-session-decisions.dewy.json"}, {"date": "2026-08-11", "id": "2026-08-11-witness-trigger-built", "surface": "meta / tooling", "q": "When a flash of brilliance crystallizes mid-conversation, how do we attest to it honestly instead of reconstructing it later?", "D": "Build /witness: a one-shot, verbatim, timestamped capture with an honest gut-check Y, appended to _STATE/witness/<date>.jsonl. WORLD.md carries the proactive trigger (THE WITNESS, beside the Drift Sentinel) so Claude offers it unprompted at the moment it notices the signal.", "E": ".claude/commands/witness.md; WORLD.md THE WITNESS section; _STATE/witness/*.jsonl.", "W": "DURABLE. Revisit after a few days of real firings — whether to wire into /night-moves.", "Y": "GREEN", "file": "_STATE/2026-08-11-session-decisions.dewy.json"}, {"date": "2026-08-11", "id": "2026-08-11-family-airgap", "surface": "deploy", "q": "How to ship the canon artifacts publicly without leaking the client book?", "D": "Two layers, one air-gap: SSOT truth feeds prospect-safe faces; meta-audit stays private.", "E": "prospects, counterparts (as names)", "W": "shipped today", "Y": "GREEN", "file": "_STATE/2026-08-11-session-decisions.dewy.json"}, {"date": "2026-08-11", "id": "2026-08-11-drift-receipt-gate", "surface": "ci", "q": "How do we learn st a ~20-line spec, not a polish session.", "Y": "GREEN", "file": "_STATE/2026-08-17-prl-1-1-session-decisions.dewy.json"}, {"date": "2026-08-26", "id": "2026-08-26-first-closed-client-receipt", "surface": "engagement / pricing governance", "q": "What does the first fully-closed ex-ante receipt in a paying engagement change about how expectations are set?", "D": "Canonize ADR-069: expectation management is precedent-shaped. Forward claims cite banked receipts; every phase closes one; losing receipts are publishable; variance is priced as preconditions, not padding.", "E": "Todd/PRL engagement; receipt-calibrated pricing mechanism; prl.arcs.care/status/receipt surface; future engagement-flightops extraction (rule of three).", "W": "YEARS. Revisit if a receipt closes without reshaping the next phase, or a client claim ships uncited.", "Y": "GREEN — mechanism survived a red close: 1.2 wrong-if fired (~2.1x central vs 20h bet), $4,500 cap held, overage converted to priced knowledge (coordination is the variance source).", "file": "_STATE/2026-08-26-session-decisions.dewy.json"}, {"date": "2026-08-28", "id": "2026-08-28-arcs-two-surface-induction", "surface": "product thesis / architecture canon", "q": "What is the surface that serves pre-verbal, exploratory, can't-yet-name-it work, and how does it relate to the receipt?", "D": "Canonize ADR-070: ARCS is TWO surfaces. Receipt = deductive/backward, records earned coherence. Induction = abductive/forward, recognizes the job-pattern (often before the human does), keeps the human honest vs ground truth, and forges the purpose-built instrument that fits. The meandering is the generative medium, not waste.", "E": "The Folksonomist (induction engine, scripts/arcs_core.py); NOTOMATION (constitutional floor); the Receipt/DEWY/witness models (the other surface); every purpose-built instrument minted this session as induction-surface evidence.", "W": "YEARS / constitutional — a naming of existing architecture, governs how future su function md(src){ // tiny markdown: headings, tables, blockquotes, paragraphs, inline bold/italic/code/links
  const inl=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'$1');
  const out=[]; const lines=src.split('\n'); let i=0;
  while(i<lines.length){
    const l=lines[i];
    if(/^\s*$/.test(l)){i++;continue}
    if(/^---+\s*$/.test(l)){i++;continue}
    const h=l.match(/^(#{1,3})\s+(.*)/); if(h){out.push(`<h${h[1].length}>${inl(h[2])}</h${h[1].length}>`);i++;continue}
    if(l.startsWith('|')){ const rows=[]; while(i<lines.length&&lines[i].startsWith('|')){rows.push(lines[i]);i++}
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head=cells(rows[0]); const body=rows.slice(2).map(cells);
      out.push(`<div class="tw"><table><thead><tr>${head.map(c=>`<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`); continue }
    if(l.startsWith('>')){ const q=[]; while(i<lines.length&&lines[i].startsWith('>')){q.push(lines[i].replace(/^>\s?/,''));i++} out.push(`<blockquote>${inl(q.join(' '))}</blockquote>`); continue }
    if(/^\s*[-*]\s/.test(l)){ const li=[]; while(i<lines.length&&/^\s*[-*]\s/.test(lines[i])){li.push(lines[i].replace(/^\s*[-*]\s/,''));i++} out.push(`<ul>${li.map(x=>`<li>${inl(x)}</li>`).join('')}</ul>`); continue }
    const p=[]; while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^(#|\||>|\s*[-*]\s|---)/.test(lines[i])){p.push(lines[i]);i++}
    out.push(`<p>${inl(p.join(' '))}</p>`);
  }
  return out.join('');
}

function doorsFor(room){

  L.edges.forEach(([a,b,w])=>{ const A=NODE[a],B=NODE[b]; if(!A||!B) return;
    let from=null,to=null; if(A.dom===room.dom&&B.dom!==room.dom){from=A;to=B} else if(B.dom===room.dom&&A.dom!==room.dom){from=B;to=A} else return;

  });
  return Object.values(out).sort((x,y)=>y.w-x.w);
}

function latticeSvg(){

  const edges=L.edges.map(([a,b,w])=>{const A=P[a],B=P[b]; if(!A||!B) return ''; const x=NODE[a].dom!==NODE[b].dom; return `<path class="e${x?' x':''}" d="M${A.x},${A.y} Q${cx},${cy} ${B.x},${B.y}" stroke-width="${.4+w/8}"/>`;}).join('');

    <div class="panel wide"><p class="lab au">great moments · when someone outside named the category</p>${(W.moments||[]).map(m=>`<blockquote class="quote">${esc(m.quote)}<small>${esc(m.speaker)} · ${esc(m.date)}</small></blockquote><p>${esc(m.gut)}</p>`).join('')}</div>
  </div>`;
};
S.compass = face=>{
  if(face==='public'){ const tc=W.covenant.trust.sections.find(s=>s.h.startsWith('7'))||{body:''};
    return `<div class="cols">
    <div class="panel"><h3>L0 → L5</h3><div class="rows">${[['L0','raw input','receive the question exactly as given'],['L1','parse & validate','HOLD / REJECT gate; Kintsugi scan'],['L2','decompose','extract D, E, W; infer the opening Y'],['L3','Bayesian update','prior receipts, domain context'],['L4','triune classify','NULL / OM / UNDEFINED per dimension'],['L5','receipt emit','the frozen DEWY coordinate + Y state']].map(x=>row(x[0],esc(x[1]),'',x[2])).join('')}</div></div>
    <div class="panel"><h3>The Y gate</h3><div class="rows">${[['SCRATCH','no coherent position yet · orient only'],['YELLOW','contested · Y gate active'],['PARADOX','options non-separable · Court auto-invoked'],['FORK','two live paths · skintrack choice'],['DELTA','conviction collapsed · watch for phase change'],['GREEN','high conviction · lock what you earned'],['LOCKED','post-Court · superionic']].map(x=>row(x[0],esc(x[1]),'')).join('')}</div></div>
    <div class="panel wide"><h3>Your autonomy is the point</h3><div class="md">${md(tc.body)}</div></div></div>`; }
  if(!PRIVATE) return gated('The DEWY receipts the compass printed');
  const ds=[...W.dewy].sort(byDate).reverse();
  return `<div class="cols"><div class="panel wide"><h3>${ds.length} DEWY receipts</h3><p>Each one a frozen coordinate: D the sharpened question, E the entity, W the window, Y the gate. Click to open.</p><div class="rows">${ds.map(d=>row(d.date,esc(d.id),d.date,d.surface,`<p><b>Q</b> ${esc(d.q)}</p><dl><dt>D</dt><dd>${esc(d.D)}</dd><dt>E</dt><dd>${esc(d.E)}</dd><dt>W</dt><dd>${esc(d.W)}</dd><dt>Y</dt><dd>${esc(d.Y)}</dd></dl><p class="lab">${esc(d.file)}</p>`)).join('')}</div></div></div>`;
};
S.grove = face=>{
  const adrs=[...W.adrs].sort(byDate);
  if(face==='public'){ const months={}; adrs.forEach(a=>{const m=(a.date||'undated').slice(0,7); (months[m]=months[m]||[]).push(a)});
    return `<div class="cols"><div class="panel wide"><h3>${adrs.length} decisions of record</h3><p>Titles and status on this face. The question each one answered is on the other. Numbering: oracle-issued; git's non-fast-forward rejection is the lock.</p>${Object.entries(months).map(([m,xs])=>`<p class="lab" style="margin-top:10px">${esc(m)}</p><div class="rows">${xs.map(a=>row(a.id,esc(a.title),a.date,a.status)).join('')}</div>`).join('')}</div></div>`; }
  if(!PRIVATE) return gated('The sharp questions behind each decision, and the witness stubs that preceded them');
  const ws=[...W.witness].sort(byDate).reverse();
  return `<div class="cols">
    <div class="panel"><h3>The questions</h3><div class="rows">${adrs.filter(a=>a.sharp).reverse().map(a=>row(a.id,esc(a.title),a.date,a.status,`<p>${esc(a.sharp)}</p>`)).join('')}</div></div>
    <div class="panel"><h3>${ws.length} witness stubs</h3><p>The sound the tree made, not a summary. Attested live, promoted later only if durable.</p>${ws.map(w=>`<div class="row${fog(w.date)}" style="grid-template-columns:1fr"><blockquote class="quote" style="margin:0">${esc(w.quote)}<small>${esc(w.ts)} · Y ${esc(w.y||'—')}${w.promoted?' · promoted':''}</small></blockquote>${w.gut?`<p style="margin:6px 0 0;font-size:.84rem;color:var(--fg3)">${esc(w.gut)}</p>`:''}</div>`).join('')}</div></div>`;
};
S.ziggurat = face=>{
  if(face==='public') return `<div class="cols"><div class="panel wide" style="display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,1fr);gap:18px;align-items:start"><div>${latticeSvg()}</div><div id="nodeinfo" class="panel">${nodeInfo(selNode)}</div></div>
    <div class="panel"><h3>Strata</h3><p>Radius is stratum: ${Object.values(L.strata).map(s=>esc(s.label)).join(' → ')}. Azimuth is domain. Gold arcs are cross-domain echoes: the same shape seen from two faces of the corpus, which is what makes a door.</p></div>
    <div class="panel"><h3>The satoshi</h3><p>${esc(L.satoshi?.note)}</p><div class="chips">${(L.satoshi?.scales||[]).map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div></div></div>`;
  if(!PRIVATE) return gated('The memory ziggurat: 200+ memory nodes and their declared links');
  const z=W.ziggurat||{};
  return `<div class="cols"><div class="panel"><h3>The memory ziggurat</h3><p>${z.nodes} nodes · ${z.edges} declared edges · ${z.dangling} dangling declared links · emitted ${esc(z.generated)}. Stratum is echo weight (declared in-degree); no edge invented, declared only.</p></div>
    <div class="panel"><h3>Load-bearing hubs</h3><div class="rows">${(z.hubs||[]).map(h=>row(String(h.in),esc(h.id),'',[h.kind,h.type].filter(Boolean).join(' · '),`<p>${esc(h.desc)}</p>`)).join('')}</div></div>
    <div class="panel wide"><h3>Recoil ledgers · ${W.recoil.length}</h3><div class="rows">${[...W.recoil].sort(byDate).reverse().map(r=>row(r.date,esc(r.name),r.date)).join('')}</div></div></div>`;
};
S.trenches = face=>{
  if(face==='public') return `<div class="cols">${W.blog.map(b=>`<div class="panel${b.tier==='full'?' wide':''}"><p class="lab cy">${esc(b.eyebrow||'notes from the trenches')} · ${esc(b.tier)}</p><h3>${esc(b.title)}</h3><p>${esc(b.description||'')}</p>${b.lede?`<p style="font-family:var(--serif);font-size:1.05rem;color:var(--fg1)">${esc(b.lede)}</p>`:''}${b.arc?.stops?.length?`<p class="lab">${esc(b.arc.caption||'the arc')}</p><div class="chips">${b.arc.stops.map(s=>{const t=(b.threads||[]).find(t=>t.id===s.thread);return `<span class="chip" style="border-color:${esc(t?.hex||'var(--border-hi)')};color:${esc(t?.hex||'var(--fg2)')}">${esc(s.label)}</span>`}).join('')}</div>`:''}<p class="lab">${esc(b.file)}</p></div>`).join('')}</div>`;
  if(!PRIVATE) return gated('The war rooms and per-counterpart recoil behind the stories');
  return `<div class="cols"><div class="panel"><h3>War rooms · ${W.warrooms.length}</h3><div class="chips">${W.warrooms.map(w=>`<span class="chip">${esc(w)}</span>`).join('')}</div></div><div class="panel"><h3>Recoil · ${W.recoil.length} ledgers</h3><p>Ex-ante receipt before any counterpart send; pre-send gauntlet; close-loop when they respond. The three mandatory-blocking prints (ADR-068).</p><div class="rows">${[...W.recoil].sort(byDate).reverse().slice(0,20).map(r=>row(r.date,esc(r.name),r.date)).join('')}</div></div></div>`;
};
S.covenant = face=>{
  const c=W.covenant;
  if(face==='public') return `<div class="cols"><div class="panel wide"><p class="lab au">trust contract v${esc(c.trust.version)} · ${esc(c.trust.date)} · canonical</p><h3>${esc(c.trust.sections[0]?.h||'What ARCS is')}</h3><div class="md">${md(c.trust.sections[0]?.body||'')}</div></div>
    ${c.trust.sections.slice(1).map(s=>`<div class="panel"><h3>${esc(s.h)}</h3><div class="md">${md(s.body)}</div></div>`).join('')}
    <div class="panel"><h3>Privacy</h3>${c.privacy.map(p=>`<p>${esc(p)}</p>`).join('')}</div>
    <div class="panel"><h3>Terms · a covenant, not a liability shield</h3>${c.terms.map(p=>`<p>${esc(p)}</p>`).join('')}</div></div>`;
  const ids=new Set(W.covenant_adrs); const adrs=W.adrs.filter(a=>ids.has(a.id));
  return `<div class="cols"><div class="panel wide"><h3>What enforces it</h3><p>The covenant is kept true by architecture, not policy. These are the decisions that do the keeping.</p><div class="rows">${adrs.map(a=>row(a.id,esc(a.title),a.date,a.status,a.sharp?`<p>${esc(a.sharp)}</p>`:'')).join('')}</div>${PRIVATE?'':gated('The sharp question behind each enforcing decision')}</div></div>`;
};
S.guide = face=>{
  const f=W.flora;
  if(face==='public') return `<div class="cols">${f.kingdoms.map(k=>`<div class="panel"><p class="lab">plate ${esc(k.n)}</p><h3>${esc(k.name)}</h3><div class="rows">${k.organisms.map(o=>`<div class="row" style="grid-template-columns:1fr auto"><span class="t"><em style="font-family:var(--serif);font-size:1.05rem">${esc(o.binomial)}</em></span><span class="d">${esc(o.name)}</span></div>`).join('')}</div></div>`).join('')}<div class="panel wide"><p class="lab">${esc(f.file)} · the interactive plates live in _ARTIFACTS/flora-and-fauna/surface.html</p></div></div>`;
  if(!PRIVATE) return gated('The prospecting survey and the ore ledger');
  const s=W.survey||{};
  return `<div class="cols"><div class="panel"><h3>Ore and dormancy</h3><p>${s.orphans} files nothing points at, ${((s.orphan_bytes||0)/1048576).toFixed(1)} MB. Staleness is not death; dormancy is a claim that must be earned. Never delete before the bundle exists.</p><p class="lab">harvest cycle · index ✓ · catalog · organize · bundle</p></div><div class="panel"><h3>Grades</h3><div class="rows">${['A','B','C','D'].map(g=>row(g,String(s.grades?.[g]??'—'),'',{A:'dated · provenance · referenced · well-formed',B:'three of four',C:'two of four',D:'one or none, or a secret hit'}[g])).join('')}</div></div></div>`;
};
S.spine = face=>{
  if(face==='public') return `<div class="cols"><div class="panel wide md">${md(W.apex)}</div></div>`;
  if(!PRIVATE) return gated('The witness stubs and DEWY receipt the spine was drawn from');
  const ws=W.witness.filter(w=>w.date==='2026-08-28'); const ds=W.dewy.filter(d=>d.date==='2026-08-28');
  return `<div class="cols"><div class="panel"><h3>Witnessed that night</h3>${ws.length?ws.map(w=>`<blockquote class="quote">${esc(w.quote)}<small>${esc(w.ts)}</small></blockquote>`).join(''):'<p>No stubs dated 2026-08-28 in this build.</p>'}</div><div class="panel"><h3>Receipted</h3><div class="rows">${ds.map(d=>row(d.date,esc(d.id),d.date,d.surface,`<p><b>Q</b> ${esc(d.q)}</p><dl><dt>D</dt><dd>${esc(d.D)}</dd><dt>Y</dt><dd>${esc(d.Y)}</dd></dl>`)).join('')||'<p>—</p>'}</div></div></div>`;
};
const ASPECT={compass:'D',grove:'Y',ziggurat:'E',trenches:'E',covenant:'Y',guide:'W',spine:'D',threshold:null};

/* ───────────── render ───────────── */
function render(){
  const room=ROOMS[pos%N], face=pos>=N?'private':'public';
  $('#hud-room').textContent=room.name; $('#hud-face').textContent=face+' face'; $('#hud-face').className='face '+face;
  $('#hud-theta').textContent=`θ ${pos*DEG}°`;
  const sc=$('#scene'); sc.classList.remove('enter'); void sc.offsetWidth;
  sc.innerHTML=`<p class="lab cy">room ${pos%N+1} of ${N} · ${face} face · ${pos*DEG}° of 720°</p><h1 class="room-title">${esc(room.name).replace(/^The /,'The <em>')}${room.name.startsWith('The ')?'</em>':''}</h1><p class="lede">${room.lede}</p>${S[room.id](face)}${doorsHtml(room)}${pollen(ASPECT[room.id])}`;
  sc.classList.add('enter'); sc.scrollTop=0;
  sc.querySelectorAll('.row.clickable').forEach(r=>r.addEventListener('click',e=>{ if(e.target.closest('a')) return; r.classList.toggle('open'); }));
  sc.querySelectorAll('.door').forEach(b=>b.addEventListener('click',()=>{ const i=ROOMS.findIndex(r=>r.id===b.dataset.go); go(i+(pos>=N?N:0)); }));
  sc.querySelectorAll('.latt .n').forEach(g=>g.addEventListener('click',()=>{ selNode=g.dataset.id; sc.querySelectorAll('.latt .n').forEach(x=>x.classList.toggle('sel',x.dataset.id===selNode)); $('#nodeinfo').innerHTML=nodeInfo(selNode); }));
  drawStrip();
  try{localStorage.setItem('arcs-world-pos',String(pos));}catch(e){}
}
function go(p){ pos=((p%STOPS)+STOPS)%STOPS; render(); }
$('#prev').addEventListener('click',()=>go(pos-1)); $('#next').addEventListener('click',()=>go(pos+1));
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight') go(pos+1); else if(e.key==='ArrowLeft') go(pos-1); else if(e.key==='f'||e.key==='F') go(pos+N); else if(/^[1-8]$/.test(e.key)) go((+e.key-1)+(pos>=N?N:0)); });

/* ───────────── the strip: a lemniscate; first loop public, second loop private ───────────── */
function lem(t){ // t in [0,1) → point on ∞ curve
  const a=2*Math.PI*t, s=Math.sin(a), c=Math.cos(a), d=1+s*s; return {x:450+380*c/d, y:48+40*s*c/d};
}
function drawStrip(){
  const svg=$('#mob'); let path='M'; for(let i=0;i<=200;i++){const p=lem(i/200); path+=`${i?'L':''}${p.x.toFixed(1)},${p.y.toFixed(1)} `;}
  let stops=''; for(let i=0;i<STOPS;i++){ const p=lem(i/STOPS); const pv=i>=N; stops+=`<circle class="stop${pv?' pv':''}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="6" data-i="${i}"><title>${esc(ROOMS[i%N].name)} · ${pv?'private':'public'} face</title></circle>`; }
  const h=lem(pos/STOPS);
  svg.innerHTML=`<path class="band" d="${path}"/><path class="band2" d="${path}"/>${stops}<circle class="here" cx="${h.x.toFixed(1)}" cy="${h.y.toFixed(1)}" r="7"/><text x="450" y="93" text-anchor="middle">← private face · the crossing is the half-twist · one turn = other face · two turns = home · public face →</text>`;
  svg.querySelectorAll('.stop').forEach(c=>c.addEventListener('click',()=>go(+c.dataset.i)));
}

/* ───────────── time rail ───────────── */
(function(){
  const tr=W.time_range; if(!tr){ $('#timerail').hidden=true; return; }
  const d0=new Date(tr[0]), d1=new Date(tr[1]); const days=Math.max(1,Math.round((d1-d0)/86400000));
  const inp=$('#now'); inp.max=days; inp.value=days; $('#t0').textContent=tr[0]; $('#t1').textContent=tr[1];
  const set=()=>{ const d=new Date(d0.getTime()+(+inp.value)*86400000); now=d.toISOString().slice(0,10); $('#tnow').textContent=now+(now>=tr[1]?' · all rendered':' · later is fog'); document.querySelectorAll('.row[class]').forEach(()=>{}); render(); };
  inp.addEventListener('input',()=>{ const d=new Date(d0.getTime()+(+inp.value)*86400000); now=d.toISOString().slice(0,10); $('#tnow').textContent=now+(now>=tr[1]?' · all rendered':' · later is fog'); document.querySelectorAll('#scene .row').forEach(r=>{ const dd=r.querySelector('.d')?.textContent; if(dd&&/^\d{4}-\d{2}-\d{2}$/.test(dd)) r.classList.toggle('fog',dd>now); }); });
  now=tr[1]; $('#tnow').textContent=now+' · all rendered';
})();

try{ const p=+localStorage.getItem('arcs-world-pos'); if(!isNaN(p)&&p>=0&&p<STOPS) pos=p; }catch(e){}
render();
</script>
