# cua-driver (QuaDriver) bounded capability manifest — ARCS-only scope
#
# Purpose: confine cua-driver to the ARCS surfaces and NOTHING else. Anything outside
# this manifest is denied. This is the app-level scoping layer (macOS TCC Accessibility/
# Screen-Recording grants remain GLOBAL to the CuaDriver.app bundle — the OS cannot scope
# per-app; this manifest is cua-driver's own enforcement on top of that global grant).
#
# ENABLE (human-approved; the agent CANNOT self-grant):
#   cua-driver serve --permission-mode bounded \
#     --capability-manifest ./cua-capabilities.yaml \
#     --approve-capability-manifest
# The approve flag confirms a trusted launcher reviewed THIS exact file; it cannot be
# invoked programmatically. Copy this template to ./cua-capabilities.yaml before launch.
#
# MODE NOTE: browser-origins mode is mutually exclusive with generic input tools.
# Declaring resources.browser.origins EXCLUDES click / type_text / get_window_state.
# ARCS is a web app, so we use browser mode (origin-gated) — the tighter choice.
#
# CAVEAT: this is policy enforced by cua-driver, not a kernel sandbox. For a hard boundary
# the driver cannot cross, run cua-driver under a dedicated macOS user account or a VM.

version: 3
expires_after: 8h        # grant self-expires; re-approve to continue
idle_timeout: 30m        # revokes after inactivity

allow:
  tools:                 # browser-mode toolset ONLY (no generic desktop input)
    - start_session
    - end_session
    - browser_prepare
    - get_browser_state
    - browser_navigate
    - browser_click
    - browser_type
    - browser_download

resources:
  browser:
    profiles:
      - kind: isolated   # fresh isolated profile — no access to your other logged-in sessions.
                         # switch to existing_profile ONLY if ARCS magic-link auth needs your
                         # real browser session (broader surface — decide deliberately).
    origins:             # web actions confined to these exact scheme+host+port
      - https://app.arcs.care
      - https://arcs.care
      - http://localhost:3000

  files:                 # driver file access (e.g. browser_download) — repo dir only.
    read:                # NOTE: machine-specific absolute path; adjust per host.
      - dir: /Users/zharris/arcs-v9
        recursive: true
    write:
      - dir: /Users/zharris/arcs-v9
        recursive: true

  desktop:
    display: false       # no full-desktop screenshot/observation
