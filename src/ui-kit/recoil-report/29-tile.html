<!-- @dsCard group="Molecules" name="Tile" subtitle="Stat or probability tile: one number, one unit, one source" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tile</title>
<link rel="stylesheet" href="_tokens.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--ds-font-sans); font-size: var(--fs-body); line-height: 1.6; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
/* @prim:begin 29-tile */
.section-label { font-family: var(--ds-font-mono); font-size: var(--fs-label); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--ds-r-md); padding: 14px 16px; }
.tile .v { font-family: var(--ds-font-mono); font-size: var(--fs-display); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.tile .v.cyan { color: var(--cyan); }
.tile .k { font-family: var(--ds-font-mono); font-size: var(--fs-label); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
/* @prim:end 29-tile */
</style>
</head>
<body>
<main>
<h1 class="section-label">Tile</h1>
<div class="tiles"><div class="tile"><div class="v cyan">72%</div><div class="k">probability</div></div><div class="tile"><div class="v">14</div><div class="k">receipts</div></div><div class="tile"><div class="v">3</div><div class="k">open forks</div></div></div>
</main>
</body>
</html>
