<!-- @dsCard group="Recoil Report" name="Entity Card" subtitle="4 signal states: CYAN/GREEN/GOLD/RED · grid layout" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_tokens.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); font-family: var(--font-sans); padding: 24px; }

.entity-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.entity-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  overflow: hidden;
  display: flex; position: relative;
  min-height: 80px;
}
.entity-card .strip {
  width: 4px; flex-shrink: 0;
}
.entity-card .body {
  padding: 12px 16px; flex: 1;
  display: flex; flex-direction: column; gap: 3px;
}
.entity-name {
  font-family: var(--font-sans); font-size: 14px; font-weight: 600;
  color: var(--text); line-height: 1.2;
}
.entity-role {
  font-family: var(--font-sans); font-size: 12px;
  color: var(--muted);
}
.entity-note {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--dimmed); margin-top: 4px;
}
.entity-badge {
  position: absolute; top: 10px; right: 12px;
  font-family: var(--font-mono); font-size: 9px;
  font-weight: 700; letter-spacing: 0.1em;
  padding: 3px 8px; border-radius: var(--r-sm);
  border: 1px solid;
}

/* Signal color variants */
.cyan  .strip { background: var(--cyan); }
.cyan  .entity-badge { color: var(--cyan); border-color: var(--cyan); background: var(--cyan-bg); }

.green .strip { background: var(--green); }
.green .entity-badge { color: var(--green); border-color: var(--green); background: var(--green-bg); }

.gold  .strip { background: var(--gold); }
.gold  .entity-badge { color: var(--gold); border-color: var(--gold); background: var(--gold-bg); }

.red   .strip { background: var(--red); }
.red   .entity-badge { color: var(--red); border-color: var(--red); background: var(--red-bg); }

.muted-state .strip { background: var(--muted); }
.muted-state .entity-badge { color: var(--muted); border-color: var(--muted); background: rgba(71,85,105,0.1); }
</style>
</head>
<body>
<div class="entity-grid">
  <div class="entity-card green">
    <div class="strip"></div>
    <div class="body">
      <div class="entity-name">CJ Masopust</div>
      <div class="entity-role">Talent Lead · Fanatics Collectibles</div>
      <div class="entity-note">Gate to Chase</div>
    </div>
    <div class="entity-badge">WARM</div>
  </div>

  <div class="entity-card cyan">
    <div class="strip"></div>
    <div class="body">
      <div class="entity-name">Chris Lamontagne</div>
      <div class="entity-role">SVP Growth · Fanatics</div>
      <div class="entity-note">HARD-YES signal</div>
    </div>
    <div class="entity-badge">LOCKED</div>
  </div>

  <div class="entity-card gold">
    <div class="strip"></div>
    <div class="body">
      <div class="entity-name">Chase (unknown)</div>
      <div class="entity-role">Instant Rips Growth — Day-1 Beachhead</div>
      <div class="entity-note">Not yet met</div>
    </div>
    <div class="entity-badge">PENDING</div>
  </div>

  <div class="entity-card muted-state">
    <div class="strip"></div>
    <div class="body">
      <div class="entity-name">Regina Marshall</div>
      <div class="entity-role">EA to Chris · Cal management</div>
      <div class="entity-note">Possibly AI agent</div>
    </div>
    <div class="entity-badge">PASSIVE</div>
  </div>
</div>
</body>
</html>
