<!-- @dsCard group="Instrument Lab" name="Backlog Graph" subtitle="backlog_graph.py output as a cascade · columns are waves · press a row to finish it and light what it unlocks" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backlog graph</title>
<link rel="stylesheet" href="_tokens.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
::selection { background: var(--cyan-bg); color: var(--text); }
body { background: var(--bg); color: var(--text); font-family: var(--ds-font-sans); font-size: var(--fs-body); line-height: 1.6; padding: 24px 16px; }
main { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.section-label { font-family: var(--ds-font-mono); font-size: var(--fs-label); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.btn { font: inherit; font-family: var(--ds-font-mono); font-size: var(--fs-label); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text); background: var(--elevated); border: 1px solid var(--border); border-radius: var(--ds-r-xs); padding: 8px 12px; cursor: pointer; min-height: 44px; }
.btn:hover { border-color: var(--cyan); }
.btn[aria-pressed=true] { border-color: var(--cyan); color: var(--cyan); }
.btn:focus-visible, input:focus-visible, .sq:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.hint { color: var(--text-secondary); }
/* Organism 35: backlog graph. Waves left to right, dependency edges, clusters lettered, branches dotted, ready rows lit. */
.bg-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--ds-r-sm); background: var(--surface); padding: 8px; }
.bg-scroll svg { display: block; width: 100%; height: auto; }
.bg-wave { fill: var(--text-secondary); font-family: var(--ds-font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
.bg-edge { fill: none; stroke: var(--border); stroke-width: 1.5; }
.bg-node rect { fill: var(--elevated); stroke: var(--border); stroke-width: 1; }
.bg-node.ready rect { stroke: var(--green); fill: var(--green-bg); }
.bg-id { fill: var(--text); font-family: var(--ds-font-mono); font-size: 11px; font-weight: 600; }
.bg-cl { fill: var(--text-secondary); font-family: var(--ds-font-mono); font-size: 11px; letter-spacing: 0.06em; }
.bg-node { cursor: pointer; outline: none; }
.bg-node:focus-visible rect { stroke: var(--cyan); stroke-width: 2; }
.bg-node:hover rect { stroke: var(--text-secondary); }
.bg-node.done rect { fill: var(--surface); stroke: var(--border); stroke-dasharray: 4 3; }
.bg-node.done .bg-id { fill: var(--text-secondary); }
.bg-node.ready .bg-cl { fill: var(--green); }
.bg-edge.lit { stroke: var(--green); }
.bg-say { min-height: 1.6em; margin-bottom: 10px; color: var(--text); }
.bg-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 14px; }
.bg-facts ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.bg-facts li { font-family: var(--ds-font-mono); font-size: var(--fs-label); color: var(--text); overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
<section aria-labelledby="bg-h"><h1 class="section-label" id="bg-h">Backlog graph</h1>
<p class="bg-say" role="status" data-say>Press a row when it is finished. Whatever it unlocks lights up.</p>
<div class="bg-scroll" tabindex="0" role="region" aria-label="Backlog graph, scrolls sideways"><svg data-g role="group" aria-label="Backlog rows by wave with their dependencies"></svg></div>
<p class="hint">Made-up demo rows, run through scripts/backlog_graph.py --json.</p></section>
</main>
<script src="_player.js"></script>
