<!-- @dsCard group="Molecules" name="Callout" subtitle="Bordered note tinted by its signal; the measure sits on the box" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Callout</title>
<link rel="stylesheet" href="_tokens.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--ds-font-sans); font-size: var(--fs-body); line-height: 1.6; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
/* @prim:begin 31-callout */
.section-label { font-family: var(--ds-font-mono); font-size: var(--fs-label); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.callout { max-width: var(--measure, 640px); background: var(--gold-bg); border: 1px solid var(--gold); border-radius: var(--ds-r-sm); padding: 12px 16px; color: var(--text-secondary); }
.callout.red { background: var(--red-bg); border-color: var(--red); }
.callout b { font-family: var(--ds-font-mono); font-size: var(--fs-label); letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); margin-right: 6px; }
.callout.red b { color: var(--red); }
/* @prim:end 31-callout */
</style>
</head>
<body>
<main>
<h1 class="section-label">Callout</h1>
<div class="callout"><b>Unconfirmed.</b> This reading rests on one source. Treat it as a lead, not a finding.</div><div class="callout red"><b>Stop-loss.</b> If the counterpart has not replied by Friday, close the loop and move on.</div>
</main>
</body>
</html>
