<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
::selection { background: var(--cyan-bg); color: var(--text); }
body { background: var(--bg); color: var(--text); font-family: var(--ds-font-sans); font-size: var(--fs-body); line-height: 1.6; padding: 24px 16px; }
main { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.section-label { font-family: var(--ds-font-mono); font-size: var(--fs-label); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.btn { font: inherit; font-family: var(--ds-font-mono); font-size: var(--fs-label); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text); background: var(--elevated); border: 1px solid var(--border); border-radius: var(--ds-r-xs); padding: 8px 12px; cursor: pointer; min-height: 44px; }
.btn:hover { border-color: var(--cyan); }
.btn[aria-pressed=true] { border-color: var(--cyan); color: var(--cyan); }
.btn:focus-visible, input:focus-visible, .sq:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.hint { color: var(--text-secondary); }
.tp { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.tpl { font-family: var(--ds-font-mono); font-size: var(--fs-label); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-secondary); }
.tp input[type=range] { flex: 1 1 200px; min-width: 0; height: 44px; accent-color: var(--cyan); margin: 0; }
.tp .hint { flex: 1 1 100%; }
/* Organism 34: belief manifold. Confidence per belief over the call, kairos pins, scrub head, D1 to D3 readout. */
.mf svg { display: block; width: 100%; height: auto; }
.mf-grid { stroke: var(--border); stroke-width: 1; }
.mf-axis { fill: var(--text-secondary); font-family: var(--ds-font-mono); font-size: 11px; font-variant-numeric: tabular-nums; }
.mf-line { fill: none; stroke-width: 2.5; stroke-linejoin: round; }
.mf-pin { stroke-width: 1; stroke-dasharray: 3 4; }
.mf-head { stroke: var(--text); stroke-width: 1.5; }
.mf-dot { stroke: var(--bg); stroke-width: 2; }
.mf-sw { display: inline-block; width: 10px; height: 10px; border-radius: var(--ds-r-xs); margin-right: 8px; vertical-align: baseline; }
.mf-line.cyan, .mf-pin.cyan { stroke: var(--cyan); } .mf-line.green, .mf-pin.green { stroke: var(--green); } .mf-line.gold, .mf-pin.gold { stroke: var(--gold); }
.mf-pin.muted { stroke: var(--muted); }
.mf-node.cyan, .mf-dot.cyan, .mf-sw.cyan { fill: var(--cyan); background: var(--cyan); }
.mf-node.green, .mf-dot.green, .mf-sw.green { fill: var(--green); background: var(--green); }
.mf-node.gold, .mf-dot.gold, .mf-sw.gold { fill: var(--gold); background: var(--gold); }
.mf-node.muted { fill: var(--muted); }
.mf-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-variant-numeric: tabular-nums; }
.mf-table th, .mf-table td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--border); font-family: var(--ds-font-mono); font-size: var(--fs-label); }
.mf-table thead th { color: var(--text-secondary); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }
.mf-table tbody th { text-align: left; font-family: var(--ds-font-sans); font-size: var(--fs-body); font-weight: 500; color: var(--text); }
.mf-scroll { overflow-x: auto; }
.mf-scroll:focus-visible, .bg-scroll:focus-visible, .sqwrap:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
</style>
</head>
