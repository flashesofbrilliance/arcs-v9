# Monthly governance heartbeat (ADR-033). The CI ledger gate only fires when
# someone pushes; this fires on the calendar, so a quiet month can't silently
# age findings past SLA. Opens a GitHub issue when the ledger is delinquent.
name: Governance

on:
  schedule:
    - cron: "0 13 1 * *" # 1st of each month, 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ledger delinquency check
        id: ledger
        run: |
          python3 scripts/ledger_check.py | tee ledger-report.txt
        continue-on-error: true

      - name: Open issue on delinquency
        if: steps.ledger.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Governance: enforcement-parity ledger delinquent ($(date +%Y-%m))" \
            --label governance \
            --body "$(printf 'The monthly ledger check found delinquent findings (ADR-033).\n\n```\n%s\n```\n\nClose each with a mechanism (test/ci/guard) or a dated waiver in _PATTERNS/ledger.json.' "$(cat ledger-report.txt)")"
