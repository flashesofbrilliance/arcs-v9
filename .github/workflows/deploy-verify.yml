name: Deploy Verify + Auto-Rollback

# Fires whenever Vercel's GitHub integration posts a deployment_status event
# (it does this automatically on every deploy it makes — no extra wiring
# needed beyond the Vercel↔GitHub integration already connected to this repo).
# Only acts on the production environment reaching "success" (i.e. the new
# deployment is live and serving traffic).
#
# On failure of either check below, this workflow rolls the alias back to
# the previous READY production deployment via `vercel rollback`, then opens
# a GitHub Issue recording what happened — same "circuit breaker, human
# notified" pattern as arcs-care's ADR-014, adapted for this repo.
#
# Requires three repo secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       — Vercel personal/team token, scoped to this project
#   VERCEL_ORG_ID       — from `vercel project ls` or .vercel/project.json
#   VERCEL_PROJECT_ID   — from .vercel/project.json
# These are not set by this commit — a human has to add them once.

on:
  deployment_status:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'production'
    runs-on: ubuntu-latest
    env:
      # Smoke against the PRODUCTION ALIAS, not the raw per-deploy vercel.app URL.
      # deployment_status.target_url is the bare deployment host (e.g.
      # arcs-v9-<hash>-arcs-care.vercel.app), where this app's host-based routing
      # (src/proxy.ts + next.config.ts rewrites keyed on *.arcs.care) and the
      # recoil gating do NOT apply -- so /observatory, /forge, /recoil/* and the
      # air-gap checks all false-fail and (with rollback wired) would roll back a
      # HEALTHY prod deploy. The alias carries the real host routing. Root-caused
      # on the first prod run after re-enable (2026-09-26): API + FE smoke failed
      # on the vercel.app host while app.arcs.care served 200s across the board.
      TARGET_URL: https://app.arcs.care
      # The specific deployment this event is for -- recorded in the incident issue.
      DEPLOY_URL: ${{ github.event.deployment_status.target_url }}
    steps:
      - uses: actions/checkout@v7

      # Cost gate (2026-08-19): 242 verify runs in 19 days, most triggered by
      # doc-only deploys that cannot change runtime behavior. Diff the deployed
      # commit against the previous READY production deployment; if nothing in
      # src/, public/, prisma/, next.config.ts, or package*.json changed, skip
      # the expensive E2E (npm ci + Playwright + smokes).
      #
      # Convention: this step communicates ONLY via the `skip` output — never
      # via its exit code (the ignored-build-step exit-code convention was
      # inverted once before; outputs are unambiguous). It FAILS OPEN: any
      # error computing the diff (API down, missing secret, unknown sha)
      # leaves skip=false and the full verify runs. Unrelated to Vercel's
      # ignored-build-step — this gate never decides whether a deploy builds,
      # only whether we re-run E2E against one that is already live.
      - name: Gate — diff vs previous READY prod deploy
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          CURRENT_SHA: ${{ github.event.deployment.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          echo "skip=false" >> "$GITHUB_OUTPUT"   # fail-open default

          deploys=$(curl -sf --max-time 20 \
            "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&target=production&state=READY&limit=10" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}") || { echo "Vercel API unavailable — running full verify"; exit 0; }

          prev_sha=$(echo "$deploys" | python3 -c '
          import json, sys, os
          cur = os.environ["CURRENT_SHA"]
          for d in json.load(sys.stdin).get("deployments", []):
              sha = (d.get("meta") or {}).get("githubCommitSha")
              if sha and sha != cur:
                  print(sha)
                  break
          ') || { echo "Could not parse deployments — running full verify"; exit 0; }
          [ -n "$prev_sha" ] || { echo "No prior READY deploy found — running full verify"; exit 0; }

          changed=$(gh api "repos/${{ github.repository }}/compare/${prev_sha}...${CURRENT_SHA}" \
            --jq '.files[].filename') || { echo "Compare API failed — running full verify"; exit 0; }
          [ -n "$changed" ] || { echo "Empty diff (or truncated compare) — running full verify"; exit 0; }

          echo "Changed files since ${prev_sha}:"
          echo "$changed"
          if echo "$changed" | grep -qE '^(src/|public/|prisma/|next\.config\.ts$|package\.json$|package-lock\.json$)'; then
            echo "Runtime-relevant changes detected — running full verify"
          else
            echo "Doc-only deploy — skipping E2E verify"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.gate.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      # ADR-016 API assertions against the real live deployment.
      - name: API smoke (scripts/smoke.sh)
        id: api_smoke
        if: steps.gate.outputs.skip != 'true'
        run: |
          chmod +x scripts/smoke.sh
          PROD_URL="$TARGET_URL" bash scripts/smoke.sh
        continue-on-error: true

      # FE render/console-error assertions against the same live deployment.
      - name: FE smoke (Playwright)
        id: fe_smoke
        if: steps.gate.outputs.skip != 'true'
        run: npm run test:smoke
        env:
          SMOKE_BASE_URL: ${{ env.TARGET_URL }}
        continue-on-error: true

      - name: Evaluate results
        id: eval
        run: |
          if [ "${{ steps.api_smoke.outcome }}" = "failure" ] || [ "${{ steps.fe_smoke.outcome }}" = "failure" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        if: steps.eval.outputs.failed == 'true'
        run: npm install -g vercel@latest

      # Cauterize: revert the production alias to the last known-good
      # deployment. `vercel rollback` targets the most recent prior READY
      # deployment for this project automatically.
      - name: Auto-rollback production alias
        id: rollback
        if: steps.eval.outputs.failed == 'true'
        run: |
          vercel rollback --token="${{ secrets.VERCEL_TOKEN }}" --yes \
            --scope="${{ secrets.VERCEL_ORG_ID }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Open incident issue
        # always() so the alert still fires when the rollback step itself errors
        # (e.g. missing VERCEL_* secrets) -- otherwise a failed rollback silently
        # swallows the incident notification.
        if: always() && steps.eval.outputs.failed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const apiOutcome = "${{ steps.api_smoke.outcome }}";
            const feOutcome = "${{ steps.fe_smoke.outcome }}";
            const rollback = "${{ steps.rollback.outcome }}";
            const verified = process.env.TARGET_URL;
            const deployUrl = process.env.DEPLOY_URL;
            const rolledBack = rollback === "success";
            const action = rolledBack
              ? "`vercel rollback` executed automatically -- production alias reverted to the prior READY deployment."
              : `\`vercel rollback\` did NOT complete (step outcome: ${rollback}) -- production alias was NOT reverted. Roll back manually and check the VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy verify failed on production${rolledBack ? " -- auto-rollback triggered" : " -- ROLLBACK FAILED"} (${deployUrl})`,
              body: [
                `**SIGNAL_FAIL** -- post-deploy verification failed on production.`,
                ``,
                `- Verified alias: ${verified}`,
                `- Deployment: ${deployUrl}`,
                `- API smoke (scripts/smoke.sh): ${apiOutcome}`,
                `- FE smoke (Playwright): ${feOutcome}`,
                `- Auto-rollback step: ${rollback}`,
                `- Action: ${action}`,
                ``,
                `This is the auto-rollback circuit breaker from deploy-verify.yml. Investigate the failing commit before redeploying; the rollback is a stopgap, not a fix.`,
              ].join("\n"),
              labels: ["incident", "auto-rollback"],
            });

      - name: Confirm pass (no-op)
        if: steps.eval.outputs.failed == 'false'
        run: echo "Deploy verify passed — no action taken."
