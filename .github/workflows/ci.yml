name: CI

# Smoke gate: lint + build on every push/PR. Uses the existing package.json
# scripts only — no new test deps. Build runs against a dummy DATABASE_URL
# since Prisma's client is generated at install (postinstall) and the build
# does not connect to the DB. `next build` is also the canonical typecheck for
# this repo (AGENTS.md: `npx next build`, not `tsc --noEmit` — TS5090 baseUrl
# false positives); the former separate tsc step contradicted that rule and was
# removed 2026-07-11 (audit finding #3).
# Cost gate (2026-08-19): doc-only pushes to main skip the whole workflow —
# 224 CI runs in 19 days were mostly handoffs/ADRs/state files that can't
# break a build. public/** is deliberately NOT ignored so the leak-check
# hard gate still fires on every prospect-facing surface change. PRs are
# unaffected (paths-ignore applies to the push trigger only).
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "_DECISIONS/**"
      - "_STATE/**"
      - "_ARCHIVE/**"
      - "_PATTERNS/**"
      - "_INBOX/**"
      - ".claude/**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hard gate — external-surface leak check (J24). Fast, bash-only, no deps, so
  # it runs standalone in parallel with the build. Blocks merge if any
  # prospect-facing public/*.html carries internal text (provenance, model IDs,
  # secrets, local paths, patent strategy). Policy + check, not a per-page fix.
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: External-surface leak check
        run: bash scripts/leak_check.sh

  # Hard gate — belief-log freshness. The falsification ledger is the SSOT;
  # _STATE/belief-log.md is a lawful transform of it (scripts/belief_log_emit.py).
  # A stale view is the exact open-loop-decay the ledger itself catalogues (F27),
  # so the check that closes that loop is a gate, not a comment. Python-only, no
  # deps, seconds to run — also validates the ledger schema / dates / dup ids.
  belief-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Belief-log is current with the ledger
        run: python3 scripts/belief_log_emit.py --check

  # Hard gate — generated views are current with their sources. Pre-commit catches a stale
  # generated file at COMMIT time; a merge can stale it afterwards (two branches appending to
  # the same ledger tail did exactly that twice on 2026-09-27) and nothing turned red. This job
  # makes merge ORDER irrelevant for freshness: whichever lands second must regenerate. Each
  # check is stdlib python, seconds to run. Dependency order (HOLDING rows) is a different
  # question and lives in the air-traffic board, not here.
  generated-views:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Operator registry matches the periodic table + bindings
        run: python3 scripts/operator_registry_emit.py --check
      - name: LEGEND render current
        run: python3 scripts/legend.py check
      - name: LORE render current
        run: python3 scripts/lore.py check
      - name: Fate registry has no hard misses
        run: python3 scripts/fates.py check
      - name: Assumptions ledger valid + render current
        run: python3 scripts/assumptions.py check
      - name: Source-trust table current
        run: python3 scripts/source_trust_emit.py --check
      - name: Every gh_sync backlog row has an issue
        run: python3 scripts/backlog_issue_sync.py --check

  smoke:
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders — no real secrets, no DB connection at build.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      ANTHROPIC_API_KEY: "sk-ant-ci-placeholder"
      AUTH_SECRET: "ci-placeholder-secret"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Advisory: the repo carries pre-existing lint debt, so lint reports but
      # does not block. Tighten to a hard gate once the backlog is cleared.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true

      # Advisory: canon-vs-code drift check (state-sync). Grep-based, narrow
      # assertions only — see scripts/state_sync_check.py. Never blocks; the
      # false-positive risk on a heuristic check isn't worth stopping a merge
      # over. Tighten to a hard gate once its signal is proven over time,
      # same path lint took.
      - name: State-sync drift check (advisory)
        run: python3 scripts/state_sync_check.py
        continue-on-error: true

      # Hard gate: stdlib unit tests (node:test, no framework dep). Covers ygate.ts
      # (ledger YG-005) and the trust-contract section 1 no-anonymous-write regression (TC-004).
      - name: Unit tests
        run: npm run test:unit

      # Hard gate — enforcement-parity ledger (ADR-034): audit findings must
      # exit via a mechanism or dated waiver within their severity SLA.
      - name: Ledger delinquency check
        run: python3 scripts/ledger_check.py

      # NOTE: the informativeness ratchet lives in its own workflow
      # (.github/workflows/informativeness.yml), because THIS workflow is
      # currently disabled — its step here would never run. Do not re-add it here
      # without re-enabling ci.yml.

      # Hard gate — the build is also the typecheck.
      - name: Build (typecheck + compile)
        run: npm run build

  fe-smoke:
    runs-on: ubuntu-latest
    needs: smoke
    # Real Postgres, not a placeholder URL: ClaimAnonymousReceipts (root
    # layout) fetches /api/auth/session on every page, which goes through the
    # Prisma adapter to the DB — with an unreachable DATABASE_URL every route
    # logs a 500 and the console-error assertion fails. An ephemeral service
    # container keeps the smoke honest instead of muting the assertion.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: arcs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: "postgresql://postgres:ci@localhost:5432/arcs"
      ANTHROPIC_API_KEY: "sk-ant-ci-placeholder"
      AUTH_SECRET: "ci-placeholder-secret"
      # Auth.js v5 refuses non-Vercel hosts without this — /api/auth/session
      # 500s on every page (root layout probes it via ClaimAnonymousReceipts).
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply schema to ephemeral Postgres
        run: npx prisma db push

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Real eval, not a placeholder: builds the app, boots it, and drives
      # tests/smoke.spec.ts (route loads, no console errors, real content
      # renders) against the actual server — not mocked. Hard gate: a broken
      # route or a thrown console error blocks the merge.
      - name: Build
        run: npm run build

      - name: Start server + wait for it to bind
        run: |
          npm run start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null && exit 0
            sleep 1
          done
          echo "server never came up" && exit 1

      - name: FE smoke (Playwright)
        run: npm run test:smoke
        env:
          SMOKE_BASE_URL: "http://localhost:3000"
