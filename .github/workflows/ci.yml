name: CI

# Smoke gate: lint + build on every push/PR. Uses the existing package.json
# scripts only — no new test deps. Build runs against a dummy DATABASE_URL
# since Prisma's client is generated at install (postinstall) and the build
# does not connect to the DB. `next build` is also the canonical typecheck for
# this repo (AGENTS.md: `npx next build`, not `tsc --noEmit` — TS5090 baseUrl
# false positives); the former separate tsc step contradicted that rule and was
# removed 2026-07-11 (audit finding #3).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders — no real secrets, no DB connection at build.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      ANTHROPIC_API_KEY: "sk-ant-ci-placeholder"
      AUTH_SECRET: "ci-placeholder-secret"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Advisory: the repo carries pre-existing lint debt, so lint reports but
      # does not block. Tighten to a hard gate once the backlog is cleared.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true

      # Hard gate — the build is also the typecheck.
      - name: Build (typecheck + compile)
        run: npm run build
