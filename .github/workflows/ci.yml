name: CI

# Smoke gate: lint + build on every push/PR. Uses the existing package.json
# scripts only — no new test deps. Build runs against a dummy DATABASE_URL
# since Prisma's client is generated at install (postinstall) and the build
# does not connect to the DB. `next build` is also the canonical typecheck for
# this repo (AGENTS.md: `npx next build`, not `tsc --noEmit` — TS5090 baseUrl
# false positives); the former separate tsc step contradicted that rule and was
# removed 2026-07-11 (audit finding #3).
# Cost gate (2026-08-19): doc-only pushes to main skip the whole workflow —
# 224 CI runs in 19 days were mostly handoffs/ADRs/state files that can't
# break a build. public/** is deliberately NOT ignored so the leak-check
# hard gate still fires on every prospect-facing surface change. PRs are
# unaffected (paths-ignore applies to the push trigger only).
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "_DECISIONS/**"
      - "_STATE/**"
      - "_ARCHIVE/**"
      - "_PATTERNS/**"
      - "_INBOX/**"
      - ".claude/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cost gate for PRs (2026-10-05): paths-ignore above only covers push to main, so docs-only
  # PRs (handoffs, memory, _STATE) still paid for build + smoke + fe-smoke and queued behind
  # every parallel session. This job decides once; the heavy jobs skip when nothing outside
  # the doc globs changed. Plain git, no action deps. leak-check, belief-log and
  # generated-views are cheap hard gates and stay unconditional. No required status checks
  # exist (branch protection is unavailable on the free private plan), so a skipped job
  # cannot block merge; if protection is ever enabled, require gates, not smoke.
  changes:
    if: github.event.pull_request.draft != true
    runs-on: [self-hosted, arcs-light]
    outputs:
      code_changed: ${{ steps.diff.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }})
          echo "$files"
          # Allowlist (2026-10-07): only paths the build, lint, unit tests or Playwright smoke can
          # break. Python-only and workflow-only PRs (scripts/, operators/, runtime/, .github/ other
          # than this file) used to wait ~8 min on fe-smoke for nothing. The five scripts smoke
          # itself runs are listed so a change to a guard still runs the guard.
          code=$(echo "$files" | grep -E '^(src|public|prisma|tests)/|^(package\.json|package-lock\.json|next\.config\.[a-z]+|tsconfig.*\.json|eslint\.config\.mjs|playwright\.config\.[a-z]+|\.github/workflows/ci\.yml)$|^scripts/(classname_guard|purpose_guard|ledger_check|state_sync_check|page_gate)\.py$' || true)
          if [ -n "$code" ]; then echo "code_changed=true"; else echo "code_changed=false"; fi | tee -a "$GITHUB_OUTPUT"

  # Cost gate (2026-10-06): the three cheap hard gates below used to be three jobs, each billed
  # a whole minute (per-job rounding) plus its own checkout. They are one job now; every step
  # runs even when an earlier one fails (if: always()), so a red step never hides another one.
  # Draft PRs skip it; ready_for_review re-triggers the workflow.
  #   leak-check: external-surface leak check (J24). Blocks merge if any prospect-facing
  #     public/*.html carries internal text (provenance, model IDs, secrets, local paths,
  #     patent strategy). Policy + check, not a per-page fix.
  #   belief-log: freshness. The falsification ledger is the SSOT; _STATE/belief-log.md is a
  #     lawful transform of it (scripts/belief_log_emit.py). A stale view is the open-loop
  #     decay the ledger itself catalogues (F27), so the check that closes that loop is a gate.
  #   generated-views: views are current with their sources. Pre-commit catches a stale
  #     generated file at COMMIT time; a merge can stale it afterwards (two branches appending
  #     to the same ledger tail did exactly that twice on 2026-09-27), so this makes merge
  #     ORDER irrelevant for freshness. Generated public pages: a hand edit to the output
  #     instead of the generator fails here. Dependency order (HOLDING rows) lives in the
  #     air-traffic board, not here.
  gates:
    if: github.event.pull_request.draft != true
    runs-on: [self-hosted, arcs-light]
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: External-surface leak check
        run: bash scripts/leak_check.sh
      - name: Belief-log is current with the ledger
        if: always()
        run: python3 scripts/belief_log_emit.py --check
      - name: status.arcs.care static floor is stamped and fresh
        if: always()
        run: python3 scripts/status_floor_emit.py --check
      - name: Operator registry matches the periodic table + bindings
        if: always()
        run: python3 scripts/operator_registry_emit.py --check
      - name: Operator unit tests (stdlib unittest)
        if: always()
        run: python3 -m unittest discover -s operators/tests
      - name: LEGEND render current
        if: always()
        run: python3 scripts/legend.py check
      - name: LORE render current
        if: always()
        run: python3 scripts/lore.py check
      - name: Fate registry has no hard misses
        if: always()
        run: python3 scripts/fates.py check
      - name: Assumptions ledger valid + render current
        if: always()
        run: python3 scripts/assumptions.py check
      - name: Source-trust table current
        if: always()
        run: python3 scripts/source_trust_emit.py --check
      - name: Every held dependency exception has a lift condition
        if: always()
        run: python3 scripts/held_exceptions.py check
      - name: Every gh_sync backlog row has an issue
        if: always()
        run: python3 scripts/backlog_issue_sync.py --check
      - name: Every backlog row has a valid state enum
        if: always()
        run: python3 scripts/backlog_status_check.py --self-test && python3 scripts/backlog_status_check.py --check
      - name: JTBD graph gate (six rules, SOURCE-DUP, key lookup) with fail-on-bad and mutation proofs
        if: always()
        run: python3 scripts/jtbd_graph_schema_check.py --mutation-proof && python3 scripts/jtbd_graph_gates.py --mutation-proof && python3 scripts/universe_jtbd_adapter.py --check
      - name: Every new seed carries a resolvable lineage pointer, no ancestry cycles
        if: always()
        run: python3 scripts/seed_lineage_check.py --self-test && python3 scripts/seed_lineage_check.py --check
      - name: good.arcs.care gallery + connector pages match their renderer
        if: always()
        run: python3 scripts/connector_render.py --check
      - name: NFTT index matches its builder
        if: always()
        run: node scripts/nftt_index_build.mjs --check
      - name: Every routed NFTT post carries its publish timestamp
        if: always()
        run: python3 scripts/nftt_published.py --check
      - name: Every serialized NFTT part carries its series line + panel
        if: always()
        run: python3 scripts/nftt_series.py --check
      - name: Surface catalog covers every next.config.ts host and matches its emitter
        if: always()
        run: python3 scripts/surface_catalog_emit.py --check
      - name: No host catch-all rewrite swallows one of that host's own pages
        if: always()
        run: python3 scripts/rewrite_shadow_check.py --self-test && python3 scripts/rewrite_shadow_check.py

  smoke:
    # arcs-light (2026-11-02 leak audit): smoke starts no server and no Postgres, the only reasons a
    # job stays pinned to the single arcs-mac runner (84f395d4). Pinned, it held arcs-mac 1,000 of
    # 1,139 job-min over 3.6 days and made PR fe-smoke wait up to 66 min behind cancelled main pushes.
    runs-on: [self-hosted, arcs-light]
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    env:
      # Build-time placeholders — no real secrets, no DB connection at build.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      ANTHROPIC_API_KEY: "sk-ant-ci-placeholder"
      AUTH_SECRET: "ci-placeholder-secret"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install
        run: npm ci

      # Hard gate: lint debt cleared 2026-10-06 (0 errors repo-wide; warnings
      # do not fail). Static prototypes and scan fixtures are ignored in
      # eslint.config.mjs.
      - name: Lint
        run: npm run lint

      # Advisory: canon-vs-code drift check (state-sync). Grep-based, narrow
      # assertions only — see scripts/state_sync_check.py. Never blocks; the
      # false-positive risk on a heuristic check isn't worth stopping a merge
      # over. Tighten to a hard gate once its signal is proven over time,
      # same path lint took.
      - name: State-sync drift check (advisory)
        run: python3 scripts/state_sync_check.py
        continue-on-error: true

      # Hard gate: stdlib unit tests (node:test, no framework dep). Covers ygate.ts
      # (ledger YG-005) and the trust-contract section 1 no-anonymous-write regression (TC-004).
      - name: Unit tests
        run: npm run test:unit

      # Hard gate: inline styles only. Blocks className / Tailwind / stray stylesheets
      # from returning to src/ (closes ledger LINT-006).
      - name: className / Tailwind guard
        run: python3 scripts/classname_guard.py

      # Hard gate: trust contract section 2 + privacy analytics claim (closes ledger PL-011).
      # Only Anthropic may see input; track() payloads carry allowlisted ids/enums, never text.
      - name: Purpose-limitation guard
        run: python3 scripts/purpose_guard.py

      # Hard gate — enforcement-parity ledger (ADR-034): audit findings must
      # exit via a mechanism or dated waiver within their severity SLA.
      - name: Ledger delinquency check
        run: python3 scripts/ledger_check.py

      # NOTE: the informativeness ratchet lives in its own workflow
      # (.github/workflows/informativeness.yml), because THIS workflow is
      # currently disabled — its step here would never run. Do not re-add it here
      # without re-enabling ci.yml.

      # Hard gate — the build is also the typecheck.
      - name: Build (typecheck + compile)
        run: npm run build

  fe-smoke:
    runs-on: [self-hosted, arcs-mac]
    needs: [changes, smoke]
    # Cost gate (2026-10-07): the PR already passed fe-smoke before it merged, so the push to
    # main does not pay for it again (it was the longest job). smoke (lint + unit + build) still
    # runs on push as the cheap post-merge check.
    if: needs.changes.outputs.code_changed == 'true' && github.event_name == 'pull_request'
    # Real Postgres, not a placeholder URL: ClaimAnonymousReceipts (root
    # layout) fetches /api/auth/session on every page, which goes through the
    # Prisma adapter to the DB — with an unreachable DATABASE_URL every route
    # logs a 500 and the console-error assertion fails. An ephemeral service
    # container keeps the smoke honest instead of muting the assertion.
    env:
      DATABASE_URL: "postgresql://postgres:ci@127.0.0.1:55432/arcs"
      ANTHROPIC_API_KEY: "sk-ant-ci-placeholder"
      AUTH_SECRET: "ci-placeholder-secret"
      # Auth.js v5 refuses non-Vercel hosts without this — /api/auth/session
      # 500s on every page (root layout probes it via ClaimAnonymousReceipts).
      AUTH_TRUST_HOST: "true"
    steps:
      - name: Start Postgres (docker; service containers are Linux-runner only)
        run: |
          # -v, --rm and tmpfs data (2026-11-02 leak audit): postgres declares a VOLUME, so each plain
          # `docker rm -f` orphaned an anonymous volume (94 left, 6 to 16 a day). tmpfs writes no volume.
          docker rm -fv arcs-ci-pg-ci 2>/dev/null || true
          docker run -d --rm --name arcs-ci-pg-ci --tmpfs /var/lib/postgresql/data -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=arcs -p 55432:5432 postgres:16
          for i in $(seq 1 40); do docker exec arcs-ci-pg-ci pg_isready -h 127.0.0.1 -U postgres && exit 0; sleep 2; done; exit 1
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }  # page gate needs the merge-base

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Apply schema to ephemeral Postgres
        run: npx prisma db push

      - name: Install Playwright browsers
        run: npx playwright install chromium

      # Real eval, not a placeholder: builds the app, boots it, and drives
      # tests/smoke.spec.ts (route loads, no console errors, real content
      # renders) against the actual server — not mocked. Hard gate: a broken
      # route or a thrown console error blocks the merge.
      - name: Build
        run: npm run build

      # The arcs-mac runner is self-hosted and persistent: a cancelled or interrupted
      # run leaves its `npm run start` server listening on :3000 (found 2026-10-20,
      # orphan 5.5h old; the next run tested the stale server and timed out).
      - name: Free port 3000 (stale server from an earlier run)
        run: |
          pids=$(lsof -ti tcp:3000 -sTCP:LISTEN || true)
          if [ -n "$pids" ]; then echo "killing stale listener(s): $pids"; kill $pids || true; sleep 2; fi

      - name: Start server + wait for it to bind
        run: |
          npm run start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null && exit 0
            sleep 1
          done
          echo "server never came up" && exit 1

      # Forge resumes / covers and _ARTIFACTS/resume-*/ cuts are fixed 8.5in print pages (always 'overflow' a phone viewport); they are gated by
      # kintsugi + 2-page + location checks instead.
      # Every page this PR adds or changes must pass the full page gate, render checks
      # included (overflow at 375/790/1280, lede spans the heading's lane). Legacy pages
      # are gated when they are next touched, not all at once.
      - name: Page gate on changed pages
        if: github.event_name == 'pull_request'
        run: |
          # Three-dot (merge-base) diff against the PR head: only the PR's own changes.
          # A two-dot diff vs HEAD also picked up every page main changed since the
          # branch point (PR #802 failed 0/92 on pages it never touched).
          git fetch --no-tags origin ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
          files=$(git diff --name-only --diff-filter=AM ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} -- 'public/*.html' '_PROPOSALS/*.html' '_ARTIFACTS/*.html' ':(exclude)_ARTIFACTS/forge-*/resume-*.html' ':(exclude)_ARTIFACTS/forge-*/cover-*.html' ':(exclude)_ARTIFACTS/resume-*/*.html')
          if [ -z "$files" ]; then echo "no pages changed"; exit 0; fi
          python3 scripts/page_gate.py $files

      - name: FE smoke (Playwright)
        # a11y ratchet scope (2026-10-11, #1046): only the served pages this PR changed. Shared CSS or a
        # change to the ratchet's own inputs runs the full sweep; the nightly a11y-nightly.yml always does.
        run: |
          files=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }})
          if echo "$files" | grep -qE '\.css$|^src/ui-kit/|^tests/a11y-served\.spec\.ts$|^runtime/specs/(a11y-baseline|surface-catalog)\.json$|^package(-lock)?\.json$|^playwright\.config\.'; then
            echo "a11y ratchet: shared CSS or ratchet inputs changed -> full sweep"
          else
            export A11Y_PAGES="$(echo "$files" | grep '\.html$' || true)"
            echo "a11y ratchet: scoped to $(echo "$A11Y_PAGES" | grep -c . || true) changed page(s)"
          fi
          npm run test:smoke
        env:
          SMOKE_BASE_URL: "http://localhost:3000"

      - name: Stop server
        if: always()
        run: |
          pids=$(lsof -ti tcp:3000 -sTCP:LISTEN || true)
          if [ -n "$pids" ]; then kill $pids || true; fi

      - name: Stop Postgres
        if: always()
        run: docker rm -fv arcs-ci-pg-ci 2>/dev/null || true
