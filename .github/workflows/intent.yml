name: intent
# Checks this repo's AGENTS.md intent block. Rule + script: flashesofbrilliance/arcs-skills.
on:
  # Cost gate (2026-10-06): 48 of the last 100 runs were this check, mostly on PRs that never touch
  # AGENTS.md. The weekly schedule below still catches a repo going stale with no commit.
  push: { branches: [main], paths: ["AGENTS.md", ".github/workflows/intent.yml"] }
  pull_request: { paths: ["AGENTS.md", ".github/workflows/intent.yml"] }
  schedule: [{ cron: "23 13 * * 1" }]   # weekly: a repo goes stale without any commit
  workflow_dispatch: {}
concurrency:
  group: intent-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  intent:
    if: github.event.pull_request.draft != true
    # Inlined from arcs-skills intent-lint.yml: its runs-on is ubuntu-latest, which a reusable-workflow
    # caller cannot override (hosted, billed). Script comes from the public arcs-skills repo.
    runs-on: [self-hosted, arcs-light]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: flashesofbrilliance/arcs-skills
          ref: main
          path: .intent-lint
          sparse-checkout: tools
      - run: python3 .intent-lint/tools/intent_lint.py . --max-age 90
