[project]
name = "arcs-sage-service"
version = "9.0.0"
description = "ARCS v9 SAGE/LAB/BAR/Court/Kintsugi pipeline — advisory pre-screen for the Question Compass route"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "numpy>=2.0",
    "scipy>=1.13",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
supabase = ["supabase>=2.7"]
embeddings = ["sentence-transformers>=3.0"]
mcp = ["mcp>=2"]  # arcs_mcp_bridge.py (Claude Code stdio bridge); py>=3.10
