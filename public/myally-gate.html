<style>/* ARCS Recoil Report — Design Tokens */
:root {
  /* Surface */
  --bg:        #020408;
  --surface:   #0d1117;
  --surface-2: #121820;
  --border:    #1e293b;

  /* Text */
  --text:      #e2e8f0;
  --muted:     #7a8699;
  --dimmed:    #8391a7;

  /* Signal */
  --cyan:      #00F0FF;
  --green:     #00FF9D;
  --gold:      #FFD700;
  --red:       #FF4D6D;

  /* Signal backgrounds (5% opacity) */
  --cyan-bg:   rgba(0, 240, 255, 0.07);
  --green-bg:  rgba(0, 255, 157, 0.07);
  --gold-bg:   rgba(255, 215,   0, 0.07);
  --red-bg:    rgba(255,  77, 109, 0.07);

  /* Glow — dialed down 2026-07-19: blur 12px→8px, inner double-glow layer
     dropped, outer alpha 0.35→0.22. The prior stacked bloom read as too hot. */
  --cyan-glow:  0 0 5px rgba(0,240,255,0.22);
  --green-glow: 0 0 5px rgba(0,255,157,0.22);
  --red-glow:   0 0 5px rgba(255,77,109,0.22);

  /* Radius */
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 12px;

  /* Font stacks */
  --font-mono:  'GeistMono', 'JetBrains Mono', 'IBM Plex Mono', monospace;
  --font-sans:  'InstrumentSans', 'Work Sans', system-ui, sans-serif;
  --font-display: 'BricolageGrotesque', 'Work Sans', system-ui, sans-serif;
}

:root{--measure:620px;--gut:24px;--font-body:system-ui,-apple-system,'Inter',sans-serif;--font-code:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;--font-head:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;color-scheme:light;--pg-bg:#f7f8fa;--pg-surface:#ffffff;--pg-surface2:#eef1f5;--pg-line:#d5dbe3;--pg-edge:#76808d;--pg-text:#1c2430;--pg-muted:#566170;--pg-dim:#475262;--pg-accent:#00606b;--pg-accent-bg:rgba(0,96,107,0.09);--pg-warn-bg:#fff3c4;--pg-warn-edge:#8a6d00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--pg-bg:var(--bg);--pg-surface:var(--surface);--pg-surface2:#111827;--pg-line:var(--border);--pg-edge:#5f6f87;--pg-text:var(--text);--pg-muted:var(--muted);--pg-dim:var(--dimmed);--pg-accent:var(--cyan);--pg-accent-bg:var(--cyan-bg);--pg-warn-bg:var(--gold-bg);--pg-warn-edge:var(--gold)}}
:root[data-theme="dark"]{color-scheme:dark;--pg-bg:var(--bg);--pg-surface:var(--surface);--pg-surface2:#111827;--pg-line:var(--border);--pg-edge:#5f6f87;--pg-text:var(--text);--pg-muted:var(--muted);--pg-dim:var(--dimmed);--pg-accent:var(--cyan);--pg-accent-bg:var(--cyan-bg);--pg-warn-bg:var(--gold-bg);--pg-warn-edge:var(--gold)}
:root[data-theme="light"]{color-scheme:light;--pg-bg:#f7f8fa;--pg-surface:#ffffff;--pg-surface2:#eef1f5;--pg-line:#d5dbe3;--pg-edge:#76808d;--pg-text:#1c2430;--pg-muted:#566170;--pg-dim:#475262;--pg-accent:#00606b;--pg-accent-bg:rgba(0,96,107,0.09);--pg-warn-bg:#fff3c4;--pg-warn-edge:#8a6d00}
*{box-sizing:border-box}

.slider input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--pg-bg),0 0 0 5px var(--pg-accent)}

.quicksteps a{display:inline-flex;align-items:center;min-height:44px;padding:0 10px;border:1px solid var(--pg-edge);border-radius:6px;margin:4px 0;color:var(--pg-text);text-decoration:none;background:var(--pg-surface)}
.quicksteps a:hover{border-color:var(--pg-accent);color:var(--pg-accent)}
.termwrap{position:relative;display:inline}

@media (hover:hover) and (pointer:fine){.termwrap:not(.pinned) .tiphint{display:block}}

html[data-font="easy"]{--font-body:Verdana,Tahoma,'Trebuchet MS',Arial,sans-serif}

html[data-size="xl"]{font-size:125%;--measure:780px}
html[data-space="roomy"] :is(p,li,dd,dt,td,th,.dek,.lbl,.c,.altdesc,.tip){line-height:1.8;letter-spacing:.04em;word-spacing:.14em}

@media (prefers-color-scheme: light){html[data-tone="warm"]:not([data-theme="dark"]){--pg-bg:#fbf6e9;--pg-surface:#fffdf6;--pg-surface2:#f3ecda}}

  .slider input[type=range]::-moz-range-thumb{background:Highlight;border:2px solid CanvasText}
  .slider input[type=range]::-webkit-slider-runnable-track,.slider input[type=range]::-moz-range-track{background:CanvasText}
  .tick{background:CanvasText}
  a.gl{text-decoration:underline}

}
.scope{margin:16px 0}
.scopebar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 8px}
.scopebar button{font:inherit;color:var(--pg-text);background:var(--pg-surface);border:1px solid var(--pg-edge);border-radius:6px;padding:0 14px;min-height:44px;cursor:pointer}

.scope.js[data-case="best"] .c-base,.scope.js[data-case="best"] .c-worst,.scope.js[data-case="base"] .c-best,.scope.js[data-case="base"] .c-worst,.scope.js[data-case="worst"] .c-best,.scope.js[data-case="worst"] .c-base{display:none}
a:focus-visible,button:focus-visible,.tablewrap:focus-visible{outline:2px solid var(--pg-accent);outline-offset:2px}

<style>
.gate{max-width:420px;margin:15vh auto 0;padding:24px;background:var(--pg-surface);border:1px solid var(--pg-line);border-radius:6px}
.gate h1{font-size:1.5rem;margin:0 0 8px}
.gate p{margin:0 0 16px;color:var(--pg-muted)}
.gate label{display:block;margin-bottom:6px;color:var(--pg-dim)}
.gate input{box-sizing:border-box;width:100%;min-height:44px;font:inherit;color:var(--pg-text);background:var(--pg-bg);border:1px solid var(--pg-edge);border-radius:6px;padding:8px 12px}
.gate button{width:100%;min-height:44px;margin-top:14px;font:inherit;font-weight:700;color:var(--pg-surface);background:var(--pg-accent);border:0;border-radius:6px;cursor:pointer}
.gate input:focus-visible,.gate button:focus-visible{outline:3px solid var(--pg-accent);outline-offset:2px}
#msg{min-height:24px;margin:12px 0 0}
</style>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<main class="gate">
  <h1>My Ally LD</h1>
  <p>This page is private. Enter the passcode to continue.</p>
  <form id="f" autocomplete="off">
    <label for="code">Passcode</label>
    <input id="code" name="code" type="password" required autofocus>
    <button type="submit">Open</button>
    <p id="msg" role="status" aria-live="polite"></p>
  </form>
</main>
<script>
(function () {
  var f = document.getElementById('f'), m = document.getElementById('msg');
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var code = document.getElementById('code').value.trim();
    if (!code) return;
    m.textContent = 'Checking...';
    fetch('/api/myally/unlock', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ passcode: code }) })
      .then(function (r) {
        if (r.ok) { m.textContent = 'Unlocked. Opening...'; window.location.href = '/'; return; }
        m.textContent = r.status === 503 ? 'The gate is not set up yet. Please tell Zach.' : 'That passcode did not match. Try again.';
      })
      .catch(function () { m.textContent = 'Could not reach the server. Try again.'; });
  });
})();
</script>
</body>
