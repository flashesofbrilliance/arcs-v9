<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saul Miller · Resume bundle</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{--bg:#F4F6F2;--fg:#1A2129;--fg3:#66707A;--border:#D9DED8;--elev:#fff;--accent:#D8552B;--depth:#2E6F6A;--mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif}
  @media (prefers-color-scheme:dark){:root{--bg:#12171C;--fg:#E9ECEA;--fg3:#7F8A94;--border:#2C343C;--elev:#1A2028;--accent:#F0774C;--depth:#5FB3AB}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%} body{background:var(--bg);color:var(--fg);font-family:var(--sans);display:flex;flex-direction:column}
  .bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:11px 18px;background:var(--bg);border-bottom:1px solid var(--border)}
  .who{font-family:var(--mono);font-size:12.5px;letter-spacing:.02em;white-space:nowrap}.who b{color:var(--accent);font-weight:500}
  .btns{display:flex;gap:9px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;padding:9px 14px;border-radius:6px;border:1px solid var(--border);background:var(--elev);color:var(--fg);text-decoration:none}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.p{background:var(--depth);border-color:var(--depth);color:#fff}.btn.p:hover{color:#fff;opacity:.92}
  .back{font-family:var(--mono);font-size:11.5px;color:var(--fg3);text-decoration:none;white-space:nowrap}.back:hover{color:var(--accent)}
  .note{padding:10px 18px;font-family:var(--mono);font-size:11px;color:var(--fg3);border-bottom:1px solid var(--border)}
  .note b{color:var(--accent);font-weight:500}
  .frame{flex:1 1 auto;border:none;width:100%;min-height:0;background:#525659}
</style>

<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="bar">
    <a class="back" href="/">◀ prep</a>
    <span class="who"><b>◆</b> Saul Miller · Resume bundle · Starpilot</span>
    <div class="btns">
      <a class="btn p" href="/saul-resume.pdf" download="Saul-Miller-Resume.pdf">↓ Resume PDF</a>
      <a class="btn" href="/saul-cover.pdf" download="Saul-Miller-Cover-Letter-Starpilot.pdf">↓ Cover letter (draft)</a>
      <a class="btn" href="/saul-resume-ats.txt" download="Saul-Miller-Resume-ATS.txt">↓ ATS text</a>
      <a class="btn" href="/followup">Follow-up →</a>
    </div>
  </div>
  <div class="note"><b>Draft bundle.</b> Built from your LinkedIn profile only. The cover letter has three orange slots that need your real numbers before anything is sent. Nothing here invents a figure.</div>
  <iframe class="frame" src="/saul-resume.pdf#view=FitH" title="Saul Miller resume (PDF)"></iframe>
</body>
</html>
