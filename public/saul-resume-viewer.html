  :root{--bg:#F4F6F2;--fg:#1A2129;--fg3:#66707A;--border:#D9DED8;--elev:#fff;--accent:#b34623;--depth:#2E6F6A;--mono:'IBM Plex Mono','IBM Plex Mono Fallback',ui-monospace,monospace;--sans:'IBM Plex Sans','IBM Plex Sans Fallback',system-ui,sans-serif}
  @media (prefers-color-scheme:dark){:root{--bg:#12171C;--fg:#E9ECEA;--fg3:#7F8A94;--border:#2C343C;--elev:#1A2028;--accent:#F0774C;--depth:#5FB3AB}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%} body{background:var(--bg);color:var(--fg);font-family:var(--sans);display:flex;flex-direction:column}
  .bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:11px 18px;background:var(--bg);border-bottom:1px solid var(--border)}
  .who{font-family:var(--mono);font-size:12.5px;letter-spacing:.02em;white-space:nowrap}.who b{color:var(--accent);font-weight:500}
  .btns{display:flex;gap:9px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;padding:9px 14px;border-radius:6px;border:1px solid var(--border);background:var(--elev);color:var(--fg);text-decoration:none}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.p{background:var(--depth);border-color:var(--depth);color:#fff}.btn.p:hover{color:#fff;opacity:.92}
  .back{font-family:var(--mono);font-size:11.5px;color:var(--fg3);text-decoration:none;white-space:nowrap}.back:hover{color:var(--accent)}
  .note{padding:10px 18px;font-family:var(--mono);font-size:11px;color:var(--fg3);border-bottom:1px solid var(--border)}
  .note b{color:var(--accent);font-weight:500}
  .frame{flex:1 1 auto;border:none;width:100%;min-height:0;background:#525659}
</style>
