<style>
/* ARCS Recoil Report — Design Tokens */
:root {
  /* Surface */
  --bg:        #020408;
  --surface:   #0d1117;
  --surface-2: #121820;
  --border:    #1e293b;

  /* Text */
  --text:      #e2e8f0;
  --muted:     #7a8699;
  --dimmed:    #8391a7;

  /* Signal */
  --cyan:      #00F0FF;
  --green:     #00FF9D;
  --gold:      #FFD700;
  --red:       #FF4D6D;

  /* Signal backgrounds (5% opacity) */
  --cyan-bg:   rgba(0, 240, 255, 0.07);
  --green-bg:  rgba(0, 255, 157, 0.07);
  --gold-bg:   rgba(255, 215,   0, 0.07);
  --red-bg:    rgba(255,  77, 109, 0.07);

  /* Glow — dialed down 2026-07-19: blur 12px→8px, inner double-glow layer
     dropped, outer alpha 0.35→0.22. The prior stacked bloom read as too hot. */
  --cyan-glow:  0 0 5px rgba(0,240,255,0.22);
  --green-glow: 0 0 5px rgba(0,255,157,0.22);
  --red-glow:   0 0 5px rgba(255,77,109,0.22);

  /* Radius */
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 12px;

  /* Font stacks */
  --font-mono:  'GeistMono', 'JetBrains Mono', 'IBM Plex Mono', monospace;
  --font-sans:  'InstrumentSans', 'Work Sans', system-ui, sans-serif;
  --font-display: 'BricolageGrotesque', 'Work Sans', system-ui, sans-serif;
}

  :root {
    --bg:#020408;--surface:#0d1117;--surface-2:#121820;--border:#1e293b;--text:#e2e8f0;
    --muted:#7a8699;--dimmed:#8391a7;--cyan:#00F0FF;--green:#00FF9D;--gold:#FFD700;--red:#FF4D6D;
    --font-mono:'GeistMono','JetBrains Mono','IBM Plex Mono',monospace;
    --font-sans:'InstrumentSans','Work Sans',system-ui,sans-serif;
  }
  :root{--fg:var(--text);--fg3:#94a3b8;--border2:var(--border);--elev:var(--surface);--mono:var(--font-mono);--sans:var(--font-sans);}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;} body{background:var(--bg);color:var(--fg);font-family:var(--sans);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
  .eyebrow{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:11px 18px;background:rgba(2,4,8,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
  .who{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap;} .who .g{color:var(--cyan);}
  .btns{display:flex;gap:9px;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.02em;
    padding:9px 14px;border-radius:6px;border:1px solid var(--border2);background:var(--elev);color:var(--fg);text-decoration:none;transition:.15s;cursor:pointer;}
  .btn:hover{border-color:var(--cyan);color:var(--cyan);}
  .btn.p{color:var(--bg);background:var(--cyan);border:1px solid var(--cyan);}
  .btn.p:hover{color:var(--bg);filter:brightness(1.06);}
  .frame{flex:1 1 auto;border:none;width:100%;min-height:0;background:var(--surface);}
  .fallback{padding:16px 18px;font-family:var(--mono);font-size:12px;color:var(--fg3);}
  .fallback a{color:var(--cyan);}
</style>
