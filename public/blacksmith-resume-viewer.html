<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zach Harris · Résumé</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/blacksmith-favicon.png">
<style>
  @font-face{font-family:'Inter';font-style:normal;font-weight:400 800;font-display:swap;src:url('/fonts/inter.woff2') format('woff2');}
  @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400 700;font-display:swap;src:url('/fonts/jbmono.woff2') format('woff2');}
  :root{--bg:#020408;--fg:#eff4fa;--fg3:#a3b4c6;--border:#1e2c3a;--border2:#26374a;--elev:#0e141d;--cyan:#00F0FF;
    --mono:'JetBrains Mono',ui-monospace,monospace;--sans:'Inter',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;} body{background:var(--bg);color:var(--fg);font-family:var(--sans);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
  .eyebrow{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:11px 18px;background:rgba(2,4,8,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
  .who{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;} .who .g{color:var(--cyan);}
  .btns{display:flex;gap:9px;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.02em;
    padding:9px 14px;border-radius:8px;border:1px solid var(--border2);background:var(--elev);color:var(--fg);text-decoration:none;transition:.15s;cursor:pointer;}
  .btn:hover{border-color:var(--cyan);color:var(--cyan);}
  .btn.p{color:#001014;background:linear-gradient(100deg,var(--cyan),#00c8dd);border:none;}
  .btn.p:hover{color:#001014;transform:translateY(-1px);}
  .back{font-family:var(--mono);font-size:11.5px;color:var(--fg3);text-decoration:none;white-space:nowrap;} .back:hover{color:var(--cyan);}
  .frame{flex:1 1 auto;border:none;width:100%;min-height:0;background:#525659;}
  .fallback{padding:16px 18px;font-family:var(--mono);font-size:11.5px;color:var(--fg3);}
  .fallback a{color:var(--cyan);}
</style>
</head>
<body>
  <div class="eyebrow">
    <a class="back" href="/">&#9664; back to the bundle</a>
    <span class="who"><span class="g">&#9670;</span> Zach Harris &middot; Résumé</span>
    <div class="btns">
      <a class="btn p" href="/blacksmith-resume.pdf" download="Zach-Harris-Resume.pdf">&#8595; R&eacute;sum&eacute; PDF</a>
      <a class="btn" href="/blacksmith-cover.pdf" download="Zach-Harris-Cover-Letter.pdf">&#8595; Cover letter</a>
      <a class="btn" href="/blacksmith-resume-ats.txt" download="Zach-Harris-Resume-ATS.txt">&#8595; ATS text</a>
    </div>
  </div>
  <iframe class="frame" src="/blacksmith-resume.pdf#view=FitH" title="Zach Harris resume (PDF)"></iframe>
  <noscript class="fallback">View the <a href="/blacksmith-resume.pdf">PDF résumé</a> or the <a href="/blacksmith-resume-ats.txt">ATS text version</a>.</noscript>
</body>
</html>
