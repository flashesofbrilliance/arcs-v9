<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zach Harris — Resume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: #020408; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; }
    body { min-height: 100vh; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    @keyframes arcs-shimmer { 0%{transform:translateX(-100%)} 60%,100%{transform:translateX(220%)} }
    @keyframes fadeUp       { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
    @keyframes slideDown    { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:none} }

    [data-shimmer]{ animation: arcs-shimmer 1.6s ease-in-out infinite; }

    .page { max-width: 860px; margin: 0 auto; padding: 36px 24px 100px; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #0d1117; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }

    /* ── Print / PDF export ───────────────────────────────────────── */
    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      .no-print { display: none !important; }
      .page { max-width: 100%; padding: 0.5in 0.6in; }
      a { text-decoration: none !important; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── useMobile hook — shared across all components ─────────────────────────────
function useMobile(bp=768) {
  const [m, setM] = useState(() => typeof window !== 'undefined' && window.innerWidth <= bp);
  useEffect(() => {
    const mq = window.matchMedia(`(max-width:${bp}px)`);
    setM(mq.matches);
    const h = e => setM(e.matches);
    mq.addEventListener('change', h);
    return () => mq.removeEventListener('change', h);
  }, [bp]);
  return m;
}

// ── Tokens ───────────────────────────────────────────────────────────────────
const T = {
  bg:'#020408', surface:'#0d1117', elev:'#111827', border:'#1e293b',
  fg1:'#e2e8f0', fg2:'#94a3b8', fg3:'#8593a6', fg4:'#707e92',
  cyan:'#00F0FF', green:'#00FF9D', gold:'#FFD700', red:'#FF4D6D',
  violet:'#A78BFA', steel:'#94a3b8',
  sans:"'Inter',system-ui,sans-serif", mono:"'JetBrains Mono','IBM Plex Mono',monospace",
};

// ── Depth config ─────────────────────────────────────────────────────────────
// GRAIN = Simple / SHARP = Rich / SUPERIONIC = Deep
const DEPTHS = [
  { value:'grain',      label:'SKETCH',        accent:'steel',  desc:'ATS-ready · printable · essential signal only' },
  { value:'sharp',      label:'WIREFRAME',     accent:'cyan',   desc:'Full interactive resume · expandable roles · live skills filter' },
  { value:'superionic', label:'PIXEL PERFECT', accent:'green',  desc:'Resume + deep profile · strengths · role fit' },
];

const FOCUS_VIEWS = [
  { value:'all',   label:'FULL',        accent:'cyan' },
  { value:'figma', label:'FIGMA DS',    accent:'green' },
  { value:'ds',    label:'DATA',        accent:'gold' },
];

// ── Atoms ────────────────────────────────────────────────────────────────────
function SectionLabel({ index, children, color=T.fg4, style }) {
  return (
    <div style={{ display:'flex', alignItems:'baseline', gap:10, ...style }}>
      {index && <span style={{ fontFamily:T.mono, fontSize:10, fontWeight:700, color:T.cyan, letterSpacing:'0.1em' }}>{index}</span>}
      <span style={{ fontFamily:T.mono, fontSize:10, fontWeight:700, letterSpacing:'0.14em', textTransform:'uppercase', color }}>{children}</span>
    </div>
  );
}
function Rule({ color=T.border, style }) { return <div style={{ height:1, background:color, ...style }} />; }

// ── Depth selector (the volume wheel) ────────────────────────────────────────
function DepthWheel({ value, onChange }) {
  const idx = DEPTHS.findIndex(d => d.value === value);
  const current = DEPTHS[idx];
  const accentMap = { steel:T.steel, cyan:T.cyan, green:T.green };
  const accent = accentMap[current.accent];

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:8, padding:'16px 18px', borderRadius:14,
      border:`1px solid ${accent}30`,
      background:`linear-gradient(160deg,rgba(255,255,255,.04),rgba(0,0,0,.18)), linear-gradient(165deg,${accent}0c,#080c10)`,
      boxShadow:`inset 0 1px 0 ${accent}22, 0 4px 14px rgba(0,0,0,.5)` }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        <div style={{ display:'flex', gap:6, alignItems:'center' }}>
          <span style={{ fontFamily:T.mono, fontSize:9, color:T.fg4, letterSpacing:'0.12em', textTransform:'uppercase' }}>RENDER DEPTH</span>
          <span style={{ fontFamily:T.mono, fontSize:9, fontWeight:700, color:accent, letterSpacing:'0.08em', textShadow:`0 0 8px ${accent}66` }}>{current.label}</span>
        </div>
        <span style={{ fontFamily:T.sans, fontSize:11, color:T.fg3 }}>{current.desc}</span>
      </div>
      {/* Track */}
      <div style={{ position:'relative', display:'flex', alignItems:'center', gap:0 }}>
        {/* Track line */}
        <div style={{ position:'absolute', left:12, right:12, height:2, borderRadius:1,
          background:`linear-gradient(90deg, ${T.steel}44, ${T.cyan}44, ${T.green}44)` }} />
        {/* Progress fill */}
        <div style={{ position:'absolute', left:12, height:2, borderRadius:1,
          width:`calc(${idx * 50}% - ${idx===0?0:0}px)`,
          background:`linear-gradient(90deg, ${T.steel}, ${accent})`,
          boxShadow:`0 0 6px ${accent}`, transition:'width .3s ease' }} />
        {/* Nodes */}
        {DEPTHS.map((d,i) => {
          const ac = accentMap[d.accent];
          const active = i <= idx;
          return (
            <div key={d.value} onClick={() => onChange(d.value)}
              style={{ position:'relative', zIndex:2, flex:1, display:'flex', flexDirection:'column', alignItems: i===0?'flex-start':i===2?'flex-end':'center', gap:8, cursor:'pointer' }}>
              <div style={{ width:20, height:20, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center',
                border:`2px solid ${active ? ac : T.border}`,
                background: active ? `${ac}22` : T.surface,
                boxShadow: i===idx ? `0 0 12px ${ac}66, inset 0 0 6px ${ac}22` : 'none',
                transition:'all .2s', animation: i===idx ? 'scanPulse 2s ease-in-out infinite' : 'none' }}>
                <div style={{ width:6, height:6, borderRadius:'50%', background: active ? ac : T.border, transition:'background .2s' }} />
              </div>
              <span style={{ fontFamily:T.mono, fontSize:8.5, fontWeight:700, letterSpacing:'0.1em',
                color: active ? ac : T.fg4, transition:'color .2s' }}>{d.label}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── Segmented slider ──────────────────────────────────────────────────────────
const SEG_A = {
  steel:{ bd:`${T.steel}55`, bloom2:`${T.steel}22`, ink:T.fg2 },
  cyan: { bd:`${T.cyan}55`,  bloom2:`${T.cyan}2b`,  ink:'#b9e8f4' },
  green:{ bd:`${T.green}55`, bloom2:`${T.green}33`, ink:'#bdf2dc' },
  gold: { bd:`${T.gold}55`,  bloom2:`${T.gold}2b`,  ink:'#f0e4ba' },
};
function SegSlider({ options, value, onChange, style }) {
  const idx = Math.max(0, options.findIndex(o => o.value === value));
  const a = SEG_A[options[idx]?.accent] || SEG_A.cyan;
  return (
    <div style={{ position:'relative', display:'grid', gridTemplateColumns:`repeat(${options.length},1fr)`,
      padding:5, borderRadius:10,
      background:'linear-gradient(180deg,#090d12,#0c1219)',
      boxShadow:'inset 0 2px 6px rgba(0,0,0,.7), inset 0 -1px 0 rgba(255,255,255,.04)', ...style }}>
      <div style={{ position:'absolute', top:5, bottom:5, left:5, width:`calc((100% - 10px) / ${options.length})`,
        borderRadius:7, transform:`translateX(${idx*100}%)`, transition:'transform .22s cubic-bezier(.4,0,.2,1)',
        border:`1px solid ${a.bd}`, background:'linear-gradient(180deg,#0d141c,#0f1822)',
        boxShadow:`inset 0 2px 4px rgba(0,0,0,.5), inset 0 -7px 11px -7px ${a.bloom2}` }} />
      {options.map((o,i) => (
        <button key={o.value} type="button" onClick={() => onChange(o.value)}
          style={{ position:'relative', zIndex:1, background:'transparent', border:'none', padding:'8px 0',
            fontFamily:T.mono, fontWeight:700, fontSize:10, letterSpacing:'0.05em',
            color: i===idx ? a.ink : T.fg4, transition:'color .18s' }}>
          {o.label}
        </button>
      ))}
    </div>
  );
}

// ── Chip — governance tag shape: full pill, mono, no glyph ───────────────────
function Chip({ label, selected, accent=T.green, dim=false }) {
  const [h,setH] = useState(false);
  return (
    <div onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)}
      style={{ display:'inline-flex', alignItems:'center',
        padding:'4px 11px', borderRadius:999, lineHeight:1,
        fontFamily:T.mono, fontSize:9, fontWeight:700, letterSpacing:'0.07em',
        textTransform:'uppercase', cursor:'default',
        opacity: dim ? 0.28 : 1,
        color: selected ? accent : h ? T.fg2 : T.fg4,
        border:`1px solid ${selected ? `${accent}55` : h ? `${accent}28` : 'rgba(255,255,255,.09)'}`,
        background: selected
          ? `linear-gradient(180deg,${accent}0e,transparent), linear-gradient(180deg,#0d141c,#0a1016)`
          : 'linear-gradient(180deg,#0c121a,#0a0f16)',
        boxShadow: selected
          ? `inset 0 1px 0 rgba(255,255,255,.09), 0 0 8px ${accent}1e`
          : `inset 0 1px 0 rgba(255,255,255,.06)`,
        transition:'all .15s' }}>
      {label}
    </div>
  );
}

// ── WeatherBar ────────────────────────────────────────────────────────────────
function WeatherBar({ icon, label, color, right, style }) {
  return (
    <div style={{ position:'relative', overflow:'hidden', display:'flex', alignItems:'center',
      justifyContent:'space-between', padding:'10px 16px', borderRadius:10,
      border:`1px solid ${color}3d`,
      background:`linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01) 38%,rgba(0,0,0,.18)), linear-gradient(165deg,${color}1a,#0a1418)`,
      boxShadow:`inset 0 1px 0 ${color}55, inset 0 -9px 14px -9px ${color}35, 0 0 10px ${color}18`, ...style }}>
      <div style={{ position:'absolute', inset:'0 0 auto 0', height:'46%', background:'linear-gradient(rgba(255,255,255,.06),rgba(255,255,255,0))', pointerEvents:'none' }} />
      <div style={{ position:'relative', display:'flex', alignItems:'center', gap:10 }}>
        <span style={{ color, fontWeight:700, fontSize:14, textShadow:`0 0 7px ${color}aa` }}>{icon}</span>
        <span style={{ fontFamily:T.mono, fontSize:10, letterSpacing:'0.1em', color, textTransform:'uppercase', fontWeight:700 }}>{label}</span>
      </div>
      {right && <div style={{ position:'relative', fontFamily:T.mono, fontSize:9, color:T.fg3, letterSpacing:'0.06em' }}>{right}</div>}
    </div>
  );
}

// ── TrueNorthPanel ────────────────────────────────────────────────────────────
function TrueNorthPanel({ heading, children, color=T.cyan, style }) {
  const m = useMobile();
  return (
    <div style={{ position:'relative', overflow:'hidden', padding: m ? '0.75rem 1rem' : '1.1rem 1.4rem', borderRadius:12,
      border:`1px solid ${color}3a`,
      background:`linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.01) 38%,rgba(0,0,0,.18)), linear-gradient(165deg,${color}14,#0a1620)`,
      boxShadow:`inset 0 1px 0 ${color}44, inset 0 -11px 17px -11px ${color}30, 0 0 10px ${color}14, 0 4px 14px rgba(0,0,0,.5)`, ...style }}>
      <div style={{ position:'absolute', inset:'0 0 auto 0', height:'42%', background:'linear-gradient(rgba(255,255,255,.06),rgba(255,255,255,0))', pointerEvents:'none' }} />
      <div style={{ position:'relative', fontFamily:T.mono, fontSize:9, color, letterSpacing:'0.12em', textTransform:'uppercase', marginBottom:8, fontWeight:700 }}>{heading}</div>
      <div style={{ position:'relative', fontFamily:T.sans, fontSize: m ? '0.78rem' : '0.9rem', lineHeight:1.6, color:'#ddf4ff', fontWeight:500 }}>{children}</div>
    </div>
  );
}

// ── TribTile — glassmorphism: emboss collapsed, signal float + deboss expanded ──
function TribTile({ label, glyph, color=T.cyan, meta, children, expanded, onClick, style }) {
  const [h,setH] = useState(false);
  const on = !!expanded;
  return (
    <div style={{ borderRadius:10, overflow:'hidden',
      border:`1px solid ${on ? `${color}44` : h ? `${color}30` : `${color}1e`}`,
      // Emboss collapsed → signal underlight expanded
      boxShadow: on
        ? `inset 0 1px 0 rgba(255,255,255,.12), inset 0 -10px 16px -10px ${color}44, 0 0 10px ${color}18, 0 6px 20px rgba(0,0,0,.55)`
        : h
        ? `inset 0 1px 0 rgba(255,255,255,.10), inset 0 -1px 1px rgba(0,0,0,.45), 0 4px 10px rgba(0,0,0,.45)`
        : `inset 0 1px 0 rgba(255,255,255,.08), inset 0 -1px 1px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.45)`,
      transition:'border-color .2s, box-shadow .2s', ...style }}>
      {/* Glass header */}
      <button onClick={onClick} onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)}
        style={{ position:'relative', width:'100%', padding:'12px 14px', textAlign:'left',
          display:'flex', flexDirection:'column', gap:5, border:'none',
          borderBottom: on ? `1px solid ${color}20` : 'none',
          background:`linear-gradient(160deg, rgba(255,255,255,${on?.08:.05}), rgba(255,255,255,.01) 38%, rgba(0,0,0,.20)), linear-gradient(165deg, #131b23, #0b1117)`,
          transition:'background .2s' }}>
        {/* Bevel highlight — top edge shimmer */}
        <div style={{ position:'absolute', top:0, left:0, right:0, height:1, pointerEvents:'none',
          background:`linear-gradient(90deg, transparent 5%, rgba(255,255,255,${on?.14:.09}) 30%, rgba(255,255,255,${on?.14:.09}) 70%, transparent 95%)` }} />
        <div style={{ position:'relative', display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontFamily:T.mono, fontSize:9.5, fontWeight:700, letterSpacing:'0.1em', color, textTransform:'uppercase' }}>
            {glyph && <span style={{ marginRight:5 }}>{glyph}</span>}{label}
          </span>
          <span style={{ marginLeft:'auto', fontFamily:T.mono, fontSize:8.5, color: on ? `${color}99` : T.fg4 }}>{meta}</span>
          <span style={{ color: on ? color : T.fg4, fontSize:8, transition:'color .15s',
            textShadow: on ? `0 0 6px ${color}88` : 'none' }}>{on?'▲':'▼'}</span>
        </div>
        <div style={{ position:'relative', fontFamily:T.sans, fontSize:12.5,
          color: on ? T.fg1 : T.fg2, lineHeight:1.55, transition:'color .15s' }}>{children}</div>
      </button>
      {/* Expanded panel — deboss: pressed into the glass surface */}
      {on && (
        <div style={{ padding:'16px 16px 14px',
          background:'linear-gradient(180deg, #090d13, #0b1119)',
          boxShadow:'inset 0 2px 5px rgba(0,0,0,.65), inset 0 -1px 0 rgba(255,255,255,.04)',
          animation:'slideDown .18s ease both' }}>
          {expanded}
        </div>
      )}
    </div>
  );
}

// ── Progress bar ──────────────────────────────────────────────────────────────
function Bar({ value=0, color=T.cyan, height=5, style }) {
  return (
    <div style={{ width:'100%', height, borderRadius:999, overflow:'hidden',
      background:'linear-gradient(180deg,#090d12,#0c1219)',
      boxShadow:'inset 0 2px 4px rgba(0,0,0,.6)', ...style }}>
      <div style={{ height:'100%', width:`${Math.max(0,Math.min(100,value))}%`, borderRadius:999,
        background:`linear-gradient(90deg,#1ec3d4,${color})`,
        boxShadow:`0 0 8px -1px ${color}, inset 0 1px 0 rgba(255,255,255,.3)`, transition:'width .6s ease' }}>
        <div data-shimmer style={{ position:'absolute', inset:0, borderRadius:999, background:'linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent)', transform:'translateX(-100%)' }} />
      </div>
    </div>
  );
}

// ── Steps — used in DeepScan pipeline visualization ──────────────────────────
function Steps({ labels, current }) {
  return (
    <div>
      <div style={{ display:'flex', gap:4 }}>
        {labels.map((_,i) => {
          const done=i<current, now=i===current;
          return <div key={i}  style={{ flex:1, height:4, borderRadius:3,
            background: done?`linear-gradient(90deg,#1ec3d4,${T.cyan})`:now?`linear-gradient(90deg,#0a4a52,${T.cyan})`:'linear-gradient(180deg,#0a0f15,#0d141c)',
            boxShadow: done?`0 0 7px -2px ${T.cyan}`:'inset 0 1px 2px rgba(0,0,0,.6)', transition:'background .3s' }} />;
        })}
      </div>
      <div style={{ display:'flex', justifyContent:'space-between', fontFamily:T.mono, fontSize:8, color:T.fg4, letterSpacing:'0.05em', marginTop:5 }}>
        {labels.map((l,i) => <span key={l} style={{ color:i===current?T.cyan:i<current?T.fg2:T.fg4, fontWeight:i===current?700:400 }}>{l}</span>)}
      </div>
    </div>
  );
}

// ── Role tab bar — ARCS / GRAYSCALE / CTF / WTA / CONSULTING ─────────────────
function RoleTabs({ selectedNode, onSelect, onSelectClient, consultingOpen, onConsultingToggle }) {
  const [hovered, setHovered] = useState(null);
  return (
    <div style={{ display:'flex', alignItems:'stretch', borderBottom:`1px solid ${T.border}` }}>
      {/* FT role tabs */}
      {TRAJ.map(n => {
        const role  = ROLES.find(r => r.id === n.roleId);
        const color = role?.color || T.steel;
        const active = selectedNode === n.id;
        const hot    = hovered === n.id;
        return (
          <button key={n.id} type="button"
            onClick={() => { onSelectClient(null); onSelect(active ? null : n.id); if (consultingOpen) onConsultingToggle(); }}
            onMouseEnter={() => setHovered(n.id)}
            onMouseLeave={() => setHovered(null)}
            style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center',
              padding:'10px 4px 7px', background:'transparent', border:'none',
              borderBottom: active ? `2px solid ${color}` : '2px solid transparent',
              marginBottom:-1, cursor:'pointer', transition:'all .15s',
              opacity: active ? 1 : hot ? 0.75 : 0.45 }}>
            <span style={{ fontFamily:T.mono, fontSize:9.5, fontWeight:700, letterSpacing:'0.08em',
              color: active ? color : hot ? T.fg1 : T.fg3, transition:'color .15s', whiteSpace:'nowrap' }}>
              {n.label}
            </span>
            <span style={{ fontFamily:T.mono, fontSize:7.5, color: active ? color : T.fg4,
              letterSpacing:'0.04em', marginTop:3, opacity: active ? 0.75 : 0.5 }}>
              {n.years}
            </span>
          </button>
        );
      })}
      {/* CONSULTING tab — same mechanics, toggles section 02 */}
      <button type="button"
        onClick={() => { onSelect(null); onSelectClient(null); onConsultingToggle(); }}
        onMouseEnter={() => setHovered('consulting')}
        onMouseLeave={() => setHovered(null)}
        style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center',
          padding:'10px 4px 7px', background:'transparent', border:'none',
          borderBottom: consultingOpen ? `2px solid ${T.steel}` : '2px solid transparent',
          marginBottom:-1, cursor:'pointer', transition:'all .15s',
          opacity: consultingOpen ? 1 : hovered==='consulting' ? 0.75 : 0.45 }}>
        <span style={{ fontFamily:T.mono, fontSize:9.5, fontWeight:700, letterSpacing:'0.08em',
          color: consultingOpen ? T.steel : hovered==='consulting' ? T.fg1 : T.fg3,
          transition:'color .15s', whiteSpace:'nowrap' }}>
          CONSULTING
        </span>
        <span style={{ fontFamily:T.mono, fontSize:7.5, color: consultingOpen ? T.steel : T.fg4,
          letterSpacing:'0.04em', marginTop:3, opacity: consultingOpen ? 0.75 : 0.5 }}>
          2019–24
        </span>
      </button>
    </div>
  );
}

// ── 02 Select Consulting Work ─────────────────────────────────────────────────
// Closed: ultra-compressed spine cards (mirrors FT catalogue mode)
// Open:   full TribTiles with expand/collapse
function ConsultingSection({ selectedClient, onSelectClient, open, onToggle }) {
  return (
    <div style={{ marginTop:8 }}>
      <div style={{ display:'flex', alignItems:'center', padding:'10px 0 8px',
        borderTop:`1px solid ${T.border}` }}>
        <SectionLabel index="02">Select Consulting Work</SectionLabel>
      </div>

      {/* CLOSED — spine cards, symmetrical with FT catalogue mode */}
      {!open && (
        <div style={{ display:'flex', flexDirection:'column', gap:3 }}>
          {CONSULTING_CLIENTS.map(c => (
            <div key={c.id}
              onClick={() => { onToggle(); onSelectClient(c.id); }}
              style={{ display:'flex', alignItems:'center', gap:10, padding:'7px 14px',
                borderRadius:7, cursor:'pointer', transition:'opacity .15s',
                border:`1px solid ${T.steel}22`,
                background:'linear-gradient(160deg,rgba(255,255,255,.03),rgba(0,0,0,.12))',
                opacity:0.75 }}
              onMouseEnter={e => e.currentTarget.style.opacity='1'}
              onMouseLeave={e => e.currentTarget.style.opacity='0.75'}>
              <span style={{ color:T.steel, fontSize:11 }}>◻</span>
              <span style={{ fontFamily:T.mono, fontSize:9, fontWeight:700,
                letterSpacing:'0.08em', color:T.steel, textTransform:'uppercase' }}>
                {c.label}
              </span>
              <span style={{ marginLeft:'auto', fontFamily:T.mono, fontSize:8, color:T.fg4 }}>
                {c.domain} · {c.dates}
              </span>
            </div>
          ))}
        </div>
      )}

      {/* OPEN — full TribTiles */}
      {open && (
        <div style={{ display:'flex', flexDirection:'column', gap:6, paddingTop:6,
          animation:'slideDown .15s ease both' }}>
          {CONSULTING_CLIENTS.map(c => (
            <TribTile key={c.id} label={c.label.toUpperCase()} glyph="◻" color={T.steel}
              meta={`${c.domain} · ${c.dates}`}
              expanded={selectedClient === c.id ? (
                <div style={{ animation:'slideDown .18s ease both' }}>
                  <div style={{ display:'flex', alignItems:'baseline', gap:10, marginBottom:14 }}>
                    <span style={{ fontFamily:T.sans, fontSize:'1.7rem', fontWeight:700,

// ── NCI counter ───────────────────────────────────────────────────────────────
function NCICount({ target=87 }) {
  const [n,setN] = useState(0);
  useEffect(() => {
    let s=null;
    const dur=1100;
    function step(ts) { if(!s)s=ts; const p=Math.min((ts-s)/dur,1); setN(Math.round((1-Math.pow(1-p,3))*target)); if(p<1)requestAnimationFrame(step); }
    requestAnimationFrame(step);
  }, []);
  return <>{n}</>;
}
