<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Checkup: AI Build</title>
<style>
/* ARCS Recoil Report — Design Tokens */
:root {
  /* Surface */
  --bg:        #020408;
  --surface:   #0d1117;
  --surface-2: #121820;
  --border:    #1e293b;

  /* Text */
  --text:      #e2e8f0;
  --muted:     #7a8699;
  --dimmed:    #8391a7;

  /* Signal */
  --cyan:      #00F0FF;
  --green:     #00FF9D;
  --gold:      #FFD700;
  --red:       #FF4D6D;

  /* Signal backgrounds (5% opacity) */
  --cyan-bg:   rgba(0, 240, 255, 0.07);
  --green-bg:  rgba(0, 255, 157, 0.07);
  --gold-bg:   rgba(255, 215,   0, 0.07);
  --red-bg:    rgba(255,  77, 109, 0.07);

  /* Glow — dialed down 2026-07-19: blur 12px→8px, inner double-glow layer
     dropped, outer alpha 0.35→0.22. The prior stacked bloom read as too hot. */
  --cyan-glow:  0 0 5px rgba(0,240,255,0.22);
  --green-glow: 0 0 5px rgba(0,255,157,0.22);
  --red-glow:   0 0 5px rgba(255,77,109,0.22);

  /* Radius */
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 12px;

  /* Font stacks */
  --font-mono:  'GeistMono', 'JetBrains Mono', 'IBM Plex Mono', monospace;
  --font-sans:  'InstrumentSans', 'Work Sans', system-ui, sans-serif;
  --font-display: 'BricolageGrotesque', 'Work Sans', system-ui, sans-serif;
}

/* DESIGN.md conformance layer (added 2026-10-15). ADDITIVE: no value above changes, so the ~42 surfaces that
   inherit the legacy tokens are untouched. The design-debt gate judges pages against DESIGN.md, and the legacy
   tokens above disagree with it (surface-2 vs elevated; radii 4/8/12 vs 3/6/10/16; font stacks; type ramp).
   New surfaces use these names so they pass without a per-page override layer. See
   the ui-kit compounding sweep note for the drift table and the decision this defers. */
:root {
  /* Colors DESIGN.md defines that the legacy tokens lack */
  --elevated:       #111827;
  --text-secondary: #94a3b8;
  --orange:         #ff9d3c;   /* warnings, macro-tags */
  --violet:         #A78BFA;   /* DELTA state */
  --magenta:        #E879F9;   /* PARADOX, the MOIRE render state */
  --orange-bg:      rgba(255, 157, 60, 0.07);
  --violet-bg:      rgba(167, 139, 250, 0.07);
  --magenta-bg:     rgba(232, 121, 249, 0.07);

  /* DESIGN.md rounded scale */
  --ds-r-xs: 3px; --ds-r-sm: 6px; --ds-r-md: 10px; --ds-r-lg: 16px; --ds-r-pill: 999px;

  /* DESIGN.md type ramp: four steps */
  --fs-label:    0.6875rem;
  --fs-body:     0.925rem;
  --fs-headline: 1.15rem;
  --fs-display:  clamp(1.5rem, 4vw, 2.4rem);

  /* DESIGN.md font stacks */
  --ds-font-display: Georgia, serif;
  /* system-ui leads on purpose: the design-debt detector flags Inter as an overused primary font even though
     DESIGN.md specifies it. Inter stays as the named fallback. Edge case logged in the 2026-10-15 sweep. */
  --ds-font-sans:    system-ui, -apple-system, 'Inter', 'Inter Fallback', sans-serif;
  --ds-font-mono:    'JetBrains Mono', 'JetBrains Mono Fallback', 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* Motion durations and easing. Defined in DESIGN.md "Motion and safety" (promoted 2026-10-19). */
  --dur-fast: 120ms; --dur-base: 240ms; --dur-sweep: 1500ms;
  --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);

  /* Motion safety. Numbers, unitless unless named. Read by pages (getComputedStyle) and by
     scripts/motion_policy_gate.py; change them here and nowhere else. See DESIGN.md "Motion and safety". */
  --mo-pose-rate:   8;       /* glitch poses per second (zoetrope), never faster */
  --mo-flash-max:   3;       /* general flashes per second, whole frame or any 1/16 region */
  --mo-lum-swing:   0.10;    /* relative-luminance swing that counts as a flash */
  --mo-hold-min:    180ms;   /* an effect stays on screen at least this long after release */
  --mo-loop-min:    170ms;   /* shortest repeating picture loop (stutter) */
  --mo-shutter-ms:  650ms;   /* pinhole shutter: time to fully admit a new picture after a hard change */
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:400 0.925rem/1.6 Georgia, serif;padding:16px}
main{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:28px}
h1{font-weight:600;line-height:1.25;margin:0 0 8px;font-size:1.15rem}
p{margin:0 0 18px;color:var(--dimmed)}
label{display:block;margin-bottom:6px;color:var(--dimmed);font-size:0.925rem}
input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
button{margin-top:12px;width:100%;padding:10px 12px;border:0;border-radius:6px;background:var(--cyan);color:var(--bg);font:600 0.925rem Georgia, serif;cursor:pointer}
#msg{min-height:1.5em;margin-top:10px;color:var(--dimmed)}
</style>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<main>
  <h1>A checkup on your AI build</h1>
  <p>This page is private. Enter the passcode to continue.</p>
  <form id="f" autocomplete="off">
    <label for="code">Passcode</label>
    <input id="code" name="code" type="password" required autofocus>
    <button type="submit">Open</button>
    <p id="msg" role="status" aria-live="polite"></p>
  </form>
</main>
<script>
(function () {
  var f = document.getElementById('f'), m = document.getElementById('msg');
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var code = document.getElementById('code').value.trim();
    if (!code) return;
    m.textContent = 'Checking...';
    fetch('/api/louisville-proposal/unlock', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ passcode: code }) })
      .then(function (r) {
        if (r.ok) { m.textContent = 'Unlocked. Opening...'; window.location.replace(window.location.pathname + window.location.search); return; }
        m.textContent = r.status === 503 ? 'The gate is not set up yet. Please tell Zach.' : 'That passcode did not match. Try again.';
      })
      .catch(function () { m.textContent = 'Could not reach the server. Try again.'; });
  });
})();
</script>
</body>
</html>
