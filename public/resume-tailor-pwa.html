function inferTheme(jobUrlOrText) {
  if (!jobUrlOrText) return 'neutral';
  const t = jobUrlOrText.toLowerCase();
  const formal = /\b(finance|legal|healthcare|health care|enterprise|consulting|regulated|fortune|f500|banking|insurance|pharma|government|defense|compliance|sec|finra|hipaa|corporate)\b/;
  const casual = /\b(early.?stage|startup|team of \d|product.?led|consumer|creative|move fast|disrupt|vc|venture|y combinator| YC |saas|tech ?startup|app|platform|growth)\b/;
  if (formal.test(t) && !casual.test(t)) return 'formal';
  if (casual.test(t) && !formal.test(t)) return 'casual';
  return 'neutral';
}

const SECTIONS = [
  { id: 'overview', title: 'The one rule', sub: 'the moat', body: "Most AI resume tools optimize for impressive. This one optimizes for defensibly true. It decomposes every claim into hard / soft / tacit, attaches the evidence and a verifiability grade, and never states what the evidence can't defend. Impressive-but-false is a ruin vector, not a rounding error — a resume goes through background and reference checks. A claim that sounds good but is false is worse than a weaker true claim. Proficiency scores are provisional hypotheses the falsifier exists to confirm, never facts asserted on your behalf." },
  { id: 'how-it-works', title: 'How it works', sub: 'the pipeline', body: "1. You draft a claim. 2. The engine runs it through ARCS: hard facts (verifiable now), soft signals (corroborating but not definitive), tacit (the craft and judgment only you have). 3. Each claim gets a verifiability grade: A (documented to a standard a skeptical reader would accept), B (pointed at evidence but not yet locked), C (defensible if the reader shares your frame). 4. Anything below C gets flagged or dropped. The output is your resume plus an audit trail — every claim traceable to its evidence, nothing asserted without a grade. This is the same pipeline the ARCS decision engine uses for boardroom-grade decisions; here it's tuned for credentials." },
  { id: 'evidence', title: 'Evidence pipeline', sub: 'the hard layer', body: "Hard evidence is the layer that survives scrutiny. The engine prioritizes: verifiable metrics (years, scope, revenue, headcount, latency, throughput), named tools and standards (RFCs, certifications, language versions, frameworks with version numbers), direct artifacts (links to code, papers, shipped features, press). Soft signals — team culture, leadership style, product taste — are tagged as such and never presented as hard. Tacit evidence — the judgment, the scrappiness, the taste — is acknowledged but never claimed as a fact on your behalf. The resume is the hard+soft stack; the tacit is the interview." },
  { id: 'who', title: 'Who this is for', sub: 'the reader', body: "People preparing resumes where the reader is skeptical and time-constrained: hiring managers, technical recruiters, founders doing their own searches, anyone who has seen enough impressive-but-false to be wary of it. The tool is especially useful when the stakes are high and the claims are easy to falsify: senior roles, specialist positions, career pivots where your narrative has to carry weight without tenure in the new domain. If your resume is already airtight and you're just formatting, this isn't the tool — but if you've ever worried a claim wouldn't survive a reference check, it is." },
  { id: 'install', title: 'Install', sub: 'go offline', body: "This surface is a PWA. Install it to use offline, add it to your home screen, and get the resume-tailor experience without a browser chrome. The install button is in the bottom-right corner. Once installed, the app caches the shell and the MUI theme engine locally — you can draft and review claims offline, and the evidence grades sync when you're back online. The manifest, service worker, and icons are bundled with this surface." },
