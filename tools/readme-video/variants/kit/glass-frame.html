<!-- Glass-box frame: one static primitive for every ARCS video frame (1920x1080).
     Reuse: inject the style block into the page head and the template body into the page body,
     replacing the LABEL placeholder with the sheet label, e.g. "02 / 08". Content must sit inside
     left/right 28px + padding and below top 64px (28 inset + 36 bar). No motion. -->
<style>
.gf{position:absolute;inset:28px;border:1px solid rgba(226,232,240,.10);border-radius:10px;pointer-events:none;z-index:5}
.gf-bar{position:absolute;left:0;right:0;top:0;height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(13,17,23,.55);border-bottom:1px solid rgba(226,232,240,.10);border-radius:9px 9px 0 0}
.gf-brand{display:flex;align-items:center;gap:10px}
.gf-brand svg{width:18px;height:18px;position:static}
.gf-name,.gf-label{font-family:JBM,ui-monospace,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#94a3b8}
.gf-label{letter-spacing:.08em}
.gf-ticks{position:absolute;left:0;top:0;pointer-events:none;z-index:5}
</style>
<template id="glass-frame">
<div class="gf"><div class="gf-bar"><div class="gf-brand"><svg viewBox="0 0 32 32" aria-label="ARCS"><g fill="none" stroke="#00F0FF" stroke-linecap="round"><path d="M16 15.5 C12 9.5 3.5 10 3.5 16.5 C3.5 23 12 22.5 16 15.5" stroke-width="3.2"/><path d="M16 15.5 C20 21.5 28.5 21 28.5 14.5 C28.5 8 20 8.5 16 15.5" stroke-width="2.1" opacity="0.8"/><path d="M14.4 18.3 C15 17.4 15.5 16.4 16 15.5 C16.5 14.6 17 13.7 17.6 12.8" stroke="#020408" stroke-width="4.2" stroke-linecap="butt"/><path d="M14.1 18.7 C15 17.4 15.5 16.4 16 15.5 C16.5 14.6 17 13.7 17.9 12.4" stroke-width="3.2" stroke-linecap="butt"/></g></svg><span class="gf-name">ARCS Field OS</span></div><span class="gf-label">{{LABEL}}</span></div></div>
<svg class="gf-ticks" width="1920" height="1080" viewBox="0 0 1920 1080"><g fill="none" stroke="rgba(0,240,255,.35)" stroke-width="1.5"><path d="M18 28 V18 H28"/><path d="M1892 18 H1902 V28"/><path d="M18 1052 V1062 H28"/><path d="M1892 1062 H1902 V1052"/></g></svg>
</template>
