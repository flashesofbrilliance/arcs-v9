# Active once this folder is its own repository. Inside arcs-v9 it is inert (GitHub only reads the root .github/).
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: make test
      - run: make demo
      - run: make export
      - uses: actions/upload-artifact@v4
        with:
          name: arcs-verb-eval-report
          path: build/export/
