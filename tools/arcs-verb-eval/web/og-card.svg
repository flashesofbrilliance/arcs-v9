<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#020408"/>
  <text x="80" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="84" fill="#e2e8f0" letter-spacing="-2">Check it</text>
  <text x="80" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="84" fill="#00F0FF" letter-spacing="-2">before you say it.</text>
  <text x="80" y="372" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#9aa7b8">Five steps. Each one gets a stamp: go or stop.</text>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600">
    <line x1="120" y1="486" x2="1000" y2="486" stroke="#1e293b" stroke-width="3"/>
    <line x1="120" y1="486" x2="780" y2="486" stroke="#00FF9D" stroke-width="3"/>
    <g fill="#020408" stroke-width="3">
      <circle cx="120" cy="486" r="22" stroke="#00FF9D"/><circle cx="340" cy="486" r="22" stroke="#00FF9D"/>
      <circle cx="560" cy="486" r="22" stroke="#00FF9D"/><circle cx="780" cy="486" r="22" stroke="#FF4D6D"/>
      <circle cx="1000" cy="486" r="22" stroke="#00F0FF"/>
    </g>
    <g fill="#e2e8f0" text-anchor="middle">
      <text x="120" y="494">1</text><text x="340" y="494">2</text><text x="560" y="494">3</text><text x="780" y="494">4</text><text x="1000" y="494">5</text>
    </g>
    <g fill="#9aa7b8" text-anchor="middle" font-weight="500" font-size="20">
      <text x="120" y="548">Find the facts</text><text x="340" y="548">Check the facts</text><text x="560" y="548">Poke holes</text>
      <text x="780" y="548" fill="#FF4D6D">Make it short</text><text x="1000" y="548">Write the note</text>
    </g>
  </g>
  <text x="1120" y="600" text-anchor="end" font-family="Menlo, monospace" font-size="20" fill="#475569">honest.arcs.care</text>
</svg>
